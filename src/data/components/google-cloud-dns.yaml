id: google-cloud-dns
name: Google Cloud DNS
category: delivery-network
type_id: dns
vendor_url: https://cloud.google.com/dns
description: Google's managed authoritative DNS with 100% uptime SLA
is: Google Cloud's globally distributed, managed authoritative DNS service that offers 100% availability SLA, DNSSEC support, and tight integration with GCP resources
gain:
  - 100% availability SLA backed by Google's global anycast network
  - Deep GCP integration with Cloud Load Balancing and GKE
  - DNSSEC support with automatic key management
cost:
  - GCP-only; priced per managed zone and per query
  - Fewer routing policies compared to Route 53
  - Limited feature set outside the GCP ecosystem
tags:
  - dns
  - networking
  - managed
  - gcp
  - google-cloud-dns
base_metrics:
  - id: resolution-latency
    value: low
    numeric_value: 3
    category: performance
  - id: global-availability
    value: high
    numeric_value: 10
    category: reliability
  - id: operational-complexity
    value: low
    numeric_value: 2
    category: operational-complexity
  - id: gcloud-dns-cost-efficiency
    value: high
    numeric_value: 7
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard
    description: >-
      Cloud DNS: Google's anycast resolvers at the lowest price in the catalog. Plain, reliable name resolution.
    docs_url: https://cloud.google.com/dns/docs/overview
    monthly_cost: 3
    max_rps: 60000
    base_latency_ms: 2
    metrics:
      - id: resolution-latency
        value: low
        numeric_value: 3
        category: performance
      - id: global-availability
        value: high
        numeric_value: 9
        category: reliability
      - id: gcloud-dns-cost-efficiency
        value: high
        numeric_value: 8
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Google Cloud DNS — Standard DNS query test
        dig @ns1.example.com example.com A +short
        # Verify resolution latency
        dig example.com +stats | grep "Query time"
    metric_explanations:
      resolution-latency:
        reason: Google Cloud DNS Standard answers from Google anycast name servers that share the same IP block as GCP's premium backbone, so the BGP path to the nearest PoP is short and resolution stays in the low single-digit milliseconds.
        contributing_factors:
          - Anycast ns-cloud-* name servers announced from every Google edge PoP
          - Zone records served from in-memory authoritative replicas, not disk lookups
          - Short default record TTLs propagate edits in seconds without re-querying upstream
      global-availability:
        reason: Google Cloud DNS Standard publishes each zone across four independent anycast name-server clusters, so a regional or cluster failure is absorbed by BGP withdrawal without losing authority for the zone.
        contributing_factors:
          - Four diverse ns-cloud name-server sets per zone (-a through -d)
          - BGP anycast withdraws an unhealthy PoP and reroutes resolvers automatically
          - Authoritative data replicated synchronously across Google's control plane
      gcloud-dns-cost-efficiency:
        reason: Google Cloud DNS Standard charges a flat per-managed-zone fee plus a low per-million-query rate, so small public zones with steady traffic cost only a few dollars a month.
        contributing_factors:
          - Flat $0.20-per-zone monthly fee covers the first 25 zones
          - Per-query billing tapers after the first billion lookups
          - No charge for serving DNSSEC-signed responses on Standard zones
  - id: premium
    name: Premium
    description: >-
      Cloud DNS premium: faster answers, higher query ceiling, and routing policies — the upgrade when DNS becomes part of your traffic strategy instead of a lookup table.
    docs_url: https://cloud.google.com/dns/docs/policies-overview
    monthly_cost: 12
    max_rps: 80000
    base_latency_ms: 1
    metrics:
      - id: resolution-latency
        value: low
        numeric_value: 2
        category: performance
      - id: global-availability
        value: high
        numeric_value: 10
        category: reliability
      - id: gcloud-dns-cost-efficiency
        value: medium
        numeric_value: 6
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Google Cloud DNS — Premium DNS query test
        dig @ns1.example.com example.com A +short
        # Verify resolution latency
        dig example.com +stats | grep "Query time"
    metric_explanations:
      resolution-latency:
        reason: Google Cloud DNS Premium adds geo-location and weighted routing policies evaluated at the anycast edge, returning the closest healthy answer in roughly a millisecond without a round trip back to a region.
        contributing_factors:
          - Routing-policy logic resolved in-line at the edge PoP, not at origin
          - Geo and weighted policies steer resolvers to the nearest healthy target
          - Anycast premium-tier path keeps the resolver-to-name-server hop minimal
      global-availability:
        reason: Google Cloud DNS Premium layers health-checked failover routing policies on top of the four anycast name-server clusters, so a failing endpoint is dropped from answers within a check interval while authority itself never goes down.
        contributing_factors:
          - Health-checked routing policies remove unhealthy targets from responses
          - Four anycast name-server sets keep zone authority continuously online
          - Automatic failover policy promotes a backup target without manual edits
      gcloud-dns-cost-efficiency:
        reason: Google Cloud DNS Premium bills the routing-policy and health-check features per query and per check on top of the zone fee, so the richer steering raises cost for high-traffic zones versus plain Standard resolution.
        contributing_factors:
          - Routing policies metered per resolution add to the base query charge
          - Per-endpoint health checks billed hourly regardless of query volume
          - Justified only when geo or failover steering is actually required
connection_properties:
  protocol: DNS/UDP
  communication_patterns:
    - request-response
  typical_latency: 5-45ms
  co_location_potential: false
ports:
  - id: http-in
    type: http
    direction: in
  - id: http-out
    type: http
    direction: out
  - id: monitor-out
    type: monitor
    direction: out
