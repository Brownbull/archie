id: opensearch
name: OpenSearch
category: search
type_id: search-engine
vendor_url: https://opensearch.org/
description: AWS-backed open-source fork of Elasticsearch with integrated dashboards
is: An open-source search and analytics suite forked from Elasticsearch, offering full-text search, log analytics, and built-in dashboards with broad AWS ecosystem integration
gain:
  - Open-source with no license concerns
  - Integrated dashboards for log and search analytics
  - Drop-in Elasticsearch API compatibility
cost:
  - Lags upstream Elasticsearch in newer features
  - Cluster management complexity mirrors Elasticsearch
  - Dashboard plugin ecosystem smaller than Kibana
tags:
  - search
  - full-text
  - opensearch
  - analytics
  - aws
base_metrics:
  - id: query-latency
    value: low
    numeric_value: 4
    category: performance
  - id: index-freshness
    value: high
    numeric_value: 7
    category: reliability
  - id: horizontal-scalability
    value: high
    numeric_value: 8
    category: scalability
  - id: operational-complexity
    value: high
    numeric_value: 7
    category: operational-complexity
  - id: opensearch-cost-efficiency
    value: medium
    numeric_value: 5
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard
    description: >-
      OpenSearch standard: the Apache-licensed search fork, AWS-managed at a friendly entry price. Modest ceiling out of the box.
    docs_url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/what-is.html
    monthly_cost: 55
    max_rps: 3000
    base_latency_ms: 22
    metrics:
      - id: query-latency
        value: low
        numeric_value: 4
        category: performance
      - id: horizontal-scalability
        value: high
        numeric_value: 7
        category: scalability
      - id: operational-complexity
        value: high
        numeric_value: 7
        category: operational-complexity
      - id: opensearch-cost-efficiency
        value: medium
        numeric_value: 5
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // OpenSearch — Standard search query
        const results = await client.search({
          index: 'products',
          query: { match: { name: searchTerm } },
          size: 20,
          highlight: { fields: { name: {} } },
        })
    metric_explanations:
      query-latency:
        reason: OpenSearch Standard resolves full-text queries against Lucene inverted indices held in the OS page cache, keeping single-shard term lookups fast at moderate request volumes.
        contributing_factors:
          - Lucene inverted-index postings lists resolve term matches without table scans
          - OS page cache keeps hot segments in memory, avoiding disk reads on repeated queries
          - Query-phase coordination fans out to one replica per shard to spread CPU
      horizontal-scalability:
        reason: OpenSearch Standard scales by splitting each index into primary shards spread across data nodes, so adding nodes increases parallel query and indexing capacity.
        contributing_factors:
          - Index sharding parallelizes search and indexing across data nodes
          - Replica shards add read throughput and survive single-node loss
          - Shard allocation awareness spreads copies across availability zones
      operational-complexity:
        reason: OpenSearch Standard is self-managed, so operators own JVM heap tuning, shard sizing, and cluster-state health on top of the bundled Dashboards and security plugins.
        contributing_factors:
          - JVM heap and field-data circuit breakers require manual tuning to avoid OOM
          - Shard count and sizing must be planned to keep cluster state stable
          - Bundled OpenSearch Dashboards covers observability but rolling upgrades are operator-driven
  - id: optimized
    name: Optimized
    description: >-
      Optimized OpenSearch: better instances and tuned storage close most of the gap to Elasticsearch at 2.5x the family's base ceiling.
    docs_url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/bp.html
    monthly_cost: 120
    max_rps: 8000
    base_latency_ms: 15
    metrics:
      - id: query-latency
        value: low
        numeric_value: 3
        category: performance
      - id: horizontal-scalability
        value: high
        numeric_value: 9
        category: scalability
      - id: operational-complexity
        value: medium
        numeric_value: 5
        category: operational-complexity
      - id: opensearch-cost-efficiency
        value: low
        numeric_value: 3
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // OpenSearch — Optimized search query
        const results = await client.search({
          index: 'products',
          query: { match: { name: searchTerm } },
          size: 20,
          highlight: { fields: { name: {} } },
        })
    metric_explanations:
      query-latency:
        reason: OpenSearch Optimized cuts tail latency by warming segments onto local NVMe and enabling request caching plus search-thread pool sizing, so aggregation-heavy queries return faster than on the Standard tier.
        contributing_factors:
          - Local NVMe-backed segments eliminate cold-shard disk seeks
          - Shard request cache memoizes repeated aggregation and filter results
          - Larger search thread pool sustains higher concurrent query fan-out
      horizontal-scalability:
        reason: OpenSearch Optimized adds dedicated coordinator and data node roles plus more primary shards, letting indexing and search scale independently to higher request rates.
        contributing_factors:
          - Dedicated coordinator nodes offload result aggregation from data nodes
          - Higher primary-shard counts increase indexing and query parallelism
          - Role separation lets ingest and search capacity scale independently
      operational-complexity:
        reason: OpenSearch Optimized lowers operator burden with index State Management policies and rollover automation, though heap, shard, and node-role tuning still require expertise.
        contributing_factors:
          - Index State Management automates rollover, hot-warm transitions, and deletion
          - Snapshot policies schedule backups to a repository without manual triggers
          - Node-role separation simplifies capacity planning versus a flat cluster
connection_properties:
  protocol: HTTPS
  communication_patterns:
    - request-response
  typical_latency: 5-50ms
  co_location_potential: false
ports:
  - id: db-in
    type: database
    direction: in
  - id: monitor-out
    type: monitor
    direction: out
