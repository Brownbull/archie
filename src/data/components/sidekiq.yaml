id: sidekiq
name: Sidekiq
category: compute
type_id: worker
vendor_url: https://sidekiq.org/
description: Ruby background job framework using Redis for job storage, known for efficiency and simplicity
is: A Ruby background job framework that uses Redis for job storage and multi-threaded workers for efficient processing, offering retries, scheduled jobs, batches, and a real-time web dashboard for monitoring
gain:
  - Multi-threaded — handles many jobs per process efficiently
  - Simple API with automatic retries and scheduling
  - Built-in web dashboard for monitoring and managing jobs
cost:
  - Ruby-only — not usable from other language ecosystems
  - Redis is a hard dependency for job storage
  - Enterprise features (batches, rate limiting) require a paid license
tags:
  - worker
  - background-jobs
  - ruby
  - sidekiq
  - task-queue
base_metrics:
  - id: job-throughput
    value: high
    numeric_value: 8
    category: performance
  - id: worker-concurrency
    value: high
    numeric_value: 7
    category: scalability
  - id: task-reliability
    value: high
    numeric_value: 7
    category: reliability
  - id: operational-complexity
    value: low
    numeric_value: 4
    category: operational-complexity
  - id: sidekiq-cost-efficiency
    value: high
    numeric_value: 8
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard
    monthly_cost: 40
    max_rps: 4000
    base_latency_ms: 20
    metrics:
      - id: worker-concurrency
        value: medium
        numeric_value: 6
        category: scalability
      - id: job-throughput
        value: high
        numeric_value: 7
        category: performance
      - id: sidekiq-cost-efficiency
        value: high
        numeric_value: 8
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Sidekiq — Standard background job
        import { Queue, Worker } from 'bullmq'

        const queue = new Queue('tasks', { connection: { host: process.env.REDIS_HOST } })
        new Worker('tasks', async (job) => {
          await processJob(job.data)
        }, { concurrency: 5 })
    metric_explanations:
      worker-concurrency:
        reason: A standard Sidekiq process runs a fixed thread pool (default around ten threads) that each pull and execute jobs in parallel, so one process handles many jobs at once as long as the work is I/O-bound enough to overlap under Ruby's GVL.
        contributing_factors:
          - One process multiplexes jobs across its thread pool instead of forking a worker per job
          - Concurrency is capped by the configured pool size and the Redis client connection pool it shares
      job-throughput:
        reason: Each worker thread does a blocking BRPOP-style fetch from Redis queues and runs the job inline, so throughput tracks how fast the threads can pop from Redis and complete short jobs.
        contributing_factors:
          - Redis-backed queues give near-constant-time enqueue and pop for fast job hand-off
          - Strict queue ordering lets high-priority queues drain ahead of lower ones
      sidekiq-cost-efficiency:
        reason: The open-source standard tier packs heavy concurrency into a single Ruby process backed by one Redis instance, so a small footprint clears a large job volume without per-job infrastructure or license cost.
        contributing_factors:
          - Open-source Sidekiq with only a shared Redis as its dependency
          - High threads-per-process density means fewer worker processes for a given job rate
  - id: enterprise
    name: Enterprise
    monthly_cost: 90
    max_rps: 10000
    base_latency_ms: 15
    metrics:
      - id: worker-concurrency
        value: high
        numeric_value: 8
        category: scalability
      - id: job-throughput
        value: high
        numeric_value: 9
        category: performance
      - id: sidekiq-cost-efficiency
        value: medium
        numeric_value: 6
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Sidekiq — Enterprise background job
        import { Queue, Worker } from 'bullmq'

        const queue = new Queue('tasks', { connection: { host: process.env.REDIS_HOST } })
        new Worker('tasks', async (job) => {
          await processJob(job.data)
        }, { concurrency: 5 })
    metric_explanations:
      worker-concurrency:
        reason: The Enterprise license runs more worker processes and larger thread pools while adding rate limiting and unique-job locks, so concurrency scales further without duplicate or thundering-herd jobs overwhelming downstream systems.
        contributing_factors:
          - Multiple processes plus larger per-process thread pools raise total parallel job slots
          - Enterprise concurrency limiters and unique jobs throttle hot job types so added threads stay productive
      job-throughput:
        reason: Enterprise batches and reliable fetch let many worker threads churn through large job sets while tracking batch completion, pushing total throughput above the standard tier on the same Redis-backed queues.
        contributing_factors:
          - Batches group thousands of jobs with callbacks so high volumes flow without per-job bookkeeping
          - Reliable fetch re-queues interrupted jobs, keeping threads busy instead of stalling on crashes
      sidekiq-cost-efficiency:
        reason: Enterprise adds a paid per-seat license and runs more standing worker processes, so it trades some raw cost-per-job for rate limiting, batches, and reliability features that a heavy production workload needs.
        contributing_factors:
          - Commercial Enterprise license adds a recurring fee on top of the open-source core
          - Extra always-on worker processes raise baseline compute cost versus the single-process standard tier
connection_properties:
  protocol: AMQP
  communication_patterns:
    - publish-subscribe
  typical_latency: 10-200ms
  co_location_potential: true
ports:
  - id: stream-in
    type: stream
    direction: in
  - id: db-out
    type: database
    direction: out
  - id: cache-out
    type: cache
    direction: out
  - id: monitor-out
    type: monitor
    direction: out
