id: phoenix
name: Phoenix Channels
category: real-time
type_id: realtime
vendor_url: https://www.phoenixframework.org/
description: Elixir realtime framework with built-in WebSocket channels and massive concurrency via BEAM VM
is: An Elixir web framework with built-in WebSocket channels that leverages the BEAM VM for massive concurrency, offering presence tracking, PubSub, and fault-tolerant realtime messaging across distributed nodes
gain:
  - Massive concurrency from BEAM VM lightweight processes
  - Built-in presence tracking and PubSub out of the box
  - Fault-tolerant — process crashes are isolated and self-healing
cost:
  - Elixir/Erlang ecosystem is smaller than Node or Python
  - BEAM VM tuning and deployment is a niche skill
  - Clustering requires distributed Erlang or a PubSub adapter
tags:
  - realtime
  - websocket
  - elixir
  - phoenix
  - beam
base_metrics:
  - id: message-latency
    value: low
    numeric_value: 3
    category: performance
  - id: concurrent-connections
    value: high
    numeric_value: 9
    category: scalability
  - id: operational-complexity
    value: medium
    numeric_value: 5
    category: operational-complexity
  - id: phoenix-cost-efficiency
    value: high
    numeric_value: 7
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard
    monthly_cost: 60
    max_rps: 8000
    base_latency_ms: 4
    metrics:
      - id: message-latency
        value: low
        numeric_value: 3
        category: performance
      - id: concurrent-connections
        value: high
        numeric_value: 8
        category: scalability
      - id: phoenix-cost-efficiency
        value: high
        numeric_value: 7
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Phoenix Channels — Standard WebSocket connection
        import WebSocket from 'ws'

        const ws = new WebSocket(process.env.WS_URL!)
        ws.on('open', () => ws.send(JSON.stringify({ event: 'subscribe', channel: 'updates' })))
        ws.on('message', (data) => console.log('received:', data.toString()))
    metric_explanations:
      message-latency:
        reason: On a single node, Phoenix.PubSub dispatches channel broadcasts directly through the local BEAM process registry, so a message reaches subscribed sockets without leaving the VM or touching an external broker.
        contributing_factors:
          - Local PubSub delivery is in-VM message passing between Erlang processes, not a network round-trip
          - Each channel runs in its own lightweight BEAM process, so a slow subscriber does not block others
      concurrent-connections:
        reason: A single Phoenix node holds tens of thousands of WebSocket sockets because each connection is backed by a few-KB Erlang process rather than an OS thread, and the BEAM scheduler multiplexes them across all cores.
        contributing_factors:
          - Per-socket BEAM processes have tiny heap footprints, so connection count is bounded by RAM rather than threads
          - Preemptive BEAM scheduling keeps one chatty socket from starving the rest of the connection pool
      phoenix-cost-efficiency:
        reason: One commodity VM can serve a large channel fan-out on the open-source BEAM stack, so the standard single-node deployment delivers many concurrent connections per dollar with no broker or license fees.
        contributing_factors:
          - Open-source Elixir/Phoenix with no per-connection licensing or managed-broker cost
          - High socket density per node means fewer instances for a given connection target
  - id: clustered
    name: Clustered
    monthly_cost: 120
    max_rps: 20000
    base_latency_ms: 3
    metrics:
      - id: message-latency
        value: low
        numeric_value: 2
        category: performance
      - id: concurrent-connections
        value: high
        numeric_value: 9
        category: scalability
      - id: phoenix-cost-efficiency
        value: medium
        numeric_value: 5
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Phoenix Channels — Clustered WebSocket connection
        import WebSocket from 'ws'

        const ws = new WebSocket(process.env.WS_URL!)
        ws.on('open', () => ws.send(JSON.stringify({ event: 'subscribe', channel: 'updates' })))
        ws.on('message', (data) => console.log('received:', data.toString()))
    metric_explanations:
      message-latency:
        reason: Across a distributed-Erlang cluster the PubSub adapter gossips broadcasts node-to-node over the BEAM distribution channel, so a publish on one node reaches sockets on every node in a single hop with no central message bus to traverse.
        contributing_factors:
          - PubSub replicates broadcasts directly between clustered nodes rather than routing through an external broker
          - Phoenix.Presence CRDTs sync membership without a coordination round-trip, keeping fan-out latency flat
      concurrent-connections:
        reason: Clustering spreads sockets across multiple BEAM nodes joined by distributed Erlang, so the connection ceiling scales near-linearly with node count while PubSub keeps every node's subscribers in sync.
        contributing_factors:
          - Each added node contributes its own RAM-bound pool of lightweight per-socket processes
          - Distributed-Erlang mesh lets any node broadcast to sockets held anywhere in the cluster
      phoenix-cost-efficiency:
        reason: The clustered variant runs several always-on nodes plus inter-node distribution traffic, so it trades some per-connection economy for horizontal headroom and cross-node redundancy.
        contributing_factors:
          - Multiple standing nodes raise baseline spend versus a single instance
          - Distributed-Erlang chatter and presence CRDT sync add overhead that scales with cluster size
connection_properties:
  protocol: WebSocket/HTTPS
  communication_patterns:
    - publish-subscribe
  typical_latency: 5-60ms
  co_location_potential: true
ports:
  - id: http-in
    type: http
    direction: in
  - id: stream-in
    type: stream
    direction: in
  - id: stream-out
    type: stream
    direction: out
  - id: monitor-out
    type: monitor
    direction: out
