id: google-cloud-sql
name: Google Cloud SQL
category: data-storage
type_id: relational-db
vendor_url: https://cloud.google.com/sql
description: Fully managed MySQL/PostgreSQL/SQL Server with automatic replication and backups
is: A fully managed relational database service on Google Cloud providing high availability, automated backups, and seamless scaling for MySQL, PostgreSQL, and SQL Server workloads
gain:
  - Fully managed with automatic patching and backups
  - Built-in high availability with regional failover
  - Seamless integration with Google Cloud services
cost:
  - Higher cost than self-managed databases at scale
  - Limited customization of database engine parameters
  - Vendor lock-in to Google Cloud platform
tags:
  - database
  - sql
  - relational
  - managed
  - gcp
base_metrics:
  - id: read-latency
    value: low
    numeric_value: 4
    category: performance
  - id: write-throughput
    value: medium
    numeric_value: 6
    category: performance
  - id: horizontal-scalability
    value: low
    numeric_value: 3
    category: scalability
  - id: data-durability
    value: high
    numeric_value: 9
    category: reliability
  - id: google-cloud-sql-cost-efficiency
    value: medium
    numeric_value: 5
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard
    description: >-
      Cloud SQL standard: managed Postgres/MySQL with backups and patching handled. One zone, one primary — maintenance windows are real.
    docs_url: https://cloud.google.com/sql/docs
    monthly_cost: 95
    max_rps: 4000
    base_latency_ms: 12
    write_ratio: 0.3
    write_distribution: primary
    metrics:
      - id: read-latency
        value: low
        numeric_value: 4
        category: performance
      - id: horizontal-scalability
        value: low
        numeric_value: 2
        category: scalability
      - id: data-durability
        value: high
        numeric_value: 8
        category: reliability
      - id: google-cloud-sql-cost-efficiency
        value: low
        numeric_value: 3
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Google Cloud SQL — Standard query
        import { Pool } from 'pg'

        const pool = new Pool({ connectionString: process.env.DATABASE_URL })
        const { rows } = await pool.query('SELECT id, name FROM users WHERE active = $1 LIMIT 100', [true])
    metric_explanations:
      read-latency:
        reason: A standalone Cloud SQL instance serves reads from a single primary backed by local SSD persistent disk and the engine's buffer cache (InnoDB or PostgreSQL shared_buffers), so warm B-tree index lookups return in low single-digit milliseconds without any cross-zone replica hop.
        contributing_factors:
          - SSD-backed persistent disk with the engine buffer pool keeps hot pages in memory
          - B-tree indexes turn point and range lookups into shallow page reads
          - Single-zone placement avoids cross-zone replication latency on the read path
      horizontal-scalability:
        reason: As a single-primary relational engine, Cloud SQL Standard scales reads only by adding asynchronous read replicas and scales writes vertically by resizing the primary's vCPU and memory — it does not shard a table across nodes, which is why horizontal scalability is low.
        contributing_factors:
          - All writes funnel through one primary; there is no built-in write sharding
          - Read replicas offload SELECT traffic but lag the primary asynchronously
          - Scaling up means a larger machine tier, not more cooperating nodes
      data-durability:
        reason: Durability rests on the managed write-ahead log (PostgreSQL WAL / MySQL binlog) flushed to replicated regional persistent disk, plus automated daily backups and continuous WAL archiving that enable point-in-time recovery to any second in the retention window.
        contributing_factors:
          - WAL/binlog fsync to durable persistent disk before commit acknowledgement
          - Automated managed backups plus retained transaction logs enable point-in-time recovery
          - Regional persistent disk replicates blocks across zones underneath the instance
  - id: ha-replica
    name: HA Replica
    description: >-
      Cloud SQL HA: a synchronous standby in another zone fails over automatically, with twice the read throughput. Roughly double the bill for the nines.
    docs_url: https://cloud.google.com/sql/docs/mysql/high-availability
    monthly_cost: 200
    max_rps: 8000
    base_latency_ms: 8
    write_ratio: 0.3
    write_distribution: primary
    metrics:
      - id: read-latency
        value: low
        numeric_value: 3
        category: performance
      - id: horizontal-scalability
        value: medium
        numeric_value: 5
        category: scalability
      - id: data-durability
        value: high
        numeric_value: 9
        category: reliability
      - id: google-cloud-sql-cost-efficiency
        value: low
        numeric_value: 3
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Google Cloud SQL — HA Replica query
        import { Pool } from 'pg'

        const pool = new Pool({ connectionString: process.env.DATABASE_URL })
        const { rows } = await pool.query('SELECT id, name FROM users WHERE active = $1 LIMIT 100', [true])
    metric_explanations:
      read-latency:
        reason: The HA configuration adds read replicas that absorb SELECT traffic off the primary, so read latency drops further as concurrent reads are spread across replicas while each still serves from its own SSD-backed buffer cache and B-tree indexes.
        contributing_factors:
          - Dedicated read replicas remove SELECT contention from the write primary
          - Each replica caches hot pages locally so warm index lookups stay sub-millisecond
          - Clients can route latency-sensitive reads to the nearest in-region replica
      horizontal-scalability:
        reason: HA improves read scale-out and availability via cross-zone replicas and automatic failover, but writes still serialize through a single primary, so it reaches only medium horizontal scalability rather than the linear scaling of a sharded store.
        contributing_factors:
          - Read replicas scale read capacity horizontally while writes remain single-primary
          - Synchronous standby enables fast failover but does not add write throughput
          - True write sharding still requires application-level partitioning, not the engine
      data-durability:
        reason: The HA tier keeps a synchronous standby in a second zone that receives every committed transaction before acknowledgement, so a zonal failure triggers automatic failover with zero committed-data loss, on top of the same WAL archiving and point-in-time recovery.
        contributing_factors:
          - Synchronous cross-zone standby commits each transaction before the primary acks
          - Automatic failover promotes the standby on zone loss with no committed-data loss
          - Continuous WAL/binlog archiving still backs point-in-time recovery to any second
connection_properties:
  protocol: TCP
  communication_patterns:
    - request-response
    - connection-pooling
  typical_latency: 1-10ms
  co_location_potential: true
ports:
  - id: db-in
    type: database
    direction: in
  - id: monitor-out
    type: monitor
    direction: out
