id: auth0
name: Auth0
category: auth-security
type_id: auth
vendor_url: https://auth0.com/
description: Hosted identity platform for login, social/SSO, and token issuance
is: A hosted identity-as-a-service platform handling login, social and enterprise SSO, MFA, and OAuth/OIDC token issuance, so apps delegate authentication instead of building it
gain:
  - Drop-in login, social, SSO, and MFA
  - Standards-based OAuth2 / OIDC tokens
  - Offloads a security-critical, high-stakes surface
cost:
  - Priced per monthly active user — scales with growth
  - Vendor dependency for a core auth path
  - Deep customization can hit platform limits
tags:
  - auth
  - identity
  - oauth
  - auth0
  - sso
base_metrics:
  - id: auth-latency
    value: low
    numeric_value: 4
    category: performance
  - id: auth-availability
    value: high
    numeric_value: 9
    category: reliability
  - id: token-security
    value: high
    numeric_value: 9
    category: security
  - id: operational-complexity
    value: low
    numeric_value: 2
    category: operational-complexity
  - id: auth0-cost-efficiency
    value: medium
    numeric_value: 5
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard
    monthly_cost: 35
    max_rps: 3000
    base_latency_ms: 120
    metrics:
      - id: auth-latency
        value: low
        numeric_value: 4
        category: performance
      - id: token-security
        value: high
        numeric_value: 9
        category: security
      - id: auth0-cost-efficiency
        value: high
        numeric_value: 7
        category: cost-efficiency
    code_snippet:
      language: javascript
      code: |
        // Auth0 — validate an incoming OIDC access token (JWKS-verified)
        import { auth } from "express-oauth2-jwt-bearer"
        app.use(auth({ audience: "https://api.example.com", issuerBaseURL: "https://tenant.us.auth0.com/" }))
    metric_explanations:
      token-security:
        reason: Standards-based OIDC with rotating JWKS keys, MFA, and anomaly detection hardens the auth surface beyond hand-rolled login.
        contributing_factors:
          - JWKS key rotation and signed JWTs
          - Built-in MFA and breached-password checks
          - Anomaly/bot detection on login
      auth0-cost-efficiency:
        reason: Low monthly-active-user counts fall in cheaper tiers; the platform replaces costly in-house auth maintenance.
        contributing_factors:
          - MAU-tiered pricing
          - No in-house auth team to fund
          - Free tier covers small apps
  - id: enterprise
    name: Enterprise (SSO + MFA)
    monthly_cost: 130
    max_rps: 5000
    base_latency_ms: 110
    metrics:
      - id: auth-availability
        value: high
        numeric_value: 10
        category: reliability
      - id: token-security
        value: high
        numeric_value: 10
        category: security
      - id: auth0-cost-efficiency
        value: low
        numeric_value: 3
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |
        # Auth0 — configure an enterprise SAML connection (SSO)
        auth0 api post "connections" --data '{"strategy":"samlp","name":"acme-sso","options":{"signInEndpoint":"https://idp.acme.com/sso"}}'
    metric_explanations:
      auth-availability:
        reason: Enterprise tiers add higher SLAs, multi-region tenancy, and isolated infrastructure for resilient login.
        contributing_factors:
          - Higher contractual SLA
          - Multi-region failover
          - Isolated/private cloud options
      auth0-cost-efficiency:
        reason: Enterprise SSO, advanced MFA, and higher MAU bands raise cost significantly over the standard tier.
        contributing_factors:
          - Enterprise connection pricing
          - Advanced MFA/attack-protection add-ons
          - Higher MAU commitments
connection_properties:
  protocol: HTTPS
  communication_patterns:
    - request-response
  typical_latency: 80-400ms
  co_location_potential: false
demand_responses:
  traffic-volume:
    high:
      auth-latency: 0.8
    extreme:
      auth-latency: 0.6
      auth-availability: 0.8
  concurrent-users:
    high:
      auth-latency: 0.8
    extreme:
      auth-latency: 0.6
ports:
  - id: http-in
    type: http
    direction: in
  - id: auth-out
    type: auth
    direction: out
  - id: monitor-out
    type: monitor
    direction: out
