id: neo4j
name: Neo4j
category: data-storage
type_id: graph-db
vendor_url: https://neo4j.com/
description: Native property-graph database with the Cypher query language
is: The market-leading native graph database storing nodes and relationships with index-free adjacency, queried in Cypher, with ACID transactions and a graph data-science library
gain:
  - Expressive Cypher query language purpose-built for graph patterns
  - Index-free adjacency gives constant-time hop traversal
  - Rich tooling — Bloom visualization, GDS algorithms, ACID guarantees
cost:
  - Write scaling is bounded — clustering scales reads, not writes
  - Memory-hungry; hot graph should fit in page cache for best latency
  - Enterprise clustering features sit behind a commercial license
tags:
  - database
  - graph
  - cypher
  - neo4j
  - relationships
