id: azure-blob
name: Azure Blob Storage
category: data-storage
type_id: object-storage
vendor_url: https://azure.microsoft.com/en-us/products/storage/blobs
description: Microsoft's massively scalable object storage with tiered access (hot/cool/archive)
is: A managed object storage service in Azure that stores unstructured data as blobs with automatic tiering across hot, cool, and archive access tiers for cost optimization at any scale
gain:
  - Hot/cool/archive tiers optimize cost by access pattern
  - Deep Azure ecosystem integration (Functions, Data Factory)
  - Geo-redundant replication options for disaster recovery
cost:
  - Egress and operation charges can surprise at scale
  - Archive tier retrieval latency measured in hours
  - Naming and SDK conventions differ from S3
tags:
  - storage
  - object
  - blob
  - azure
  - cloud
base_metrics:
  - id: query-latency
    value: medium
    numeric_value: 5
    category: performance
  - id: storage-scalability
    value: high
    numeric_value: 10
    category: scalability
  - id: data-durability
    value: high
    numeric_value: 10
    category: reliability
  - id: cost-per-gb
    value: high
    numeric_value: 8
    category: cost-efficiency
config_variants:
  - id: hot
    name: Hot
    monthly_cost: 22
    max_rps: 12000
    base_latency_ms: 14
    metrics:
      - id: storage-scalability
        value: high
        numeric_value: 10
        category: scalability
      - id: data-durability
        value: high
        numeric_value: 10
        category: reliability
      - id: cost-per-gb
        value: high
        numeric_value: 7
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Azure Blob Storage — Hot object operations
        # Upload
        aws s3 cp ./backup.tar.gz s3://my-bucket/backups/ --storage-class STANDARD
        # Download
        aws s3 cp s3://my-bucket/backups/backup.tar.gz ./restore.tar.gz
    metric_explanations:
      storage-scalability:
        reason: Azure Blob Storage Hot scales by spreading blobs across a flat namespace whose range-partition index Azure auto-splits as traffic grows, so a single account absorbs petabytes without manual provisioning.
        contributing_factors:
          - Flat namespace keyed by account, container, and blob name avoids directory limits
          - Range partitions auto-split and rebalance across the storage stamp under load
          - Capacity is provisioned on demand with no upfront volume sizing
      data-durability:
        reason: Azure Blob Storage Hot synchronously writes three replicas within a region via locally redundant storage and can extend to zone- or geo-redundant copies for higher durability.
        contributing_factors:
          - LRS keeps three synchronous replicas within a single data-center stamp
          - ZRS or GRS options spread copies across zones or a paired region
          - Soft delete and blob versioning recover overwritten or deleted objects
      cost-per-gb:
        reason: Azure Blob Storage Hot prices for frequent access, charging a higher per-GB storage rate but low read and transaction fees, making it economical for actively served data.
        contributing_factors:
          - Hot-tier storage rate is highest but read and operation charges are lowest
          - No early-deletion penalty, unlike the cool and archive tiers
          - Lifecycle policies can later demote idle blobs to cheaper tiers
  - id: cool
    name: Cool
    monthly_cost: 10
    max_rps: 5000
    base_latency_ms: 25
    metrics:
      - id: storage-scalability
        value: high
        numeric_value: 10
        category: scalability
      - id: data-durability
        value: high
        numeric_value: 10
        category: reliability
      - id: cost-per-gb
        value: high
        numeric_value: 9
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Azure Blob Storage — Cool object operations
        # Upload
        aws s3 cp ./backup.tar.gz s3://my-bucket/backups/ --storage-class STANDARD
        # Download
        aws s3 cp s3://my-bucket/backups/backup.tar.gz ./restore.tar.gz
    metric_explanations:
      storage-scalability:
        reason: Azure Blob Storage Cool uses the same auto-partitioned flat namespace as the hot tier, so it scales to the same petabyte-plus capacity while targeting infrequently accessed data.
        contributing_factors:
          - Shares the hot tier's range-partition index and auto-split scaling
          - Tier is a per-blob attribute, so capacity limits are identical to hot
          - Suited to large archival datasets that still need millisecond retrieval
      data-durability:
        reason: Azure Blob Storage Cool offers identical replication guarantees to the hot tier, with the same LRS, ZRS, and geo-redundant options independent of the chosen access tier.
        contributing_factors:
          - Same LRS, ZRS, and GRS redundancy choices as the hot tier
          - Access tier affects pricing, not the number of durable replicas
          - Soft delete and versioning protect cool blobs the same way
      cost-per-gb:
        reason: Azure Blob Storage Cool charges a markedly lower per-GB storage rate than hot in exchange for higher read and transaction fees plus a 30-day minimum retention.
        contributing_factors:
          - Lower per-GB storage rate suits data read less than once a month
          - Higher per-operation and data-retrieval fees offset the storage savings
          - 30-day minimum retention applies an early-deletion charge if removed sooner
connection_properties:
  protocol: HTTPS
  communication_patterns:
    - request-response
  typical_latency: 20-60ms
  co_location_potential: false
ports:
  - id: db-in
    type: database
    direction: in
  - id: monitor-out
    type: monitor
    direction: out
