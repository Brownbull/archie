id: google-cloud-cdn
name: Google Cloud CDN
category: delivery-network
type_id: cdn
vendor_url: https://cloud.google.com/cdn
description: GCP edge caching with tight GCS and Cloud Run integration
is: Google Cloud's content delivery network that caches content at Google's global edge points of presence, integrates tightly with Cloud Storage and Cloud Run origins, and leverages Google's premium-tier network for low-latency delivery
gain:
  - Tight integration with GCS, Cloud Run, and GKE origins
  - Leverages Google's premium-tier global backbone
  - Signed URLs and signed cookies for access control
cost:
  - GCP-only; egress and cache-fill fees apply
  - Fewer edge locations than CloudFront or Akamai
  - Cache invalidation is limited to URL-pattern-based purges
tags:
  - cdn
  - edge
  - gcp
  - google-cloud-cdn
  - caching
base_metrics:
  - id: edge-latency
    value: low
    numeric_value: 3
    category: performance
  - id: global-availability
    value: high
    numeric_value: 8
    category: reliability
  - id: operational-complexity
    value: low
    numeric_value: 3
    category: operational-complexity
  - id: gcloud-cdn-cost-efficiency
    value: medium
    numeric_value: 6
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard Caching
    description: >-
      Cloud CDN on Google's edge: anycast caching wired straight into GCP load balancing. Natural fit for GCP origins; unremarkable elsewhere.
    docs_url: https://cloud.google.com/cdn/docs/overview
    monthly_cost: 35
    max_rps: 90000
    base_latency_ms: 6
    metrics:
      - id: edge-latency
        value: low
        numeric_value: 3
        category: performance
      - id: global-availability
        value: high
        numeric_value: 8
        category: reliability
      - id: gcloud-cdn-cost-efficiency
        value: high
        numeric_value: 7
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Google Cloud CDN — Standard Caching cache status check
        curl -sI https://cdn.example.com/assets/app.js | grep -i "cache-status\|x-cache\|age"
        # Purge cached asset
        curl -X PURGE https://cdn.example.com/assets/app.js
    metric_explanations:
      edge-latency:
        reason: Google Cloud CDN Standard Caching serves cache hits from the Google Front End closest to the user over the same anycast VIP used by the load balancer, so warm objects return in single-digit milliseconds without touching the origin.
        contributing_factors:
          - Cache hits served at the Google Front End nearest the client
          - Single anycast VIP shared with the HTTP(S) load balancer routes to the closest PoP
          - Origin fetches only triggered on cache miss, then held by Cache-Control TTL
      global-availability:
        reason: Google Cloud CDN Standard Caching fronts the global external HTTP(S) load balancer, so the same anycast VIP is served from every Google PoP and a degraded PoP is withdrawn while others continue serving cached content.
        contributing_factors:
          - One global anycast VIP advertised from all Google edge PoPs
          - Backend health checks pull failing origins out of rotation
          - Cached objects keep serving from the edge even during an origin outage
      gcloud-cdn-cost-efficiency:
        reason: Google Cloud CDN Standard Caching bills cache egress at a lower rate than origin egress and charges a small per-10k cache-lookup fee, so a high cache-hit ratio on static assets keeps the per-request cost low.
        contributing_factors:
          - Cache-egress rates undercut serving the same bytes straight from the origin
          - Per-10,000 cache-lookup fee is small relative to avoided origin fetches
          - Cache-fill charges apply only on misses, rewarding a high hit ratio
  - id: premium
    name: Premium Tier
    description: >-
      Cloud CDN on the Premium network tier: traffic rides Google's backbone end-to-end for lower, steadier latency at a higher ceiling. You pay backbone prices for backbone behavior.
    docs_url: https://cloud.google.com/network-tiers/docs/overview
    monthly_cost: 80
    max_rps: 150000
    base_latency_ms: 4
    metrics:
      - id: edge-latency
        value: low
        numeric_value: 2
        category: performance
      - id: global-availability
        value: high
        numeric_value: 9
        category: reliability
      - id: gcloud-cdn-cost-efficiency
        value: medium
        numeric_value: 5
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Google Cloud CDN — Premium Tier cache status check
        curl -sI https://cdn.example.com/assets/app.js | grep -i "cache-status\|x-cache\|age"
        # Purge cached asset
        curl -X PURGE https://cdn.example.com/assets/app.js
    metric_explanations:
      edge-latency:
        reason: Google Cloud CDN Premium Tier keeps both the client hop and the cache-miss path on Google's private backbone end to end, so even origin fetches ride low-congestion fiber and warm hits return in a couple of milliseconds.
        contributing_factors:
          - Traffic enters and exits at the Google PoP nearest the user
          - Cache-fill traffic traverses Google's private backbone, not the public internet
          - Premium-tier egress avoids the congested transit hops Standard tier uses
      global-availability:
        reason: Google Cloud CDN Premium Tier carries traffic on Google's private global backbone from edge to origin, so cold-cache and dynamic requests avoid public-internet brownouts and inherit the backbone's redundant path diversity.
        contributing_factors:
          - Private backbone provides redundant, monitored paths between PoPs and origins
          - Global anycast VIP fails a degraded PoP over to healthy edges
          - Backbone routing sidesteps third-party transit congestion and outages
      gcloud-cdn-cost-efficiency:
        reason: Google Cloud CDN Premium Tier prices egress higher than Standard tier because it reserves Google's private backbone all the way to the user, so the latency gain comes at a per-GB premium that hurts cost efficiency on bulk traffic.
        contributing_factors:
          - Premium-tier egress carries a per-GB surcharge over Standard tier
          - Backbone reservation bills regardless of cache-hit ratio
          - Justified for latency-sensitive global apps, costly for bulk static delivery
connection_properties:
  protocol: HTTP
  communication_patterns:
    - request-response
  typical_latency: 10-80ms
  co_location_potential: false
ports:
  - id: cdn-in
    type: cdn
    direction: in
  - id: cdn-out
    type: cdn
    direction: out
  - id: http-in
    type: http
    direction: in
