id: elasticache
name: Amazon ElastiCache
category: data-storage
type_id: cache
vendor_url: https://aws.amazon.com/elasticache/
description: AWS managed Redis/Memcached with automatic failover and Multi-AZ
is: A fully managed in-memory caching service from AWS supporting Redis and Memcached engines, providing automatic failover, Multi-AZ deployment, and seamless integration with the AWS ecosystem
gain:
  - Fully managed with automatic patching and failover
  - Multi-AZ deployment for high availability
  - Seamless integration with AWS services and VPC networking
cost:
  - Higher cost than self-hosted Redis for equivalent resources
  - Limited to Redis and Memcached engine versions supported by AWS
  - Vendor lock-in to AWS infrastructure
tags:
  - database
  - nosql
  - in-memory
  - cache
  - managed
  - aws
base_metrics:
  - id: read-latency
    value: low
    numeric_value: 1
    category: performance
  - id: write-throughput
    value: high
    numeric_value: 8
    category: performance
  - id: horizontal-scalability
    value: medium
    numeric_value: 6
    category: scalability
  - id: data-durability
    value: medium
    numeric_value: 5
    category: reliability
  - id: elasticache-cost-efficiency
    value: medium
    numeric_value: 5
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard
    description: >-
      ElastiCache standard: managed Redis with AWS handling patching and failover wiring. The convenience markup over self-hosted Redis is the whole trade.
    docs_url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html
    monthly_cost: 55
    max_rps: 45000
    base_latency_ms: 1
    cache_hit_ratio: 0.82
    metrics:
      - id: read-latency
        value: low
        numeric_value: 2
        category: performance
      - id: horizontal-scalability
        value: low
        numeric_value: 3
        category: scalability
      - id: data-durability
        value: medium
        numeric_value: 5
        category: reliability
      - id: elasticache-cost-efficiency
        value: medium
        numeric_value: 5
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Amazon ElastiCache — Standard cache usage
        import Redis from 'ioredis'

        const redis = new Redis(process.env.REDIS_URL)
        const cached = await redis.get(`user:${userId}`)
        if (!cached) {
          const data = await fetchFromDB(userId)
          await redis.set(`user:${userId}`, JSON.stringify(data), 'EX', 3600)
        }
    metric_explanations:
      read-latency:
        reason: ElastiCache keeps the entire dataset in RAM and serves it over the Redis protocol from a single primary node, so GET operations are O(1) hash-table lookups returning in sub-millisecond time with no disk I/O on the hot path.
        contributing_factors:
          - Whole working set resides in memory — reads never touch persistent disk
          - O(1) key lookups in Redis's in-memory hash table dominate the access pattern
          - Placement inside the application VPC and AZ trims network round-trip latency
      horizontal-scalability:
        reason: A non-clustered (single-shard) primary/replica setup scales reads by attaching replica nodes but keeps all keys on one primary, so the keyspace cannot grow beyond a single node's memory — hence only low horizontal scalability in this mode.
        contributing_factors:
          - Single primary shard caps total dataset size at one node's memory
          - Replica nodes add read fan-out but hold a full copy, not a partition
          - Growing capacity here means a larger node type, not more shards
      data-durability:
        reason: Durability is moderate because ElastiCache is a cache first — it can enable AOF logging and take RDB snapshots to S3, and Multi-AZ replicas allow automatic failover, but the in-memory model means recent writes can still be lost on an unclean failure.
        contributing_factors:
          - Optional append-only file (AOF) plus periodic RDB snapshots to S3 provide backup points
          - Multi-AZ replica enables AWS-managed automatic failover on primary loss
          - As an in-memory store, un-snapshotted recent writes are not guaranteed to survive a crash
  - id: clustered
    name: Clustered
    description: >-
      Clustered ElastiCache: sharded managed Redis with a 150k ceiling and a better hit ratio from more memory. Scaling events are AWS's problem, not yours.
    docs_url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Clusters.html
    monthly_cost: 130
    max_rps: 150000
    base_latency_ms: 0.5
    cache_hit_ratio: 0.9
    metrics:
      - id: read-latency
        value: low
        numeric_value: 1
        category: performance
      - id: horizontal-scalability
        value: high
        numeric_value: 8
        category: scalability
      - id: data-durability
        value: medium
        numeric_value: 6
        category: reliability
      - id: elasticache-cost-efficiency
        value: low
        numeric_value: 3
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Amazon ElastiCache — Clustered cache usage
        import Redis from 'ioredis'

        const redis = new Redis(process.env.REDIS_URL)
        const cached = await redis.get(`user:${userId}`)
        if (!cached) {
          const data = await fetchFromDB(userId)
          await redis.set(`user:${userId}`, JSON.stringify(data), 'EX', 3600)
        }
    metric_explanations:
      read-latency:
        reason: In cluster mode each key maps to one of 16384 hash slots owned by a specific shard, so a slot-aware client connects straight to the node holding the key and gets the same sub-millisecond in-memory GET while requests parallelize across shards.
        contributing_factors:
          - 16384 hash slots distributed across shards let clients route directly to the owning node
          - Each shard's working set stays in RAM for O(1) lookups with no disk hop
          - Read replicas per shard absorb read fan-out close to the application
      horizontal-scalability:
        reason: Cluster mode partitions the keyspace across multiple primary shards via hash slots, so total memory and throughput scale by adding shards and online slot rebalancing redistributes data without downtime — giving high horizontal scalability.
        contributing_factors:
          - Hash-slot partitioning spreads keys across many primary shards
          - Adding shards and migrating slots online grows capacity without downtime
          - Aggregate memory and request throughput scale roughly linearly with shard count
      data-durability:
        reason: Clustered durability improves modestly over a single shard because each shard runs its own Multi-AZ replica for independent automatic failover, but it remains an in-memory cache where AOF and RDB snapshots, not synchronous disk commits, are the recovery mechanism.
        contributing_factors:
          - Per-shard Multi-AZ replicas give each partition independent automatic failover
          - AOF logging and RDB snapshots to S3 provide per-shard backup and restore points
          - In-memory design still risks loss of writes not yet captured in AOF or a snapshot
connection_properties:
  protocol: TCP
  communication_patterns:
    - request-response
    - pub-sub
  typical_latency: <1ms
  co_location_potential: true
ports:
  - id: db-in
    type: database
    direction: in
  - id: cache-in
    type: cache
    direction: in
  - id: monitor-out
    type: monitor
    direction: out
