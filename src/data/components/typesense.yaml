id: typesense
name: Typesense
category: search
type_id: search-engine
vendor_url: https://typesense.org/
description: Open-source search engine optimized for instant search with automatic typo correction
is: An open-source, in-memory search engine designed for instant search-as-you-type experiences with automatic typo correction, faceting, and a built-in high-availability clustering mode
gain:
  - In-memory indexing delivers sub-10ms searches
  - Built-in HA clustering with Raft consensus
  - Automatic typo correction and faceted search
cost:
  - In-memory model requires RAM proportional to dataset
  - Fewer advanced analytics features than Elasticsearch
  - Smaller plugin and integration ecosystem
tags:
  - search
  - full-text
  - typesense
  - instant-search
  - open-source
base_metrics:
  - id: query-latency
    value: low
    numeric_value: 3
    category: performance
  - id: index-freshness
    value: high
    numeric_value: 8
    category: reliability
  - id: horizontal-scalability
    value: high
    numeric_value: 7
    category: scalability
  - id: operational-complexity
    value: low
    numeric_value: 3
    category: operational-complexity
  - id: typesense-cost-efficiency
    value: medium
    numeric_value: 5
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard
    monthly_cost: 35
    max_rps: 3000
    base_latency_ms: 15
    metrics:
      - id: query-latency
        value: low
        numeric_value: 3
        category: performance
      - id: horizontal-scalability
        value: medium
        numeric_value: 6
        category: scalability
      - id: operational-complexity
        value: low
        numeric_value: 3
        category: operational-complexity
      - id: typesense-cost-efficiency
        value: medium
        numeric_value: 5
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Typesense — Standard search query
        const results = await client.search({
          index: 'products',
          query: { match: { name: searchTerm } },
          size: 20,
          highlight: { fields: { name: {} } },
        })
    metric_explanations:
      query-latency:
        reason: Typesense Standard queries time-series data efficiently through pre-aggregated rollups.
        contributing_factors:
          - Time-partitioned storage enables efficient range scans
          - Pre-computed rollups speed up aggregation queries
      horizontal-scalability:
        reason: Typesense Standard scales capacity by distributing load across nodes.
        contributing_factors:
          - Data partitioning distributes load across multiple nodes
          - Automatic rebalancing maintains even distribution as nodes are added
      operational-complexity:
        reason: Typesense Standard simplifies operations through managed infrastructure.
        contributing_factors:
          - Managed service handles patching, backups, and scaling automatically
          - Monitoring and alerting are built into the platform
  - id: ha-cluster
    name: HA Cluster
    monthly_cost: 80
    max_rps: 8000
    base_latency_ms: 10
    metrics:
      - id: query-latency
        value: low
        numeric_value: 2
        category: performance
      - id: horizontal-scalability
        value: high
        numeric_value: 8
        category: scalability
      - id: operational-complexity
        value: medium
        numeric_value: 4
        category: operational-complexity
      - id: typesense-cost-efficiency
        value: medium
        numeric_value: 5
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Typesense — HA Cluster search query
        const results = await client.search({
          index: 'products',
          query: { match: { name: searchTerm } },
          size: 20,
          highlight: { fields: { name: {} } },
        })
    metric_explanations:
      query-latency:
        reason: Typesense HA Cluster queries time-series data efficiently through pre-aggregated rollups.
        contributing_factors:
          - Time-partitioned storage enables efficient range scans
          - Pre-computed rollups speed up aggregation queries
      horizontal-scalability:
        reason: Typesense HA Cluster scales capacity by distributing load across nodes.
        contributing_factors:
          - Data partitioning distributes load across multiple nodes
          - Automatic rebalancing maintains even distribution as nodes are added
      operational-complexity:
        reason: Typesense HA Cluster simplifies operations through managed infrastructure.
        contributing_factors:
          - Managed service handles patching, backups, and scaling automatically
          - Monitoring and alerting are built into the platform
connection_properties:
  protocol: HTTPS
  communication_patterns:
    - request-response
  typical_latency: 5-50ms
  co_location_potential: false
ports:
  - id: db-in
    type: database
    direction: in
  - id: monitor-out
    type: monitor
    direction: out
