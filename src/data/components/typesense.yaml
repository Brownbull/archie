id: typesense
name: Typesense
category: search
type_id: search-engine
vendor_url: https://typesense.org/
description: Open-source search engine optimized for instant search with automatic typo correction
is: An open-source, in-memory search engine designed for instant search-as-you-type experiences with automatic typo correction, faceting, and a built-in high-availability clustering mode
gain:
  - In-memory indexing delivers sub-10ms searches
  - Built-in HA clustering with Raft consensus
  - Automatic typo correction and faceted search
cost:
  - In-memory model requires RAM proportional to dataset
  - Fewer advanced analytics features than Elasticsearch
  - Smaller plugin and integration ecosystem
tags:
  - search
  - full-text
  - typesense
  - instant-search
  - open-source
base_metrics:
  - id: query-latency
    value: low
    numeric_value: 3
    category: performance
  - id: index-freshness
    value: high
    numeric_value: 8
    category: reliability
  - id: horizontal-scalability
    value: high
    numeric_value: 7
    category: scalability
  - id: operational-complexity
    value: low
    numeric_value: 3
    category: operational-complexity
  - id: typesense-cost-efficiency
    value: medium
    numeric_value: 5
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard
    description: >-
      Typesense: open-source instant search tuned for low-latency suggestions. Single node, honest ceiling, tiny ops footprint.
    docs_url: https://typesense.org/docs/
    monthly_cost: 35
    max_rps: 3000
    base_latency_ms: 15
    metrics:
      - id: query-latency
        value: low
        numeric_value: 3
        category: performance
      - id: horizontal-scalability
        value: medium
        numeric_value: 6
        category: scalability
      - id: operational-complexity
        value: low
        numeric_value: 3
        category: operational-complexity
      - id: typesense-cost-efficiency
        value: medium
        numeric_value: 5
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Typesense — Standard search query
        const results = await client.search({
          index: 'products',
          query: { match: { name: searchTerm } },
          size: 20,
          highlight: { fields: { name: {} } },
        })
    metric_explanations:
      query-latency:
        reason: Typesense Standard keeps the entire index in RAM and serves search-as-you-type from in-memory structures, so typo-tolerant lookups resolve without disk I/O.
        contributing_factors:
          - Whole index resides in RAM, eliminating disk seeks on every query
          - In-memory tries power instant prefix and typo-tolerant matching
          - Single-node setup avoids network hops between query coordinators
      horizontal-scalability:
        reason: Typesense Standard runs as one node, so search capacity scales by adding RAM and CPU to that instance rather than by sharding the dataset across machines.
        contributing_factors:
          - Single-node deployment caps dataset size to one machine's RAM
          - Throughput grows vertically with more cores and memory
          - No data sharding, so very large corpora require a bigger instance
      operational-complexity:
        reason: Typesense Standard self-hosts as a single static binary with a JSON schema and API key, needing no external datastore or coordination service to run.
        contributing_factors:
          - One self-contained binary with no external service dependencies
          - Explicit collection schema defines field types and faceting upfront
          - API-key bootstrapping is the only required security setup
  - id: ha-cluster
    name: HA Cluster
    description: >-
      Typesense HA cluster: Raft-replicated nodes keep search answering through instance loss, with 2.5x the throughput.
    docs_url: https://typesense.org/docs/guide/high-availability.html
    monthly_cost: 80
    max_rps: 8000
    base_latency_ms: 10
    metrics:
      - id: query-latency
        value: low
        numeric_value: 2
        category: performance
      - id: horizontal-scalability
        value: high
        numeric_value: 8
        category: scalability
      - id: operational-complexity
        value: medium
        numeric_value: 4
        category: operational-complexity
      - id: typesense-cost-efficiency
        value: medium
        numeric_value: 5
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Typesense — HA Cluster search query
        const results = await client.search({
          index: 'products',
          query: { match: { name: searchTerm } },
          size: 20,
          highlight: { fields: { name: {} } },
        })
    metric_explanations:
      query-latency:
        reason: Typesense HA Cluster serves reads from any of three in-memory replicas, so a load balancer can route searches to the nearest healthy node and keep latency near single-digit ms.
        contributing_factors:
          - Each replica holds the full in-memory index for local query resolution
          - Reads spread across all nodes, lowering per-node contention
          - Healthy-node routing avoids waiting on a busy or recovering peer
      horizontal-scalability:
        reason: Typesense HA Cluster replicates the index across a Raft quorum of nodes, multiplying read throughput and tolerating a node failure without losing search availability.
        contributing_factors:
          - Raft consensus keeps three replicas in sync for the same dataset
          - Adding replicas scales read capacity while preserving consistency
          - Quorum survives single-node loss without dropping query traffic
      operational-complexity:
        reason: Typesense HA Cluster adds Raft membership, leader election, and replica health to operate, raising complexity over the single-node binary while remaining self-managed.
        contributing_factors:
          - Raft peer configuration and quorum sizing must be maintained
          - Leader election and replica catch-up require monitoring during failover
          - Self-hosted clustering means operators own node provisioning and upgrades
connection_properties:
  protocol: HTTPS
  communication_patterns:
    - request-response
  typical_latency: 5-50ms
  co_location_potential: false
ports:
  - id: db-in
    type: database
    direction: in
  - id: monitor-out
    type: monitor
    direction: out
