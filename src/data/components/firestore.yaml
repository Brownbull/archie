id: firestore
name: Cloud Firestore
category: data-storage
type_id: nosql
vendor_url: https://firebase.google.com/products/firestore
description: Google's serverless document database with real-time sync and offline support
is: A serverless, scalable NoSQL document database from Google that provides real-time data synchronization, offline support for mobile and web clients, and automatic multi-region replication
gain:
  - Real-time listeners push data changes to connected clients instantly
  - Built-in offline support with automatic conflict resolution
  - Serverless with automatic scaling and zero infrastructure management
cost:
  - Pricing based on reads/writes/deletes can be unpredictable at scale
  - Limited query capabilities compared to full SQL or MongoDB aggregations
  - Vendor lock-in to Google Cloud and Firebase ecosystem
tags:
  - nosql
  - document
  - database
  - serverless
  - firebase
  - realtime
base_metrics:
  - id: read-latency
    value: low
    numeric_value: 4
    category: performance
  - id: write-throughput
    value: medium
    numeric_value: 6
    category: performance
  - id: horizontal-scalability
    value: high
    numeric_value: 8
    category: scalability
  - id: data-durability
    value: high
    numeric_value: 9
    category: reliability
  - id: firestore-cost-efficiency
    value: medium
    numeric_value: 5
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard
    monthly_cost: 40
    max_rps: 8000
    base_latency_ms: 14
    write_ratio: 0.3
    write_distribution: sharded
    metrics:
      - id: write-throughput
        value: medium
        numeric_value: 5
        category: performance
      - id: horizontal-scalability
        value: medium
        numeric_value: 6
        category: scalability
      - id: data-durability
        value: high
        numeric_value: 8
        category: reliability
      - id: firestore-cost-efficiency
        value: medium
        numeric_value: 5
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Cloud Firestore — Standard document query
        const doc = await db.collection('users').doc(userId).get()
        if (!doc.exists) throw new Error('Not found')
        return doc.data()
    metric_explanations:
      write-throughput:
        reason: Firestore commits each document write as a serverless transaction that synchronously updates the document plus every automatic index, which bounds sustained throughput by the well-known ~1 write/sec-per-document and ~500 writes/sec-per-collection-group hotspot limits unless writes are spread across many document keys.
        contributing_factors:
          - Every write also updates all automatic single-field and composite indexes synchronously
          - The ~1 write/sec per single document soft limit caps contention on any one key
          - Monotonically increasing or sequential document IDs create index hotspots and must be sharded
      horizontal-scalability:
        reason: As a serverless database, Firestore transparently range-splits its key space behind the scenes and adds capacity without any provisioning, but read and write scaling depends on the application distributing documents across many keys rather than on operator-managed nodes.
        contributing_factors:
          - Google-managed automatic range splitting reshards the key space as data and traffic grow
          - No servers, replicas, or shards to provision — capacity is fully serverless
          - Even key distribution (avoiding sequential IDs) is required to actually realize the scaling
      data-durability:
        reason: Firestore synchronously replicates every committed write to multiple zones within the region using Paxos before acknowledging, so a single document write is durable across independent failure domains the moment the client sees success.
        contributing_factors:
          - Paxos-based synchronous replication across zones before commit acknowledgement
          - Strong consistency means an acknowledged write is immediately visible to subsequent reads
          - Google-managed point-in-time recovery restores the database to a prior timestamp
  - id: scaled
    name: Scaled
    monthly_cost: 100
    max_rps: 20000
    base_latency_ms: 10
    write_ratio: 0.3
    write_distribution: sharded
    metrics:
      - id: write-throughput
        value: high
        numeric_value: 7
        category: performance
      - id: horizontal-scalability
        value: high
        numeric_value: 9
        category: scalability
      - id: data-durability
        value: high
        numeric_value: 9
        category: reliability
      - id: firestore-cost-efficiency
        value: low
        numeric_value: 3
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Cloud Firestore — Scaled document query
        const doc = await db.collection('users').doc(userId).get()
        if (!doc.exists) throw new Error('Not found')
        return doc.data()
    metric_explanations:
      write-throughput:
        reason: At scale, Firestore reaches high aggregate write throughput by spreading load across many document keys and sharded counters so the per-document and per-collection-group hotspot limits never bind, while the serverless backend keeps splitting hot key ranges automatically.
        contributing_factors:
          - Distributed/sharded counters fan a high-frequency aggregate across many documents
          - Automatic range-split traffic warm-up (gradual ramp) avoids overwhelming a fresh split
          - Batched writes group up to 500 operations into one atomic commit
      horizontal-scalability:
        reason: A well-keyed Firestore workload scales to very high request rates because the serverless engine keeps subdividing the key space across more storage servers automatically, with no node count, sharding strategy, or rebalancing for the operator to manage.
        contributing_factors:
          - Automatic, continuous range splitting follows traffic to keep partitions balanced
          - Serverless capacity grows without provisioning instances or read replicas
          - Collection-group queries scale independently of any single collection's size
      data-durability:
        reason: Higher-traffic Firestore deployments retain the same multi-zone Paxos-replicated durability, with the option of a multi-region instance that synchronously replicates across geographically separated regions to survive a full regional outage.
        contributing_factors:
          - Multi-region instances replicate synchronously across separated regions for regional fault tolerance
          - Paxos commit across zones keeps acknowledged writes durable under zone failure
          - Managed point-in-time recovery and automatic backups guard against accidental data loss
connection_properties:
  protocol: TCP
  communication_patterns:
    - request-response
  typical_latency: 3-30ms
  co_location_potential: true
ports:
  - id: db-in
    type: database
    direction: in
  - id: monitor-out
    type: monitor
    direction: out
