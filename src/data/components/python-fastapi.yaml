    type: http
    direction: in
  - id: http-out
    type: http
    direction: out
  - id: db-out
    type: database
    direction: out
  - id: cache-out
    type: cache
    direction: out
  - id: auth-in
    type: auth
    direction: in
  - id: monitor-out
    type: monitor
    direction: out
  - id: stream-out
    type: stream
    direction: out
