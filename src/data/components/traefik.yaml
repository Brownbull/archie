id: traefik
name: Traefik
category: delivery-network
type_id: load-balancer
vendor_url: https://traefik.io/traefik/
description: Cloud-native reverse proxy with automatic service discovery and Let's Encrypt
is: A cloud-native edge router and reverse proxy that auto-discovers services from Docker, Kubernetes, and other orchestrators, provides automatic TLS via Let's Encrypt, and supports HTTP, TCP, and gRPC routing
gain:
  - Automatic service discovery from Docker, Kubernetes, and Consul
  - Built-in Let's Encrypt for zero-config TLS
  - Native support for HTTP, TCP, UDP, and gRPC routing
cost:
  - TOML/YAML configuration can be verbose
  - Fewer community plugins compared to Nginx
  - Enterprise features (dashboard, RBAC) require paid license
tags:
  - server
  - proxy
  - load-balancer
  - web-server
base_metrics:
  - id: request-latency
    value: low
    numeric_value: 2
    category: performance
  - id: concurrent-connections
    value: high
    numeric_value: 8
    category: scalability
  - id: operational-complexity
    value: low
    numeric_value: 3
    category: operational-complexity
  - id: traefik-cost-efficiency
    value: high
    numeric_value: 8
    category: cost-efficiency
config_variants:
  - id: edge-router
    name: Edge Router
    monthly_cost: 15
    max_rps: 30000
    base_latency_ms: 1
    metrics:
      - id: request-latency
        value: low
        numeric_value: 2
        category: performance
      - id: concurrent-connections
        value: high
        numeric_value: 8
        category: scalability
      - id: traefik-cost-efficiency
        value: high
        numeric_value: 8
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Traefik — Edge Router health check
        curl -s http://localhost:8080/api/health | jq '.status'
        # Verify backend distribution
        for i in $(seq 1 10); do curl -s http://lb.example.com/api/ping | jq -r '.server'; done | sort | uniq -c
    metric_explanations:
      request-latency:
        reason: Traefik Edge Router processes requests with minimal overhead through optimized routing.
        contributing_factors:
          - Efficient request routing minimizes per-request overhead
          - Connection keep-alive reduces handshake latency
      concurrent-connections:
        reason: Traefik Edge Router handles high connection counts through efficient I/O multiplexing.
        contributing_factors:
          - Event-driven architecture scales with connections not threads
          - Connection pooling reduces per-connection memory overhead
      traefik-cost-efficiency:
        reason: Traefik Edge Router achieves this metric level through its architecture and configuration.
        contributing_factors:
          - Platform-level optimizations reduce overhead
          - Configuration defaults are tuned for typical production workloads
  - id: load-balancer
    name: Load Balancer
    monthly_cost: 30
    max_rps: 80000
    base_latency_ms: 1
    metrics:
      - id: request-latency
        value: low
        numeric_value: 3
        category: performance
      - id: concurrent-connections
        value: high
        numeric_value: 9
        category: scalability
      - id: traefik-cost-efficiency
        value: high
        numeric_value: 7
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Traefik — Load Balancer health check
        curl -s http://localhost:8080/api/health | jq '.status'
        # Verify backend distribution
        for i in $(seq 1 10); do curl -s http://lb.example.com/api/ping | jq -r '.server'; done | sort | uniq -c
    metric_explanations:
      request-latency:
        reason: Traefik Load Balancer processes requests with minimal overhead through optimized routing.
        contributing_factors:
          - Efficient request routing minimizes per-request overhead
          - Connection keep-alive reduces handshake latency
      concurrent-connections:
        reason: Traefik Load Balancer handles high connection counts through efficient I/O multiplexing.
        contributing_factors:
          - Event-driven architecture scales with connections not threads
          - Connection pooling reduces per-connection memory overhead
      traefik-cost-efficiency:
        reason: Traefik Load Balancer achieves this metric level through its architecture and configuration.
        contributing_factors:
          - Platform-level optimizations reduce overhead
          - Configuration defaults are tuned for typical production workloads
connection_properties:
  protocol: HTTP
  communication_patterns:
    - request-response
    - streaming
  typical_latency: <1ms
  co_location_potential: false
ports:
  - id: http-in
    type: http
    direction: in
  - id: http-out
    type: http
    direction: out
