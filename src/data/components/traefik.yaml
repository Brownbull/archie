id: traefik
name: Traefik
category: delivery-network
type_id: load-balancer
vendor_url: https://traefik.io/traefik/
description: Cloud-native reverse proxy with automatic service discovery and Let's Encrypt
is: A cloud-native edge router and reverse proxy that auto-discovers services from Docker, Kubernetes, and other orchestrators, provides automatic TLS via Let's Encrypt, and supports HTTP, TCP, and gRPC routing
gain:
  - Automatic service discovery from Docker, Kubernetes, and Consul
  - Built-in Let's Encrypt for zero-config TLS
  - Native support for HTTP, TCP, UDP, and gRPC routing
cost:
  - TOML/YAML configuration can be verbose
  - Fewer community plugins compared to Nginx
  - Enterprise features (dashboard, RBAC) require paid license
tags:
  - server
  - proxy
  - load-balancer
  - web-server
base_metrics:
  - id: request-latency
    value: low
    numeric_value: 2
    category: performance
  - id: concurrent-connections
    value: high
    numeric_value: 8
    category: scalability
  - id: operational-complexity
    value: low
    numeric_value: 3
    category: operational-complexity
  - id: traefik-cost-efficiency
    value: high
    numeric_value: 8
    category: cost-efficiency
config_variants:
  - id: edge-router
    name: Edge Router
    description: >-
      Traefik as an edge router: auto-discovers services and wires routes from labels — the low-config front door for container platforms.
    docs_url: https://doc.traefik.io/traefik/
    monthly_cost: 15
    max_rps: 30000
    base_latency_ms: 1
    metrics:
      - id: request-latency
        value: low
        numeric_value: 2
        category: performance
      - id: concurrent-connections
        value: high
        numeric_value: 8
        category: scalability
      - id: traefik-cost-efficiency
        value: high
        numeric_value: 8
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Traefik — Edge Router health check
        curl -s http://localhost:8080/api/health | jq '.status'
        # Verify backend distribution
        for i in $(seq 1 10); do curl -s http://lb.example.com/api/ping | jq -r '.server'; done | sort | uniq -c
    metric_explanations:
      request-latency:
        reason: Traefik Edge Router matches each request against a router-rule tree compiled in Go and watches provider events to hot-reload routes, so configuration changes never restart the proxy and per-request matching stays sub-millisecond.
        contributing_factors:
          - Router rules matched by a compiled Go matcher, no per-request config parse
          - Provider watch hot-reloads routes without dropping in-flight connections
          - Automatic Let's Encrypt TLS terminates at the edge with cached certificates
      concurrent-connections:
        reason: Traefik Edge Router rides Go's goroutine-per-connection model over the net/http server, so each connection is a cheap green thread on the runtime scheduler rather than an OS thread, letting one process hold tens of thousands of open sockets.
        contributing_factors:
          - Goroutine-per-connection multiplexed onto a small OS thread pool
          - Go runtime scheduler parks idle connections at near-zero memory cost
          - Backend connections reused via the shared HTTP transport pool
      traefik-cost-efficiency:
        reason: Traefik Edge Router is open-source and runs as a single static Go binary that auto-discovers backends, so a small VM handles edge routing with no per-route licensing or external control plane.
        contributing_factors:
          - Single self-contained Go binary, no runtime dependencies to license
          - Automatic service discovery removes manual config-management toil
          - Free community edition covers core HTTP, TCP, and TLS routing
  - id: load-balancer
    name: Load Balancer
    description: >-
      Traefik load balancing: the same dynamic discovery spread across replicas, with a much higher ceiling. Config stays declarative while the fleet grows.
    docs_url: https://doc.traefik.io/traefik/routing/services/
    monthly_cost: 30
    max_rps: 80000
    base_latency_ms: 1
    metrics:
      - id: request-latency
        value: low
        numeric_value: 3
        category: performance
      - id: concurrent-connections
        value: high
        numeric_value: 9
        category: scalability
      - id: traefik-cost-efficiency
        value: high
        numeric_value: 7
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Traefik — Load Balancer health check
        curl -s http://localhost:8080/api/health | jq '.status'
        # Verify backend distribution
        for i in $(seq 1 10); do curl -s http://lb.example.com/api/ping | jq -r '.server'; done | sort | uniq -c
    metric_explanations:
      request-latency:
        reason: Traefik Load Balancer adds weighted round-robin and sticky-session selection plus active health checks per backend, so it picks a healthy server in-process and forwards over a pooled keep-alive connection with little added latency.
        contributing_factors:
          - Weighted round-robin server pick computed in-process per request
          - Active health checks evict failing backends before they add latency
          - Sticky-session cookie avoids cross-node cache misses on stateful backends
      concurrent-connections:
        reason: Traefik Load Balancer fans many client goroutines onto a smaller pool of reused upstream connections, so connection growth is decoupled from backend sockets and the Go scheduler keeps thousands of clients balanced across servers.
        contributing_factors:
          - Client goroutines multiplexed onto a reused upstream connection pool
          - Per-backend max-connection limits prevent overloading a single server
          - Go scheduler spreads connection load without per-socket OS threads
      traefik-cost-efficiency:
        reason: Traefik Load Balancer delivers L7 balancing, health checking, and sticky sessions from the free open-source binary, so it replaces a paid hardware or cloud load balancer at the cost of a commodity VM.
        contributing_factors:
          - Core load-balancing and health checks ship in the free community edition
          - One binary balances HTTP, TCP, and gRPC without separate appliances
          - Self-hosted on commodity compute, no per-hour managed-LB charge
connection_properties:
  protocol: HTTP
  communication_patterns:
    - request-response
    - streaming
  typical_latency: <1ms
  co_location_potential: false
ports:
  - id: http-in
    type: http
    direction: in
  - id: http-out
    type: http
    direction: out
