id: dragonfly
name: Dragonfly
category: data-storage
type_id: cache
vendor_url: https://www.dragonflydb.io/
description: Modern Redis-compatible in-memory store using multi-threaded architecture for higher throughput
is: A modern, Redis-compatible in-memory data store built with a multi-threaded shared-nothing architecture that delivers significantly higher throughput and better memory efficiency than traditional single-threaded in-memory stores
gain:
  - Multi-threaded architecture utilizes all CPU cores for higher throughput
  - Redis-compatible API enables drop-in replacement
  - Better memory efficiency through novel data structure implementations
cost:
  - Younger ecosystem with smaller community than Redis
  - Some advanced Redis modules not yet supported
  - Limited production track record compared to established alternatives
tags:
  - database
  - nosql
  - in-memory
  - cache
  - redis-compatible
base_metrics:
  - id: read-latency
    value: low
    numeric_value: 1
    category: performance
  - id: write-throughput
    value: high
    numeric_value: 10
    category: performance
  - id: horizontal-scalability
    value: medium
    numeric_value: 5
    category: scalability
  - id: data-durability
    value: medium
    numeric_value: 5
    category: reliability
  - id: dragonfly-cost-efficiency
    value: medium
    numeric_value: 5
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard
    monthly_cost: 45
    max_rps: 60000
    base_latency_ms: 1
    cache_hit_ratio: 0.83
    metrics:
      - id: read-latency
        value: low
        numeric_value: 1
        category: performance
      - id: horizontal-scalability
        value: low
        numeric_value: 3
        category: scalability
      - id: write-throughput
        value: high
        numeric_value: 9
        category: performance
      - id: dragonfly-cost-efficiency
        value: medium
        numeric_value: 5
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Dragonfly — Standard cache usage
        import Redis from 'ioredis'

        const redis = new Redis(process.env.REDIS_URL)
        const cached = await redis.get(`user:${userId}`)
        if (!cached) {
          const data = await fetchFromDB(userId)
          await redis.set(`user:${userId}`, JSON.stringify(data), 'EX', 3600)
        }
    metric_explanations:
      read-latency:
        reason: Dragonfly serves reads from memory through its Dash extendible-hashing table, and its shared-nothing thread-per-core model pins each key to one thread so lookups run lock-free without the cross-thread contention that would add tail latency.
        contributing_factors:
          - Dash extendible hash table keeps in-memory point lookups cache-friendly and O(1)
          - Shared-nothing thread-per-core sharding lets each key be read without locking
          - Entirely in-RAM working set means reads never wait on disk
      horizontal-scalability:
        reason: A single Dragonfly process scales vertically by adding CPU cores rather than across machines — its shared-nothing engine partitions the keyspace across threads, so on one node horizontal (multi-node) scalability is low and growth comes mainly from a bigger instance.
        contributing_factors:
          - Multi-threaded shared-nothing design scales up across cores within one process
          - A standalone node has no built-in sharding to spread keys across machines
          - Capacity grows by adding vCPUs and RAM to the instance, not by adding nodes
      write-throughput:
        reason: Dragonfly's thread-per-core architecture is the key write differentiator — because each shard's keys are owned by exactly one thread, SET operations execute lock-free in parallel across all cores, letting a single node sustain very high write rates a single-threaded Redis core cannot reach.
        contributing_factors:
          - Thread-per-core sharding runs writes to different keys fully in parallel without locks
          - All CPU cores process the command pipeline simultaneously rather than one event loop
          - Fork-less point-in-time snapshotting persists data without stalling the write path
  - id: scaled
    name: Scaled
    monthly_cost: 100
    max_rps: 200000
    base_latency_ms: 0.5
    cache_hit_ratio: 0.92
    metrics:
      - id: read-latency
        value: low
        numeric_value: 1
        category: performance
      - id: horizontal-scalability
        value: medium
        numeric_value: 6
        category: scalability
      - id: write-throughput
        value: high
        numeric_value: 10
        category: performance
      - id: dragonfly-cost-efficiency
        value: low
        numeric_value: 3
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Dragonfly — Scaled cache usage
        import Redis from 'ioredis'

        const redis = new Redis(process.env.REDIS_URL)
        const cached = await redis.get(`user:${userId}`)
        if (!cached) {
          const data = await fetchFromDB(userId)
          await redis.set(`user:${userId}`, JSON.stringify(data), 'EX', 3600)
        }
    metric_explanations:
      read-latency:
        reason: On a larger multi-core instance Dragonfly keeps reads sub-millisecond and scales read concurrency with core count, since the shared-nothing engine adds an independent lock-free Dash-table partition per core that fields its share of GET traffic in parallel.
        contributing_factors:
          - More cores add more independent shard threads serving reads concurrently
          - Dash extendible hashing keeps each partition's lookups O(1) and cache-resident
          - In-memory residency holds even at large dataset sizes, avoiding disk reads
      horizontal-scalability:
        reason: The scaled tier reaches medium horizontal scalability mainly by scaling the engine across many cores on a big instance, with optional Dragonfly cluster mode extending Redis-cluster slot semantics across nodes when a single machine is outgrown.
        contributing_factors:
          - Thread-per-core scaling absorbs far more load per node before another node is needed
          - Optional cluster mode distributes Redis-compatible hash slots across multiple nodes
          - Higher per-node ceiling reduces how many nodes a given workload requires
      write-throughput:
        reason: At scale Dragonfly pushes write throughput to extreme rates because every additional core becomes another lock-free shard processing SET commands in parallel, so aggregate write capacity rises with core count instead of being pinned to one event loop.
        contributing_factors:
          - Write throughput scales near-linearly with the number of CPU cores per node
          - Lock-free per-shard ownership eliminates contention as concurrent writers increase
          - Fork-less snapshotting persists large datasets without pausing the write path
connection_properties:
  protocol: TCP
  communication_patterns:
