id: azure-cdn
name: Azure CDN
category: delivery-network
type_id: cdn
vendor_url: https://azure.microsoft.com/en-us/products/cdn
description: Azure edge delivery with integrated DDoS protection
is: Azure's content delivery network that accelerates static and dynamic content via Microsoft's global edge network, includes integrated DDoS protection, and supports custom domain HTTPS with managed certificates
gain:
  - Integrated DDoS protection at the edge
  - Deep Azure integration with Blob Storage, App Service, and Front Door
  - Managed TLS certificates for custom domains
cost:
  - Azure-only; egress pricing varies by region
  - Multiple SKUs (Standard, Premium) complicate selection
  - Rules engine limited in Standard tier
tags:
  - cdn
  - edge
  - azure
  - azure-cdn
  - caching
base_metrics:
  - id: edge-latency
    value: low
    numeric_value: 3
    category: performance
  - id: global-availability
    value: high
    numeric_value: 9
    category: reliability
  - id: operational-complexity
    value: low
    numeric_value: 3
    category: operational-complexity
  - id: azure-cdn-cost-efficiency
    value: medium
    numeric_value: 5
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard
    description: >-
      Azure CDN Standard: Microsoft's edge with solid latency and Azure-native integration. Pricier than the independents at the same job.
    docs_url: https://learn.microsoft.com/en-us/azure/cdn/cdn-overview
    monthly_cost: 55
    max_rps: 180000
    base_latency_ms: 5
    metrics:
      - id: edge-latency
        value: low
        numeric_value: 3
        category: performance
      - id: global-availability
        value: high
        numeric_value: 9
        category: reliability
      - id: azure-cdn-cost-efficiency
        value: medium
        numeric_value: 6
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Azure CDN — Standard cache status check
        curl -sI https://cdn.example.com/assets/app.js | grep -i "cache-status\|x-cache\|age"
        # Purge cached asset
        curl -X PURGE https://cdn.example.com/assets/app.js
    metric_explanations:
      edge-latency:
        reason: Azure CDN Standard caches objects at Microsoft's global edge POPs and absorbs volumetric floods inline with always-on infrastructure DDoS protection, so legitimate cache hits return in single-digit milliseconds even under attack.
        contributing_factors:
          - Cache hits served from the Microsoft edge POP nearest the client
          - Always-on infrastructure DDoS scrubbing keeps the edge responsive under flood
          - Cache-Control and rules-engine TTLs hold objects to maximize hit ratio
      global-availability:
        reason: Azure CDN Standard advertises one anycast endpoint from Microsoft's worldwide POP network, so a POP outage is routed around by BGP while cached content keeps serving from the remaining edge sites.
        contributing_factors:
          - Anycast endpoint reachable from every Microsoft edge POP
          - BGP reroutes clients off a failed POP without a DNS change
          - Edge cache continues serving objects through a transient origin outage
      azure-cdn-cost-efficiency:
        reason: Azure CDN Standard charges zone-based per-GB egress plus per-10k requests, and DDoS protection is bundled at no extra charge, giving solid value for static delivery within a single pricing zone.
        contributing_factors:
          - Per-GB egress tiered by geographic billing zone
          - Infrastructure DDoS protection included with no separate fee
          - Standard SKU avoids the higher rules-engine and WAF costs of Premium
  - id: premium
    name: Premium
    description: >-
      Azure CDN Premium: advanced rules engine and the family's fastest edge. The premium is real — pay it when the rules engine or compliance posture matters.
    docs_url: https://learn.microsoft.com/en-us/azure/cdn/cdn-features
    monthly_cost: 120
    max_rps: 250000
    base_latency_ms: 3
    metrics:
      - id: edge-latency
        value: low
        numeric_value: 2
        category: performance
      - id: global-availability
        value: high
        numeric_value: 9
        category: reliability
      - id: azure-cdn-cost-efficiency
        value: medium
        numeric_value: 4
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Azure CDN — Premium cache status check
        curl -sI https://cdn.example.com/assets/app.js | grep -i "cache-status\|x-cache\|age"
        # Purge cached asset
        curl -X PURGE https://cdn.example.com/assets/app.js
    metric_explanations:
      edge-latency:
        reason: Azure CDN Premium runs a programmable rules engine at the edge that rewrites, redirects, and sets cache keys without a round trip to origin, so personalized and conditional responses are decided at the POP and returned in a few milliseconds.
        contributing_factors:
          - Rules engine evaluates routing and header logic at the edge POP
          - Edge-computed cache keys raise hit ratio for query-string variants
          - Dynamic site acceleration tunes the origin path for uncacheable requests
      global-availability:
        reason: Azure CDN Premium combines the anycast edge with health-probed origin failover and a managed WAF, so unhealthy origins are bypassed and malicious traffic is filtered at the edge while the global POP network keeps serving.
        contributing_factors:
          - Health-probed origin groups fail traffic over to a healthy backend
          - Managed WAF rules block layer-7 attacks before they reach origin
          - Anycast POP network rides out single-site failures via BGP rerouting
      azure-cdn-cost-efficiency:
        reason: Azure CDN Premium adds per-rule, per-WAF-request, and dynamic-acceleration charges on top of egress, so the programmable edge raises cost per request and only pays off when its routing and security features are actually used.
        contributing_factors:
          - Rules-engine and WAF requests metered separately from egress GB
          - Dynamic site acceleration billed for uncacheable origin traffic
          - Premium SKU cost-effective only when edge logic or WAF is required
connection_properties:
  protocol: HTTP
  communication_patterns:
    - request-response
  typical_latency: 10-80ms
  co_location_potential: false
ports:
  - id: cdn-in
    type: cdn
    direction: in
  - id: cdn-out
    type: cdn
    direction: out
  - id: http-in
    type: http
    direction: in
