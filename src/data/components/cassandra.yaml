id: cassandra
name: Apache Cassandra
category: data-storage
type_id: nosql
vendor_url: https://cassandra.apache.org/
description: Distributed wide-column store for massive scale with linear horizontal scaling
is: A distributed wide-column NoSQL database designed for handling large volumes of data across many commodity servers with no single point of failure, providing linear scalability and proven fault tolerance
gain:
  - Linear horizontal scaling with no single point of failure
  - Tunable consistency for balancing availability and correctness
  - Optimized for high write throughput across data centers
cost:
  - Data modeling requires query-first design approach
  - Limited ad-hoc query support compared to SQL databases
  - Operational complexity increases with cluster size
tags:
  - nosql
  - wide-column
  - database
  - distributed
  - cassandra
base_metrics:
  - id: read-latency
    value: medium
    numeric_value: 5
    category: performance
  - id: write-throughput
    value: high
    numeric_value: 9
    category: performance
  - id: horizontal-scalability
    value: high
    numeric_value: 10
    category: scalability
  - id: data-durability
    value: high
    numeric_value: 8
    category: reliability
  - id: cassandra-cost-efficiency
    value: medium
    numeric_value: 5
    category: cost-efficiency
config_variants:
  - id: single-dc
    name: Single DC
    description: >-
      Cassandra in one datacenter: masterless, write-anywhere availability with tunable consistency. Data modeling is query-first — design tables for how you read.
    docs_url: https://cassandra.apache.org/doc/latest/
    monthly_cost: 70
    max_rps: 15000
    base_latency_ms: 10
    write_ratio: 0.3
    write_distribution: sharded
    metrics:
      - id: write-throughput
        value: high
        numeric_value: 8
        category: performance
      - id: horizontal-scalability
        value: high
        numeric_value: 8
        category: scalability
      - id: data-durability
        value: high
        numeric_value: 7
        category: reliability
      - id: cassandra-cost-efficiency
        value: medium
        numeric_value: 5
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Apache Cassandra — Single DC document query
        const doc = await db.collection('users').doc(userId).get()
        if (!doc.exists) throw new Error('Not found')
        return doc.data()
    metric_explanations:
      write-throughput:
        reason: Cassandra's LSM-tree storage engine makes writes append-only — each mutation lands in the commit log and an in-memory memtable, with SSTable flushes and compaction deferred off the write path, so a single DC sustains high ingest without read-modify-write seeks.
        contributing_factors:
          - Append-only commit log plus memtable avoids in-place disk updates on the hot path
          - Coordinator hashes the partition key onto the token ring and writes directly to replica nodes
          - Tunable write consistency (e.g. ONE or LOCAL_QUORUM) trades acknowledgement strictness for throughput
      horizontal-scalability:
        reason: A single-datacenter Cassandra cluster scales linearly because the consistent-hashing token ring spreads partitions evenly across peer nodes with no primary, and newly joined nodes claim virtual-node token ranges to absorb their share of traffic.
        contributing_factors:
          - Masterless peer-to-peer ring means every node accepts reads and writes
          - Virtual nodes (vnodes) let new members stream only their token ranges during bootstrap
          - Gossip protocol propagates membership and load so coordinators route around hot nodes
      data-durability:
        reason: Durability in a single DC comes from a configurable replication factor that stores each partition on multiple ring nodes, backed by a fsync-able commit log that replays uncommitted mutations after a crash.
        contributing_factors:
          - Replication factor copies each partition to multiple distinct ring nodes
          - Commit log replay recovers any mutations not yet flushed to SSTables
          - Hinted handoff and read repair reconcile replicas that missed a write
  - id: multi-dc
    name: Multi DC
    description: >-
      Multi-DC Cassandra: rings in each region keep serving through a regional loss, with nearly 3x the throughput. Cross-DC consistency is yours to tune per query.
    docs_url: https://cassandra.apache.org/doc/latest/cassandra/architecture/dynamo.html
    monthly_cost: 180
    max_rps: 40000
    base_latency_ms: 8
    write_ratio: 0.3
    write_distribution: sharded
    metrics:
      - id: write-throughput
        value: high
        numeric_value: 9
        category: performance
      - id: horizontal-scalability
        value: high
        numeric_value: 10
        category: scalability
      - id: data-durability
        value: high
        numeric_value: 9
        category: reliability
      - id: cassandra-cost-efficiency
        value: low
        numeric_value: 3
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Apache Cassandra — Multi DC document query
        const doc = await db.collection('users').doc(userId).get()
        if (!doc.exists) throw new Error('Not found')
        return doc.data()
    metric_explanations:
      write-throughput:
        reason: With NetworkTopologyStrategy across datacenters, a client can ack at LOCAL_QUORUM against the nearest DC while asynchronous cross-DC replication carries the mutation onward, keeping local write latency low even as total ingest capacity grows with every added DC and node.
        contributing_factors:
          - LOCAL_QUORUM acks against the local DC avoid waiting on inter-region round trips
          - Asynchronous cross-DC replication fans the mutation out to remote replicas in the background
          - LSM append-only commit-log writes parallelize across all ring nodes per DC
      horizontal-scalability:
        reason: Multi-DC topology extends the token ring across regions so the same keyspace is served close to every population of users, and capacity scales by adding either nodes within a DC or entire datacenters to the ring.
        contributing_factors:
          - NetworkTopologyStrategy places replicas per-DC and per-rack for locality and fault isolation
          - Adding a whole datacenter rebalances via token-range streaming without downtime
          - Snitch-aware routing sends each read to the closest replica DC
      data-durability:
        reason: Spanning multiple datacenters survives the loss of an entire region — independent per-DC replication factors keep full copies of every partition in each datacenter, so a regional outage never reduces the surviving copies to zero.
        contributing_factors:
          - Per-DC replication factor guarantees complete copies of data in every datacenter
          - Region-level redundancy tolerates a full datacenter outage without data loss
          - Anti-entropy repair reconciles divergent replicas across DCs after partitions heal
connection_properties:
  protocol: TCP
  communication_patterns:
    - request-response
  typical_latency: 3-30ms
  co_location_potential: true
ports:
  - id: db-in
    type: database
    direction: in
  - id: monitor-out
    type: monitor
    direction: out
