id: kafka-streams
name: Kafka Streams
category: compute
type_id: stream-processor
vendor_url: https://kafka.apache.org/documentation/streams/
description: Client library for building stream processing apps on top of Kafka with no separate cluster needed
is: A lightweight Java client library for building stream processing applications directly on Apache Kafka, requiring no separate processing cluster, with support for stateful transformations, windowing, and exactly-once semantics
gain:
  - No separate cluster — runs as a standard JVM application
  - Exactly-once semantics via Kafka transactions
  - Elastic scaling by adding or removing app instances
cost:
  - Tightly coupled to Kafka as the only source and sink
  - Java/JVM only — no first-class support for other languages
  - State stores need local disk and careful partition tuning
tags:
  - stream-processing
  - kafka
  - stateful
  - exactly-once
  - jvm
base_metrics:
  - id: processing-latency
    value: low
    numeric_value: 4
    category: performance
  - id: processing-throughput
    value: high
    numeric_value: 8
    category: scalability
  - id: state-consistency
    value: high
    numeric_value: 8
    category: reliability
  - id: operational-complexity
    value: medium
    numeric_value: 5
    category: operational-complexity
  - id: kafka-streams-cost-efficiency
    value: medium
    numeric_value: 5
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard
    monthly_cost: 60
    max_rps: 30000
    base_latency_ms: 5
    metrics:
      - id: processing-latency
        value: low
        numeric_value: 4
        category: performance
      - id: operational-complexity
        value: medium
        numeric_value: 5
        category: operational-complexity
      - id: kafka-streams-cost-efficiency
        value: high
        numeric_value: 7
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Kafka Streams — Standard stream topology
        import { KafkaStreams } from 'kafka-streams'

        const factory = new KafkaStreams({ kafkaHost: process.env.KAFKA_URL })
        const stream = factory.getKStream('input-topic')
        stream.map(msg => transform(msg)).to('output-topic')
        await stream.start()
    metric_explanations:
      processing-latency:
        reason: A single Streams instance pulls records straight from its assigned Kafka partitions and runs the topology record-by-record in the consumer poll loop, so per-event latency is dominated by one local transform plus the produce back to the output topic.
        contributing_factors:
          - Records flow one-at-a-time through the topology rather than waiting on a batch window
          - RocksDB-backed local state stores serve stateful lookups from disk-backed cache without a remote call
      operational-complexity:
        reason: Kafka Streams ships as a JVM library embedded in your own application, so there is no separate processing cluster to run, but you still operate the JVM app and its RocksDB state stores yourself against an existing Kafka cluster.
        contributing_factors:
          - No dedicated stream-processing cluster — the topology runs inside a standard JVM service you already deploy
          - Consumer-group membership handles task assignment, but you own RocksDB state-store disk and rebalance tuning
      kafka-streams-cost-efficiency:
        reason: The standard single-instance topology reuses the JVM service and the existing Kafka cluster with no extra processing tier, so it adds throughput cheaply on the open-source library.
        contributing_factors:
          - Open-source library with no separate cluster or per-node processing license
          - Co-locating processing with the app avoids a standalone compute fleet for a moderate event rate
  - id: scaled
    name: Scaled
    monthly_cost: 120
    max_rps: 80000
    base_latency_ms: 4
    metrics:
      - id: processing-latency
        value: low
        numeric_value: 3
        category: performance
      - id: operational-complexity
        value: medium
        numeric_value: 6
        category: operational-complexity
      - id: kafka-streams-cost-efficiency
        value: medium
        numeric_value: 5
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Kafka Streams — Scaled stream topology
        import { KafkaStreams } from 'kafka-streams'

        const factory = new KafkaStreams({ kafkaHost: process.env.KAFKA_URL })
        const stream = factory.getKStream('input-topic')
        stream.map(msg => transform(msg)).to('output-topic')
        await stream.start()
    metric_explanations:
      processing-latency:
        reason: Adding instances spreads partition-keyed tasks across more JVMs so each handles fewer partitions, shrinking per-record queue time, though exactly-once mode commits Kafka transactions on a fixed interval that sets a latency floor under heavy load.
        contributing_factors:
          - More instances mean fewer partitions per task and shorter per-record wait
          - Transactional exactly-once commits add a periodic flush that caps how low latency can go
      operational-complexity:
        reason: Scaling out elastically adds JVM instances that auto-rebalance partition assignments via the consumer group, but each rebalance migrates RocksDB state and replays changelog topics, so larger fleets need careful standby-replica and partition tuning.
        contributing_factors:
          - Stateful task migration on rebalance forces changelog-topic restore, which you must size standby replicas for
          - Coordinating exactly-once transactions and state across more instances raises tuning and monitoring burden
      kafka-streams-cost-efficiency:
        reason: The scaled topology runs several standing JVM instances plus the broker traffic of changelog and repartition topics, so throughput climbs but per-event cost rises with the extra compute and Kafka storage it consumes.
        contributing_factors:
          - Multiple always-on JVM instances raise baseline compute spend
          - Changelog and repartition topics add Kafka storage and replication cost as state grows
connection_properties:
  protocol: TCP
  communication_patterns:
    - event-streaming
  typical_latency: 5-60ms
  co_location_potential: false
ports:
  - id: stream-in
    type: stream
    direction: in
  - id: stream-out
    type: stream
    direction: out
  - id: db-out
    type: database
    direction: out
  - id: monitor-out
    type: monitor
    direction: out
