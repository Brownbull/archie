id: azure-dns
name: Azure DNS
category: delivery-network
type_id: dns
vendor_url: https://azure.microsoft.com/en-us/products/dns
description: Azure's DNS hosting with global anycast and deep Azure integration
is: Azure's managed authoritative DNS service that leverages Microsoft's global anycast network, offers deep integration with Azure resources via alias records, and supports both public and private DNS zones
gain:
  - Global anycast network with low-latency resolution
  - Deep Azure integration with alias records for Traffic Manager and App Service
  - Private DNS zones for VNet name resolution
cost:
  - Azure-only; priced per zone and per query
  - Fewer advanced routing policies than Route 53
  - Private zones add cost for cross-VNet resolution
tags:
  - dns
  - networking
  - managed
  - azure
  - azure-dns
base_metrics:
  - id: resolution-latency
    value: low
    numeric_value: 3
    category: performance
  - id: global-availability
    value: high
    numeric_value: 9
    category: reliability
  - id: operational-complexity
    value: low
    numeric_value: 3
    category: operational-complexity
  - id: azure-dns-cost-efficiency
    value: medium
    numeric_value: 6
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard
    description: >-
      Azure DNS: fast anycast resolution managed inside Azure. Resolution only — steering and failover live elsewhere.
    docs_url: https://learn.microsoft.com/en-us/azure/dns/dns-overview
    monthly_cost: 8
    max_rps: 150000
    base_latency_ms: 1
    metrics:
      - id: resolution-latency
        value: low
        numeric_value: 3
        category: performance
      - id: global-availability
        value: high
        numeric_value: 9
        category: reliability
      - id: azure-dns-cost-efficiency
        value: medium
        numeric_value: 6
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Azure DNS — Standard DNS query test
        dig @ns1.example.com example.com A +short
        # Verify resolution latency
        dig example.com +stats | grep "Query time"
    metric_explanations:
      resolution-latency:
        reason: Azure DNS Standard serves public zones from Microsoft's anycast name servers across the global WAN, and alias records resolve Traffic Manager and Front Door targets at the name server itself so clients skip an extra CNAME hop.
        contributing_factors:
          - Anycast public name servers answer from the nearest Microsoft edge site
          - Alias records resolve Azure resource IPs inline, avoiding a second lookup
          - Records served from replicated in-memory zone data rather than disk
      global-availability:
        reason: Azure DNS Standard spreads each public zone across Microsoft's anycast name-server fleet on the global backbone, so a single site outage is withdrawn from BGP while the remaining sites keep answering authoritatively.
        contributing_factors:
          - Anycast name servers span many Microsoft edge sites worldwide
          - BGP withdrawal reroutes resolvers off a degraded site automatically
          - Zone data replicated across regions by the Azure DNS control plane
      azure-dns-cost-efficiency:
        reason: Azure DNS Standard prices public hosting per hosted zone plus per-million queries with the first billion queries at the lowest tier, keeping cost low for typical public domains.
        contributing_factors:
          - Per-hosted-zone monthly fee with volume discounts past 25 zones
          - Query billing tiered down after the first billion monthly lookups
          - Public zones avoid the per-VNet-link charge that private zones incur
  - id: private-zones
    name: Private Zones
    description: >-
      Azure DNS with Private Zones: the same resolution plus internal names for VNet-only services — the piece that keeps private architectures addressable.
    docs_url: https://learn.microsoft.com/en-us/azure/dns/private-dns-overview
    monthly_cost: 15
    max_rps: 150000
    base_latency_ms: 1
    metrics:
      - id: resolution-latency
        value: low
        numeric_value: 2
        category: performance
      - id: global-availability
        value: high
        numeric_value: 9
        category: reliability
      - id: azure-dns-cost-efficiency
        value: medium
        numeric_value: 5
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Azure DNS — Private Zones DNS query test
        dig @ns1.example.com example.com A +short
        # Verify resolution latency
        dig example.com +stats | grep "Query time"
    metric_explanations:
      resolution-latency:
        reason: Azure DNS Private Zones answers from the 168.63.129.16 platform resolver inside each linked VNet, so VM-to-VM name lookups stay on the local virtual network fabric and never leave Azure for a sub-millisecond response.
        contributing_factors:
          - Private resolver reachable at the in-fabric 168.63.129.16 address
          - Lookups stay within the VNet's software-defined network, off the public internet
          - Auto-registration keeps VM A-records current without manual TTL waits
      global-availability:
        reason: Azure DNS Private Zones links a single zone to many VNets across regions through the redundant Azure platform resolver, so name resolution survives the loss of any one VNet or region as long as another link remains.
        contributing_factors:
          - One private zone linked to multiple VNets across regions
          - Platform resolver is part of the redundant Azure host infrastructure
          - Registration and resolution VNet links can be split for resilience
      azure-dns-cost-efficiency:
        reason: Azure DNS Private Zones adds a per-VNet-link charge on top of the hosted-zone and query fees, so cross-VNet private resolution costs more than equivalent public hosting as the number of linked networks grows.
        contributing_factors:
          - Each linked VNet bills a separate monthly virtual-network-link fee
          - Hosted-zone and query charges still apply on top of the link fee
          - Cost scales with the number of VNets sharing the private namespace
connection_properties:
  protocol: DNS/UDP
  communication_patterns:
    - request-response
  typical_latency: 5-45ms
  co_location_potential: false
ports:
  - id: http-in
    type: http
    direction: in
  - id: http-out
    type: http
    direction: out
  - id: monitor-out
    type: monitor
    direction: out
