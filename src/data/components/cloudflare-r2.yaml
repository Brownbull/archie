id: cloudflare-r2
name: Cloudflare R2
category: data-storage
type_id: object-storage
vendor_url: https://www.cloudflare.com/developer-platform/products/r2/
description: S3-compatible object storage with zero egress fees at Cloudflare's edge
is: An S3-compatible object storage service that eliminates egress fees by serving data from Cloudflare's global edge network, making it cost-effective for read-heavy workloads
gain:
  - Zero egress fees regardless of download volume
  - Full S3 API compatibility for easy migration
  - Edge-distributed for low-latency global reads
cost:
  - Smaller feature set than mature S3 (no lifecycle tiers yet)
  - Newer service with less operational track record
  - Workers integration required for advanced logic
tags:
  - storage
  - object
  - blob
  - cloudflare
  - s3-compatible
base_metrics:
  - id: query-latency
    value: medium
    numeric_value: 4
    category: performance
  - id: storage-scalability
    value: high
    numeric_value: 9
    category: scalability
  - id: data-durability
    value: high
    numeric_value: 9
    category: reliability
  - id: cost-per-gb
    value: high
    numeric_value: 9
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard
    description: >-
      Cloudflare R2: S3-compatible storage with ZERO egress fees — the bill that usually ambushes object storage simply isn't there. Ceilings are modest.
    docs_url: https://developers.cloudflare.com/r2/
    monthly_cost: 10
    max_rps: 8000
    base_latency_ms: 12
    metrics:
      - id: storage-scalability
        value: high
        numeric_value: 9
        category: scalability
      - id: data-durability
        value: high
        numeric_value: 9
        category: reliability
      - id: cost-per-gb
        value: high
        numeric_value: 9
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Cloudflare R2 — Standard object operations
        # Upload
        aws s3 cp ./backup.tar.gz s3://my-bucket/backups/ --storage-class STANDARD
        # Download
        aws s3 cp s3://my-bucket/backups/backup.tar.gz ./restore.tar.gz
    metric_explanations:
      storage-scalability:
        reason: Cloudflare R2 Standard scales object capacity across Cloudflare's distributed storage backed by its global network, growing on demand without provisioning while exposing the S3 API.
        contributing_factors:
          - Objects distribute across Cloudflare's storage infrastructure automatically
          - Capacity grows on demand with no bucket or volume sizing step
          - S3-compatible API lets existing tooling address the bucket unchanged
      data-durability:
        reason: Cloudflare R2 Standard redundantly stores each object across multiple devices and locations so individual hardware failures do not cause data loss.
        contributing_factors:
          - Each object is replicated across multiple storage devices on write
          - Spreading copies across locations survives single-site hardware failure
          - Background integrity checks detect and repair corrupted replicas
      cost-per-gb:
        reason: Cloudflare R2 Standard keeps total cost low chiefly by charging zero egress fees, so read-heavy workloads pay only flat storage and per-operation rates.
        contributing_factors:
          - Zero egress fees remove the dominant cost of read-heavy object workloads
          - Flat per-GB storage pricing with no regional egress multipliers
          - Class A and B operation fees are the only usage charges beyond storage
  - id: enterprise
    name: Enterprise
    description: >-
      R2 enterprise: the same zero-egress model with nearly twice the throughput and faster reads. Heavy egress workloads save the most here.
    docs_url: https://developers.cloudflare.com/r2/pricing/
    monthly_cost: 25
    max_rps: 15000
    base_latency_ms: 8
    metrics:
      - id: storage-scalability
        value: high
        numeric_value: 10
        category: scalability
      - id: data-durability
        value: high
        numeric_value: 10
        category: reliability
      - id: cost-per-gb
        value: high
        numeric_value: 9
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Cloudflare R2 — Enterprise object operations
        # Upload
        aws s3 cp ./backup.tar.gz s3://my-bucket/backups/ --storage-class STANDARD
        # Download
        aws s3 cp s3://my-bucket/backups/backup.tar.gz ./restore.tar.gz
    metric_explanations:
      storage-scalability:
        reason: Cloudflare R2 Enterprise raises throughput and request ceilings on the same distributed store, letting high-volume tenants sustain more concurrent operations against ever-larger buckets.
        contributing_factors:
          - Higher request-rate limits sustain greater concurrent object operations
          - Same on-demand capacity model scales bucket size without provisioning
          - Jurisdictional placement can pin objects to a region for compliance
      data-durability:
        reason: Cloudflare R2 Enterprise inherits the same multi-device, multi-location redundancy as Standard while adding bucket-level controls like object lock to prevent premature deletion.
        contributing_factors:
          - Multi-device, multi-location replication matches the Standard tier
          - Object-lock retention guards critical data against overwrite or deletion
          - Bucket-level access policies tighten who can mutate stored objects
      cost-per-gb:
        reason: Cloudflare R2 Enterprise preserves zero egress while offering committed-volume pricing that lowers the effective per-GB storage rate for large, predictable footprints.
        contributing_factors:
          - Zero egress fees carry over from the Standard tier
          - Committed-use volume discounts reduce the effective per-GB rate
          - Predictable storage-plus-operations billing without egress surprises
connection_properties:
  protocol: HTTPS
  communication_patterns:
    - request-response
  typical_latency: 20-60ms
  co_location_potential: false
ports:
  - id: db-in
    type: database
    direction: in
  - id: monitor-out
    type: monitor
    direction: out
