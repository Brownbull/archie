id: pushpin
name: Pushpin
category: real-time
type_id: realtime
vendor_url: https://pushpin.org/
description: Reverse proxy for real-time push that decouples WebSocket handling from backend logic
is: A reverse proxy that handles WebSocket, HTTP streaming, and Server-Sent Events connections on behalf of your backend, letting any language publish to open connections via a simple REST API without managing socket state
gain:
  - Decouples realtime push from backend language and framework
  - Backend publishes via REST — no socket state to manage
  - Supports WebSocket, SSE, and HTTP long-polling in one proxy
cost:
  - Extra infrastructure hop adds a small latency overhead
  - Proxy must be scaled and monitored independently
  - Less ecosystem tooling compared to Socket.IO or Phoenix
tags:
  - realtime
  - websocket
  - reverse-proxy
  - pushpin
  - language-agnostic
base_metrics:
  - id: message-latency
    value: low
    numeric_value: 4
    category: performance
  - id: concurrent-connections
    value: medium
    numeric_value: 6
    category: scalability
  - id: operational-complexity
    value: medium
    numeric_value: 5
    category: operational-complexity
  - id: pushpin-cost-efficiency
    value: high
    numeric_value: 7
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard
    description: >-
      Pushpin: a proxy that turns plain HTTP backends into realtime push (SSE/WebSocket) — your API stays request/response, clients get streams.
    docs_url: https://pushpin.org/docs/
    monthly_cost: 50
    max_rps: 6000
    base_latency_ms: 5
    metrics:
      - id: message-latency
        value: low
        numeric_value: 4
        category: performance
      - id: concurrent-connections
        value: medium
        numeric_value: 5
        category: scalability
      - id: pushpin-cost-efficiency
        value: high
        numeric_value: 8
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Pushpin — Standard WebSocket connection
        import WebSocket from 'ws'

        const ws = new WebSocket(process.env.WS_URL!)
        ws.on('open', () => ws.send(JSON.stringify({ event: 'subscribe', channel: 'updates' })))
        ws.on('message', (data) => console.log('received:', data.toString()))
    metric_explanations:
      message-latency:
        reason: A single Pushpin instance holds the client sockets and pushes data the instant the backend POSTs to its GRIP publish endpoint, adding only one local proxy hop between the backend's REST call and the open WebSocket or SSE stream.
        contributing_factors:
          - Backend-to-proxy publish is a fire-and-forget GRIP HTTP call, not a polling cycle
          - Pushpin fans the published item straight to subscribed connections without buffering through a separate broker
      concurrent-connections:
        reason: Pushpin's ZeroMQ-based proxy core uses non-blocking event-driven sockets to park many idle long-lived connections on one instance, while the stateless backend never has to hold socket state itself.
        contributing_factors:
          - Idle held connections consume proxy memory only, freeing backend workers for request handling
          - Event-loop I/O lets one process keep thousands of long-poll, SSE, and WebSocket clients open at once
      pushpin-cost-efficiency:
        reason: As an open-source proxy that offloads connection-holding from the application, the single standard instance lets a small stateless backend serve a large realtime audience without per-connection server scaling.
        contributing_factors:
          - Open-source GPL proxy with no per-connection or managed-service fee
          - Connection offload means backend capacity is sized for publish rate, not for held sockets
  - id: scaled
    name: Scaled
    description: >-
      Scaled Pushpin: multiple instances fan streams out at 2.5x the ceiling, keeping the realtime layer stateless in front of boring backends.
    docs_url: https://pushpin.org/docs/usage/
    monthly_cost: 100
    max_rps: 15000
    base_latency_ms: 4
    metrics:
      - id: message-latency
        value: low
        numeric_value: 3
        category: performance
      - id: concurrent-connections
        value: high
        numeric_value: 8
        category: scalability
      - id: pushpin-cost-efficiency
        value: medium
        numeric_value: 6
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Pushpin — Scaled WebSocket connection
        import WebSocket from 'ws'

        const ws = new WebSocket(process.env.WS_URL!)
        ws.on('open', () => ws.send(JSON.stringify({ event: 'subscribe', channel: 'updates' })))
        ws.on('message', (data) => console.log('received:', data.toString()))
    metric_explanations:
      message-latency:
        reason: Running multiple Pushpin instances behind a load balancer keeps the same single-hop GRIP publish path, and because each instance independently matches published items to its own held subscriptions, fan-out latency stays flat as the tier grows.
        contributing_factors:
          - A GRIP publish is broadcast to all proxy instances, so any client lands one hop from its data regardless of which node holds it
          - No shared connection state between instances means no cross-node coordination delay on publish
      concurrent-connections:
        reason: The scaled tier shards held connections across several stateless Pushpin instances, so total socket capacity rises with instance count while each node keeps using non-blocking event-driven I/O for its share.
        contributing_factors:
          - Connections distribute across instances behind the balancer, multiplying the per-node socket ceiling
          - Each instance stays stateless, so adding nodes needs no session replication or sticky routing
      pushpin-cost-efficiency:
        reason: Scaling out adds standing proxy instances and the GRIP fan-out cost of publishing to every node, trading some per-connection economy for the connection headroom and redundancy of a multi-instance fleet.
        contributing_factors:
          - Several always-on proxy instances raise baseline cost versus a single node
          - Publishing each item to all instances adds bandwidth overhead that grows with fleet size
connection_properties:
  protocol: WebSocket/HTTPS
  communication_patterns:
    - publish-subscribe
  typical_latency: 5-60ms
  co_location_potential: true
ports:
  - id: http-in
    type: http
    direction: in
  - id: stream-in
    type: stream
    direction: in
  - id: stream-out
    type: stream
    direction: out
  - id: monitor-out
    type: monitor
    direction: out
