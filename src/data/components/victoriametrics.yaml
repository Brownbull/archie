id: victoriametrics
name: VictoriaMetrics
category: data-storage
type_id: time-series-db
vendor_url: https://victoriametrics.com/
description: High-performance time-series database compatible with Prometheus with better compression and speed
is: A high-performance time-series database and monitoring solution that is fully compatible with Prometheus remote-write and PromQL, offering superior compression ratios and query speed at scale
gain:
  - Drop-in Prometheus compatibility (remote-write + PromQL)
  - Up to 10x better compression than Prometheus TSDB
  - Single-binary simplicity for small deployments
cost:
  - Clustering requires the enterprise or cloud edition
  - Smaller community than Prometheus or InfluxDB
  - Advanced features (downsampling, dedup) need tuning
tags:
  - time-series
  - metrics
  - victoriametrics
  - prometheus
  - monitoring
base_metrics:
  - id: write-throughput
    value: high
    numeric_value: 9
    category: performance
  - id: query-latency
    value: low
    numeric_value: 3
    category: performance
  - id: storage-compression
    value: high
    numeric_value: 10
    category: scalability
  - id: data-durability
    value: medium
    numeric_value: 6
    category: reliability
  - id: victoriametrics-cost-efficiency
    value: medium
    numeric_value: 5
    category: cost-efficiency
config_variants:
  - id: single-node
    name: Single Node
    description: >-
      Single-node VictoriaMetrics: the efficiency champion — 70k/sec ingest with famously low RAM and disk. A drop-in Prometheus remote storage.
    docs_url: https://docs.victoriametrics.com/
    monthly_cost: 65
    max_rps: 70000
    base_latency_ms: 3
    metrics:
      - id: write-throughput
        value: high
        numeric_value: 9
        category: performance
      - id: storage-compression
        value: high
        numeric_value: 10
        category: scalability
      - id: data-durability
        value: medium
        numeric_value: 5
        category: reliability
      - id: victoriametrics-cost-efficiency
        value: medium
        numeric_value: 5
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # VictoriaMetrics — Single Node metric ingestion
        curl -X POST http://localhost:8428/api/v1/write \
          -d 'cpu_usage{host="server1"} 0.72 1700000000'
        # Query
        curl 'http://localhost:8428/api/v1/query?query=cpu_usage{host="server1"}[5m]'
    metric_explanations:
      write-throughput:
        reason: VictoriaMetrics Single Node sustains very high ingest by buffering samples in memory and flushing them as immutable LSM parts, avoiding per-sample index locks on the hot path.
        contributing_factors:
          - In-memory buffering coalesces samples before each flush to disk
          - Immutable LSM-style parts make ingestion append-only and contention-free
          - Inverted-index updates are batched per flush rather than per sample
      storage-compression:
        reason: VictoriaMetrics Single Node reaches near-best-in-class density by storing timestamps and values in separate columns and applying Gorilla-style delta-of-delta and XOR encoding.
        contributing_factors:
          - Columnar layout compresses timestamps and values independently
          - Gorilla delta-of-delta timestamps and XOR float encoding shrink series data
          - Background merges recompress parts, raising the long-term compression ratio
      data-durability:
        reason: VictoriaMetrics Single Node persists merged parts to a single local disk, so durability depends on that volume's resilience with no built-in cross-node replication.
        contributing_factors:
          - Flushed parts are written to local disk and survive process restarts
          - Single-node storage has no internal replica, so disk loss loses data
          - Periodic vmbackup snapshots to object storage protect against volume failure
  - id: cluster
    name: Cluster
    description: >-
      VictoriaMetrics cluster: ingest, storage, and query split into scalable parts — 200k/sec class metrics with the same frugal footprint per point.
    docs_url: https://docs.victoriametrics.com/cluster-victoriametrics/
    monthly_cost: 150
    max_rps: 200000
    base_latency_ms: 2
    metrics:
      - id: write-throughput
        value: high
        numeric_value: 10
        category: performance
      - id: storage-compression
        value: high
        numeric_value: 10
        category: scalability
      - id: data-durability
        value: high
        numeric_value: 9
        category: reliability
      - id: victoriametrics-cost-efficiency
        value: low
        numeric_value: 3
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # VictoriaMetrics — Cluster metric ingestion
        curl -X POST http://localhost:8428/api/v1/write \
          -d 'cpu_usage{host="server1"} 0.72 1700000000'
        # Query
        curl 'http://localhost:8428/api/v1/query?query=cpu_usage{host="server1"}[5m]'
    metric_explanations:
      write-throughput:
        reason: VictoriaMetrics Cluster splits ingestion across stateless vminsert nodes that consistently hash each series to vmstorage shards, scaling write rate linearly as nodes are added.
        contributing_factors:
          - Stateless vminsert frontends accept writes and shard them by series
          - Consistent hashing routes each series to a fixed vmstorage node
          - Adding vmstorage shards raises aggregate ingest capacity near-linearly
      storage-compression:
        reason: VictoriaMetrics Cluster applies the same columnar Gorilla-style encoding per vmstorage shard, preserving the high compression ratio while spreading data across nodes.
        contributing_factors:
          - Each vmstorage shard compresses its own columns independently
          - Delta-of-delta and XOR encoding carry over from the single-node engine
          - Sharded background merges recompress parts in parallel across nodes
      data-durability:
        reason: VictoriaMetrics Cluster raises durability with a configurable replication factor that mirrors each series to multiple vmstorage nodes so a node loss does not drop data.
        contributing_factors:
          - Replication factor stores copies of each series on distinct vmstorage nodes
          - vminsert dual-writes replicas so a single node failure is non-fatal
          - vmselect deduplicates across replicas to return complete query results
connection_properties:
  protocol: HTTPS
  communication_patterns:
    - request-response
  typical_latency: 4-40ms
  co_location_potential: true
ports:
  - id: db-in
    type: database
    direction: in
  - id: monitor-out
    type: monitor
    direction: out
