id: amazon-mq
name: Amazon MQ
category: messaging
type_id: message-queue
vendor_url: https://aws.amazon.com/amazon-mq/
description: Managed message broker for ActiveMQ and RabbitMQ with standard protocols
is: A managed AWS broker running ActiveMQ or RabbitMQ that speaks standard protocols (AMQP, MQTT, STOMP, JMS), letting you lift-and-shift existing messaging apps without operating the broker yourself
gain:
  - Managed ActiveMQ/RabbitMQ — no broker ops
  - Standard protocols (AMQP, MQTT, STOMP, JMS)
  - Easy migration path for existing messaging apps
cost:
  - AWS-only; broker instances billed hourly
  - Lower ceiling than partitioned log systems
  - Active/standby failover adds a brief pause
tags:
  - messaging
  - queue
  - managed
  - aws
  - amqp
base_metrics:
  - id: message-throughput
    value: medium
    numeric_value: 6
    category: performance
  - id: message-durability
    value: high
    numeric_value: 8
    category: reliability
  - id: horizontal-scalability
    value: medium
    numeric_value: 5
    category: scalability
  - id: operational-complexity
    value: low
    numeric_value: 3
    category: operational-complexity
  - id: amazonmq-cost-efficiency
    value: medium
    numeric_value: 5
    category: cost-efficiency
config_variants:
  - id: single-instance
    name: Single Instance
    description: >-
      Managed ActiveMQ/RabbitMQ on one instance: protocol-compatible lift-and-shift for existing brokers. One box, broker semantics, AWS runs it.
    docs_url: https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/welcome.html
    monthly_cost: 50
    max_rps: 6000
    base_latency_ms: 6
    metrics:
      - id: message-throughput
        value: medium
        numeric_value: 6
        category: performance
      - id: message-durability
        value: medium
        numeric_value: 5
        category: reliability
      - id: amazonmq-cost-efficiency
        value: high
        numeric_value: 7
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |
        # Amazon MQ — single-instance RabbitMQ broker
        aws mq create-broker \
          --broker-name orders \
          --engine-type RABBITMQ \
          --deployment-mode SINGLE_INSTANCE \
          --host-instance-type mq.m5.large
    metric_explanations:
      amazonmq-cost-efficiency:
        reason: One broker instance with no standby is the cheapest managed option for non-critical or dev workloads.
        contributing_factors:
          - Single instance, no standby to fund
          - Managed patching avoids ops staff cost
          - Right-sized instance class for the load
      message-durability:
        reason: A single instance persists messages but has no hot standby, so a host failure pauses delivery until recovery.
        contributing_factors:
          - Messages persisted to broker storage
          - No second node for instant failover
          - Recovery restarts the broker on new hardware
  - id: active-standby
    name: Active/Standby (HA)
    description: >-
      Amazon MQ active/standby: a hot spare takes over on failure, with a bit more throughput. Failover costs a brief pause — and double-ish the bill.
    docs_url: https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/active-standby-broker-deployment.html
    monthly_cost: 110
    max_rps: 9000
    base_latency_ms: 8
    metrics:
      - id: message-throughput
        value: medium
        numeric_value: 6
        category: performance
      - id: message-durability
        value: high
        numeric_value: 9
        category: reliability
      - id: amazonmq-cost-efficiency
        value: medium
        numeric_value: 4
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |
        # Amazon MQ — active/standby across two AZs for HA
        aws mq create-broker \
          --broker-name orders \
          --engine-type ACTIVEMQ \
          --deployment-mode ACTIVE_STANDBY_MULTI_AZ
    metric_explanations:
      message-durability:
        reason: An active/standby pair across AZs fails over automatically, so a single-AZ outage does not lose messages.
        contributing_factors:
          - Standby broker in a second AZ
          - Shared durable storage for messages
          - Automatic failover on host loss
      amazonmq-cost-efficiency:
        reason: Running two AZs doubles instance cost versus a single broker, traded for availability.
        contributing_factors:
          - Two broker instances billed
          - Cross-AZ data and storage charges
          - Worth it only when uptime is critical
connection_properties:
  protocol: AMQP
  communication_patterns:
    - publish-subscribe
    - request-response
  typical_latency: 4-30ms
  co_location_potential: false
demand_responses:
  traffic-volume:
    high:
      message-throughput: 0.8
    extreme:
      message-throughput: 0.6
  burst-pattern:
    periodic-spikes:
      message-throughput: 0.8
    unpredictable:
      message-throughput: 0.6
ports:
  - id: stream-in
    type: stream
    direction: in
  - id: stream-out
    type: stream
    direction: out
  - id: monitor-out
    type: monitor
    direction: out
