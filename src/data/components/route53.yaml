id: route53
name: AWS Route 53
category: delivery-network
type_id: dns
vendor_url: https://aws.amazon.com/route53/
description: Managed authoritative DNS with health checks and rich routing policies
is: AWS's highly available authoritative DNS with health checks and routing policies (latency, geolocation, weighted, failover) that integrate tightly with AWS endpoints
gain:
  - Rich routing — latency, geo, weighted, failover
  - Deep AWS integration (alias records to ALB/CloudFront)
  - 100% availability SLA on the DNS service
cost:
  - AWS-only; priced per hosted zone and per query
  - Routing policies add per-query and health-check fees
  - Less of a free tier than some competitors
tags:
  - dns
  - networking
  - managed
  - aws
  - route53
base_metrics:
  - id: resolution-latency
    value: low
    numeric_value: 4
    category: performance
  - id: global-availability
    value: high
    numeric_value: 10
    category: reliability
  - id: operational-complexity
    value: low
    numeric_value: 3
    category: operational-complexity
  - id: r53-cost-efficiency
    value: medium
    numeric_value: 6
    category: cost-efficiency
config_variants:
  - id: simple
    name: Simple Routing
    monthly_cost: 5
    max_rps: 90000
    base_latency_ms: 15
    metrics:
      - id: resolution-latency
        value: low
        numeric_value: 4
        category: performance
      - id: global-availability
        value: high
        numeric_value: 9
        category: reliability
      - id: r53-cost-efficiency
        value: high
        numeric_value: 7
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |
        # Route 53 — alias an apex domain to a CloudFront/ALB target
        aws route53 change-resource-record-sets --hosted-zone-id $ZONE \
          --change-batch '{"Changes":[{"Action":"UPSERT","ResourceRecordSet":{"Name":"example.com","Type":"A","AliasTarget":{"HostedZoneId":"Z2FDTNDATAQYW2","DNSName":"d123.cloudfront.net","EvaluateTargetHealth":false}}}]}'
    metric_explanations:
      resolution-latency:
        reason: Route 53's global anycast network answers queries from a nearby edge location, keeping resolution low.
        contributing_factors:
          - Global anycast resolver fleet
          - Alias records resolve within AWS quickly
          - TTL caching at downstream resolvers
      r53-cost-efficiency:
        reason: A single hosted zone with simple records is cheap; cost scales mainly with query volume.
        contributing_factors:
          - Low per-hosted-zone monthly fee
          - Per-million-query pricing
          - Alias queries to AWS targets are free
  - id: latency-routing
    name: Latency / Failover Routing
    monthly_cost: 18
    max_rps: 70000
    base_latency_ms: 14
    metrics:
      - id: resolution-latency
        value: low
        numeric_value: 3
        category: performance
      - id: global-availability
        value: high
        numeric_value: 10
        category: reliability
      - id: r53-cost-efficiency
        value: medium
        numeric_value: 5
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |
        # Route 53 — latency-based record with a health check
        aws route53 change-resource-record-sets --hosted-zone-id $ZONE \
          --change-batch '{"Changes":[{"Action":"UPSERT","ResourceRecordSet":{"Name":"api.example.com","Type":"A","SetIdentifier":"us-east","Region":"us-east-1","TTL":60,"ResourceRecords":[{"Value":"203.0.113.10"}],"HealthCheckId":"hc-123"}}]}'
    metric_explanations:
      global-availability:
        reason: Failover routing with health checks removes unhealthy endpoints and directs traffic to healthy regions automatically.
        contributing_factors:
          - Health checks gate each endpoint
          - Automatic failover to healthy records
          - Latency routing picks the fastest region
      resolution-latency:
        reason: Latency-based routing returns the region with the lowest measured RTT for the querying resolver.
        contributing_factors:
          - Per-region latency measurements
          - Resolver mapped to its closest region
          - Short TTLs keep routing responsive
connection_properties:
  protocol: DNS/UDP
  communication_patterns:
    - request-response
  typical_latency: 5-45ms
  co_location_potential: false
demand_responses:
  traffic-volume:
    high:
      resolution-latency: 0.9
    extreme:
      resolution-latency: 0.8
  geographic-spread:
    multi-region:
      resolution-latency: 0.9
    global:
      resolution-latency: 0.8
ports:
  - id: http-in
    type: http
    direction: in
  - id: http-out
    type: http
    direction: out
  - id: monitor-out
    type: monitor
    direction: out
