id: azure-firewall
name: Azure Firewall
category: monitoring
type_id: security
vendor_url: https://azure.microsoft.com/en-us/products/azure-firewall
description: Cloud-native network firewall with threat intelligence, TLS inspection, and IDPS
is: A cloud-native, managed network firewall in Azure that provides threat-intelligence-based filtering, TLS inspection, and intrusion detection and prevention (IDPS) to secure virtual network traffic
gain:
  - Built-in threat intelligence from Microsoft Security
  - TLS inspection decrypts and inspects encrypted traffic
  - IDPS detects and blocks known exploit patterns
cost:
  - Base deployment cost is higher than edge WAFs
  - TLS inspection adds latency and compute overhead
  - Premium SKU required for IDPS and URL filtering
tags:
  - security
  - firewall
  - azure
  - network
  - cloud
base_metrics:
  - id: alert-latency
    value: low
    numeric_value: 3
    category: performance
  - id: threat-detection
    value: high
    numeric_value: 9
    category: security
  - id: data-durability
    value: high
    numeric_value: 8
    category: reliability
  - id: operational-complexity
    value: medium
    numeric_value: 4
    category: operational-complexity
  - id: waf-cost-efficiency
    value: medium
    numeric_value: 6
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard
    monthly_cost: 30
    max_rps: 220000
    base_latency_ms: 2
    metrics:
      - id: threat-detection
        value: high
        numeric_value: 8
        category: security
      - id: alert-latency
        value: low
        numeric_value: 3
        category: performance
      - id: waf-cost-efficiency
        value: medium
        numeric_value: 6
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Azure Firewall — Standard WAF rule check
        # List active rules
        aws wafv2 list-web-acls --scope REGIONAL --region us-east-1
        # Check blocked requests
        aws wafv2 get-sampled-requests --web-acl-arn $ACL_ARN --rule-metric-name AllRequests --scope REGIONAL --time-window '{"StartTime":"2024-01-01","EndTime":"2024-01-02"}' --max-items 10
    metric_explanations:
      threat-detection:
        reason: Azure Firewall Standard detects threats through managed rule sets and behavioral analysis.
        contributing_factors:
          - Continuously updated managed rules cover OWASP Top 10
          - Rate-based rules detect and block volumetric attacks automatically
      alert-latency:
        reason: Azure Firewall Standard achieves this metric level through its architecture and configuration.
        contributing_factors:
          - Platform-level optimizations reduce overhead
          - Configuration defaults are tuned for typical production workloads
      waf-cost-efficiency:
        reason: Azure Firewall Standard achieves this metric level through its architecture and configuration.
        contributing_factors:
          - Platform-level optimizations reduce overhead
          - Configuration defaults are tuned for typical production workloads
  - id: premium
    name: Premium
    monthly_cost: 80
    max_rps: 400000
    base_latency_ms: 1
    metrics:
      - id: threat-detection
        value: high
        numeric_value: 10
        category: security
      - id: alert-latency
        value: low
        numeric_value: 2
        category: performance
      - id: waf-cost-efficiency
        value: medium
        numeric_value: 4
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Azure Firewall — Premium WAF rule check
        # List active rules
        aws wafv2 list-web-acls --scope REGIONAL --region us-east-1
        # Check blocked requests
        aws wafv2 get-sampled-requests --web-acl-arn $ACL_ARN --rule-metric-name AllRequests --scope REGIONAL --time-window '{"StartTime":"2024-01-01","EndTime":"2024-01-02"}' --max-items 10
    metric_explanations:
      threat-detection:
        reason: Azure Firewall Premium detects threats through managed rule sets and behavioral analysis.
        contributing_factors:
          - Continuously updated managed rules cover OWASP Top 10
          - Rate-based rules detect and block volumetric attacks automatically
      alert-latency:
        reason: Azure Firewall Premium achieves this metric level through its architecture and configuration.
        contributing_factors:
          - Platform-level optimizations reduce overhead
          - Configuration defaults are tuned for typical production workloads
      waf-cost-efficiency:
        reason: Azure Firewall Premium achieves this metric level through its architecture and configuration.
        contributing_factors:
          - Platform-level optimizations reduce overhead
          - Configuration defaults are tuned for typical production workloads
connection_properties:
  protocol: HTTPS
  communication_patterns:
    - request-response
  typical_latency: 2-25ms
  co_location_potential: false
ports:
  - id: http-in
    type: http
    direction: in
  - id: http-out
    type: http
    direction: out
  - id: monitor-out
    type: monitor
    direction: out
