id: azure-firewall
name: Azure Firewall
category: monitoring
type_id: security
vendor_url: https://azure.microsoft.com/en-us/products/azure-firewall
description: Cloud-native network firewall with threat intelligence, TLS inspection, and IDPS
is: A cloud-native, managed network firewall in Azure that provides threat-intelligence-based filtering, TLS inspection, and intrusion detection and prevention (IDPS) to secure virtual network traffic
gain:
  - Built-in threat intelligence from Microsoft Security
  - TLS inspection decrypts and inspects encrypted traffic
  - IDPS detects and blocks known exploit patterns
cost:
  - Base deployment cost is higher than edge WAFs
  - TLS inspection adds latency and compute overhead
  - Premium SKU required for IDPS and URL filtering
tags:
  - security
  - firewall
  - azure
  - network
  - cloud
base_metrics:
  - id: alert-latency
    value: low
    numeric_value: 3
    category: performance
  - id: threat-detection
    value: high
    numeric_value: 9
    category: security
  - id: data-durability
    value: high
    numeric_value: 8
    category: reliability
  - id: operational-complexity
    value: medium
    numeric_value: 4
    category: operational-complexity
  - id: waf-cost-efficiency
    value: medium
    numeric_value: 6
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard
    monthly_cost: 30
    max_rps: 220000
    base_latency_ms: 2
    metrics:
      - id: threat-detection
        value: high
        numeric_value: 8
        category: security
      - id: alert-latency
        value: low
        numeric_value: 3
        category: performance
      - id: waf-cost-efficiency
        value: medium
        numeric_value: 6
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Azure Firewall — Standard WAF rule check
        # List active rules
        aws wafv2 list-web-acls --scope REGIONAL --region us-east-1
        # Check blocked requests
        aws wafv2 get-sampled-requests --web-acl-arn $ACL_ARN --rule-metric-name AllRequests --scope REGIONAL --time-window '{"StartTime":"2024-01-01","EndTime":"2024-01-02"}' --max-items 10
    metric_explanations:
      threat-detection:
        reason: The Standard SKU filters virtual-network traffic with Microsoft threat-intelligence feeds plus network and application rule collections, alerting or denying connections to known malicious IPs and domains without the Premium IDPS engine.
        contributing_factors:
          - Threat-intelligence feeds from Microsoft Security flag traffic to known-bad IPs and FQDNs
          - Application rules enforce FQDN allowlists for outbound HTTP/S egress control
          - Network rules filter by port, protocol, and IP across the VNet hub
      alert-latency:
        reason: Rule processing happens inline on the stateful firewall data plane, and matches stream to Azure Monitor and Log Analytics through diagnostic settings, surfacing threat-intel and rule hits within the platform's ingestion window.
        contributing_factors:
          - Stateful inline inspection evaluates connections in the forwarding path, not as a batch job
          - Diagnostic logs flow to Log Analytics where Sentinel rules can alert in near real time
      waf-cost-efficiency:
        reason: The Standard SKU bills a fixed per-hour deployment fee plus per-GB data processing, so cost efficiency is moderate because the firewall runs continuously even when traffic is light.
        contributing_factors:
          - Pricing combines a flat hourly deployment charge with a per-GB processed-data fee
          - Always-on managed instances incur baseline cost regardless of throughput
  - id: premium
    name: Premium
    monthly_cost: 80
    max_rps: 400000
    base_latency_ms: 1
    metrics:
      - id: threat-detection
        value: high
        numeric_value: 10
        category: security
      - id: alert-latency
        value: low
        numeric_value: 2
        category: performance
      - id: waf-cost-efficiency
        value: medium
        numeric_value: 4
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Azure Firewall — Premium WAF rule check
        # List active rules
        aws wafv2 list-web-acls --scope REGIONAL --region us-east-1
        # Check blocked requests
        aws wafv2 get-sampled-requests --web-acl-arn $ACL_ARN --rule-metric-name AllRequests --scope REGIONAL --time-window '{"StartTime":"2024-01-01","EndTime":"2024-01-02"}' --max-items 10
    metric_explanations:
      threat-detection:
        reason: The Premium SKU adds a signature-based IDPS engine and TLS inspection, decrypting outbound and east-west TLS to scan payloads against thousands of Microsoft exploit signatures, achieving the highest detection coverage in the lineup.
        contributing_factors:
          - IDPS matches decrypted traffic against Microsoft's continuously updated signature set
          - TLS inspection terminates and re-encrypts sessions so encrypted payloads are scanned, not bypassed
          - URL filtering and web categories extend FQDN control to full-path and category granularity
      alert-latency:
        reason: IDPS signature hits and TLS-inspection verdicts are produced inline on the Premium data plane and exported to Log Analytics, so deep-packet detections reach Azure Monitor and Sentinel with minimal delay.
        contributing_factors:
          - IDPS alert and deny verdicts are generated in the inline inspection path per packet
          - Structured IDPS logs feed Log Analytics for immediate Sentinel correlation and alerting
      waf-cost-efficiency:
        reason: The Premium SKU carries a higher fixed hourly rate than Standard plus per-GB processing, and TLS decryption adds compute overhead, making it the least cost-efficient tier despite its superior detection.
        contributing_factors:
          - Premium's hourly deployment fee exceeds the Standard SKU for the same idle footprint
          - TLS inspection and IDPS add CPU-bound processing that raises effective per-GB cost
connection_properties:
  protocol: HTTPS
  communication_patterns:
    - request-response
  typical_latency: 2-25ms
  co_location_potential: false
ports:
  - id: http-in
    type: http
    direction: in
  - id: http-out
    type: http
    direction: out
  - id: monitor-out
    type: monitor
    direction: out
