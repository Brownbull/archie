id: apigee
name: Apigee
category: delivery-network
type_id: api-gateway
vendor_url: https://cloud.google.com/apigee
description: Google Cloud's full lifecycle API management platform
is: Google Cloud's enterprise API management platform that provides full lifecycle API governance including design, security, analytics, monetization, and developer portal capabilities on top of a high-performance gateway proxy
gain:
  - Full lifecycle API management (design, publish, monitor, monetize)
  - Built-in analytics, traffic management, and developer portal
  - Deep GCP integration with Cloud Endpoints and Anthos
cost:
  - Enterprise pricing is significantly higher than OSS alternatives
  - Complex setup and learning curve for the full platform
  - Overkill for simple API proxying use cases
tags:
  - api-gateway
  - networking
  - apigee
  - routing
  - plugins
base_metrics:
  - id: request-latency
    value: low
    numeric_value: 5
    category: performance
  - id: concurrent-connections
    value: high
    numeric_value: 8
    category: scalability
  - id: policy-enforcement
    value: high
    numeric_value: 9
    category: security
  - id: operational-complexity
    value: medium
    numeric_value: 6
    category: operational-complexity
  - id: apigee-cost-efficiency
    value: medium
    numeric_value: 5
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard
    monthly_cost: 60
    max_rps: 160000
    base_latency_ms: 6
    metrics:
      - id: request-latency
        value: medium
        numeric_value: 5
        category: performance
      - id: operational-complexity
        value: medium
        numeric_value: 6
        category: operational-complexity
      - id: apigee-cost-efficiency
        value: medium
        numeric_value: 6
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Apigee — Standard proxy configuration
        curl -s https://api.example.com/v1/resource \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" | jq '.'
    metric_explanations:
      request-latency:
        reason: Apigee Standard runs each request through a sequential policy pipeline of message processors, so latency is dominated by the attached policies (OAuth, quota, transforms) rather than raw proxying, landing in the mid single-digit milliseconds for a typical flow.
        contributing_factors:
          - Policy flow executed step-by-step on Apigee message processors
          - OAuth and quota checks add per-request work beyond plain forwarding
          - Response caching policy short-circuits backend calls for cacheable targets
      operational-complexity:
        reason: Apigee Standard is a Google-managed control plane, so Google patches and scales the gateway runtime while teams still author proxy bundles, policy XML, and the full API lifecycle themselves.
        contributing_factors:
          - Google operates and patches the message-processor runtime
          - Teams own proxy-bundle authoring, policy XML, and environment promotion
          - Built-in analytics dashboards surface traffic and error metrics
      apigee-cost-efficiency:
        reason: Apigee Standard prices on an entitlement of API calls with overage charges, so cost efficiency depends on staying within the committed call volume rather than on per-request infrastructure tuning.
        contributing_factors:
          - Billing tied to a committed monthly API-call entitlement
          - Overage calls billed at a higher marginal rate past the commitment
          - Response caching reduces billable backend calls on repeat requests
  - id: enterprise
    name: Enterprise
    monthly_cost: 150
    max_rps: 300000
    base_latency_ms: 4
    metrics:
      - id: request-latency
        value: low
        numeric_value: 4
        category: performance
      - id: operational-complexity
        value: low
        numeric_value: 4
        category: operational-complexity
      - id: apigee-cost-efficiency
        value: medium
        numeric_value: 4
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # Apigee — Enterprise proxy configuration
        curl -s https://api.example.com/v1/resource \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" | jq '.'
    metric_explanations:
      request-latency:
        reason: Apigee Enterprise provisions dedicated, multi-region message-processor capacity so policy pipelines run on reserved compute close to backends, trimming queuing and cold-path overhead to a few milliseconds even under heavy policy load.
        contributing_factors:
          - Dedicated message-processor capacity avoids noisy-neighbor queuing
          - Multi-region deployment places the gateway near regional backends
          - Distributed caching keeps tokens and cacheable responses hot at the edge
      operational-complexity:
        reason: Apigee Enterprise adds Google-managed multi-region high availability, autoscaling, and advanced API security analytics on top of the managed runtime, so platform operations stay low even as governance and lifecycle scope expand.
        contributing_factors:
          - Google handles cross-region failover and runtime autoscaling
          - Advanced API security flags abuse and anomalies automatically
          - Developer portal and lifecycle tooling reduce manual governance work
      apigee-cost-efficiency:
        reason: Apigee Enterprise carries a high committed-capacity floor for its dedicated multi-region runtime, so per-call cost only improves at large sustained volume and the platform is expensive for low-traffic API programs.
        contributing_factors:
          - High fixed entitlement reserves dedicated multi-region capacity
          - Per-call cost amortizes only at sustained enterprise traffic levels
          - Advanced security and monetization features included but raise the floor
connection_properties:
  protocol: HTTP
  communication_patterns:
    - request-response
  typical_latency: 2-25ms
  co_location_potential: false
ports:
  - id: http-in
    type: http
    direction: in
  - id: http-out
    type: http
    direction: out
  - id: auth-out
    type: auth
    direction: out
  - id: monitor-out
    type: monitor
    direction: out
