id: meilisearch
name: Meilisearch
category: search
type_id: search-engine
vendor_url: https://www.meilisearch.com/
description: Lightning-fast, typo-tolerant search engine focused on developer experience
is: A lightweight, developer-friendly search engine that provides instant typo-tolerant full-text search with simple RESTful APIs and minimal configuration out of the box
gain:
  - Sub-50ms search with typo tolerance by default
  - Minimal configuration for quick setup
  - Simple RESTful API with great developer ergonomics
cost:
  - Single-node only — no native clustering
  - Less suited for complex analytics queries
  - Smaller ecosystem than Elasticsearch
tags:
  - search
  - full-text
  - meilisearch
  - instant-search
  - typo-tolerant
base_metrics:
  - id: query-latency
    value: low
    numeric_value: 3
    category: performance
  - id: index-freshness
    value: high
    numeric_value: 8
    category: reliability
  - id: horizontal-scalability
    value: medium
    numeric_value: 5
    category: scalability
  - id: operational-complexity
    value: low
    numeric_value: 2
    category: operational-complexity
  - id: meilisearch-cost-efficiency
    value: medium
    numeric_value: 5
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard
    description: >-
      Meilisearch: typo-tolerant, developer-friendly search that ships in an afternoon. A modest ceiling — the indie favorite for product search.
    docs_url: https://www.meilisearch.com/docs
    monthly_cost: 40
    max_rps: 2000
    base_latency_ms: 12
    metrics:
      - id: query-latency
        value: low
        numeric_value: 3
        category: performance
      - id: horizontal-scalability
        value: medium
        numeric_value: 5
        category: scalability
      - id: operational-complexity
        value: low
        numeric_value: 2
        category: operational-complexity
      - id: meilisearch-cost-efficiency
        value: medium
        numeric_value: 5
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Meilisearch — Standard search query
        const results = await client.search({
          index: 'products',
          query: { match: { name: searchTerm } },
          size: 20,
          highlight: { fields: { name: {} } },
        })
    metric_explanations:
      query-latency:
        reason: Meilisearch Standard answers search-as-you-type from a memory-mapped LMDB index, resolving prefixes and typo variants through precomputed ranking rules to stay under 50ms.
        contributing_factors:
          - Memory-mapped LMDB index serves reads straight from the OS page cache
          - Prefix and bucketed typo-tolerance structures avoid per-query scans
          - Default relevancy ranking rules are precomputed rather than evaluated live
      horizontal-scalability:
        reason: Meilisearch Standard runs as a single write node, so capacity scales vertically with CPU and RAM rather than by sharding across a cluster.
        contributing_factors:
          - Single-node architecture means no native sharding or clustering
          - Throughput grows by adding CPU cores and RAM to one instance
          - Read load can be fronted by a cache or CDN since the engine itself is single-writer
      operational-complexity:
        reason: Meilisearch Standard ships as one self-contained binary with sane defaults, so setup and indexing need almost no tuning beyond pointing it at a data directory.
        contributing_factors:
          - Single static binary with no external dependencies to deploy
          - Schemaless indexing infers field types on first document ingest
          - Sensible default ranking rules require no relevance configuration to start
  - id: scaled
    name: Scaled
    description: >-
      Scaled Meilisearch: more memory and replicas push the same pleasant engine to 2.5x the queries. Still simplest-in-class to operate.
    docs_url: https://www.meilisearch.com/docs/learn/cookbooks/running_production
    monthly_cost: 90
    max_rps: 5000
    base_latency_ms: 8
    metrics:
      - id: query-latency
        value: low
        numeric_value: 2
        category: performance
      - id: horizontal-scalability
        value: medium
        numeric_value: 6
        category: scalability
      - id: operational-complexity
        value: low
        numeric_value: 3
        category: operational-complexity
      - id: meilisearch-cost-efficiency
        value: low
        numeric_value: 3
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |-
        // Meilisearch — Scaled search query
        const results = await client.search({
          index: 'products',
          query: { match: { name: searchTerm } },
          size: 20,
          highlight: { fields: { name: {} } },
        })
    metric_explanations:
      query-latency:
        reason: Meilisearch Scaled drives latency below 10ms by hosting the full LMDB index in RAM on a larger instance, so prefix and typo lookups never touch disk under load.
        contributing_factors:
          - Larger RAM footprint keeps the entire memory-mapped index resident
          - Higher core count parallelizes concurrent search request handling
          - Hot ranking-rule structures stay cached, avoiding cold-start penalties
      horizontal-scalability:
        reason: Meilisearch Scaled remains single-writer but fans reads out to remote replicas synced from the primary, raising read concurrency without true sharding.
        contributing_factors:
          - Read replicas synced from the primary absorb high query concurrency
          - Writes still funnel through one primary, capping write scalability
          - Load balancing across replicas spreads search traffic but not index size
      operational-complexity:
        reason: Meilisearch Scaled keeps the single-binary simplicity but adds replica sync and snapshot scheduling that operators must monitor and configure.
        contributing_factors:
          - Replica syncing introduces lag monitoring not present on a single node
          - Periodic snapshots and dumps must be scheduled for backup and restore
          - Capacity planning shifts to balancing primary writes against replica reads
connection_properties:
  protocol: HTTPS
  communication_patterns:
    - request-response
  typical_latency: 5-50ms
  co_location_potential: false
ports:
  - id: db-in
    type: database
    direction: in
  - id: monitor-out
    type: monitor
    direction: out
