id: vault
name: HashiCorp Vault
category: monitoring
type_id: security
vendor_url: https://www.vaultproject.io/
description: Secrets management with dynamic credentials, encryption, and tight access control
is: A secrets-management system that stores and dynamically issues credentials, encrypts data via a transit API, and enforces fine-grained policy-based access with full audit logging, self-hosted or as HCP Vault
gain:
  - Central secrets store with dynamic, short-lived creds
  - Encryption-as-a-service via the transit engine
  - Fine-grained policies with complete audit trail
cost:
  - Self-hosted HA (Raft/Consul) is real ops work
  - A central secret store is a critical dependency
  - Unseal/key management adds operational ritual
tags:
  - security
  - secrets
  - vault
  - encryption
  - access-control
base_metrics:
  - id: secret-retrieval-latency
    value: low
    numeric_value: 4
    category: performance
  - id: access-control
    value: high
    numeric_value: 9
    category: security
  - id: data-durability
    value: high
    numeric_value: 9
    category: reliability
  - id: operational-complexity
    value: high
    numeric_value: 7
    category: operational-complexity
  - id: vault-cost-efficiency
    value: high
    numeric_value: 7
    category: cost-efficiency
config_variants:
  - id: self-hosted
    name: Self-Hosted (HA Raft)
    description: >-
      Self-hosted Vault with Raft: secrets, dynamic credentials, and encryption-as-a-service under your control. Unsealing and upgrades are on you.
    docs_url: https://developer.hashicorp.com/vault/docs
    monthly_cost: 60
    max_rps: 5000
    base_latency_ms: 6
    metrics:
      - id: access-control
        value: high
        numeric_value: 9
        category: security
      - id: operational-complexity
        value: high
        numeric_value: 8
        category: operational-complexity
      - id: vault-cost-efficiency
        value: high
        numeric_value: 9
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |
        # Vault — dynamic, short-lived database credentials on demand
        vault read database/creds/app-role
        # returns a username/password that auto-expire at the lease TTL
    metric_explanations:
      access-control:
        reason: Policy-bound tokens and dynamic, short-lived credentials minimize blast radius and leave a full audit trail.
        contributing_factors:
          - Least-privilege policies per token
          - Dynamic secrets expire on a lease TTL
          - Every access is audit-logged
      operational-complexity:
        reason: Running HA Vault means managing a Raft cluster, unseal keys, and certificate rotation yourself.
        contributing_factors:
          - Raft quorum and storage to operate
          - Unseal/auto-unseal key management
          - Upgrades and backups are your job
  - id: hcp-vault
    name: HCP Vault (Managed)
    description: >-
      HCP Vault: the managed cluster — HashiCorp runs the consensus, you consume the API. Trades a slight latency bump for never owning an unseal ceremony.
    docs_url: https://developer.hashicorp.com/hcp/docs/vault
    monthly_cost: 200
    max_rps: 6000
    base_latency_ms: 9
    metrics:
      - id: access-control
        value: high
        numeric_value: 9
        category: security
      - id: operational-complexity
        value: low
        numeric_value: 3
        category: operational-complexity
      - id: vault-cost-efficiency
        value: medium
        numeric_value: 5
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |
        # HCP Vault — managed cluster; auth then read a KV secret
        export VAULT_ADDR=https://my-vault.hashicorp.cloud:8200
        vault login -method=oidc
        vault kv get secret/app/db
    metric_explanations:
      operational-complexity:
        reason: HCP runs the cluster, auto-unseal, upgrades, and backups, removing most day-two operations.
        contributing_factors:
          - Managed Raft storage and unseal
          - Automatic patching and upgrades
          - Built-in backups and monitoring
      vault-cost-efficiency:
        reason: The managed tier carries a platform fee above self-hosting on your own infrastructure.
        contributing_factors:
          - Hourly managed-cluster pricing
          - Pay for managed availability and support
          - Cheaper than staffing Vault operations
connection_properties:
  protocol: HTTPS
  communication_patterns:
    - request-response
  typical_latency: 4-30ms
  co_location_potential: true
demand_responses:
  traffic-volume:
    high:
      secret-retrieval-latency: 0.8
    extreme:
      secret-retrieval-latency: 0.6
  concurrent-users:
    high:
      secret-retrieval-latency: 0.8
    extreme:
      secret-retrieval-latency: 0.6
ports:
  - id: http-in
    type: http
    direction: in
  - id: auth-out
    type: auth
    direction: out
  - id: monitor-out
    type: monitor
    direction: out
