id: spring-boot
name: Java + Spring Boot
category: compute
type_id: compute
vendor_url: https://spring.io/
description: JVM web framework for high-throughput, strongly-typed enterprise services
is: A mature, strongly-typed JVM stack with thread-per-request concurrency, excellent tooling, and high steady-state throughput at the cost of memory and startup time
gain:
  - High steady-state throughput once the JIT warms up
  - Strong typing, vast libraries, first-class enterprise tooling
  - True multi-core parallelism via OS threads (no GIL)
cost:
  - High memory footprint and slow cold start on the JVM
  - More boilerplate than scripting runtimes
  - Operational tuning (heap, GC) takes expertise
tags:
  - server
  - java
  - spring
  - jvm
  - enterprise
base_metrics:
  - id: request-latency
    value: low
    numeric_value: 3
    category: performance
  - id: concurrent-connections
    value: high
    numeric_value: 8
    category: scalability
  - id: cpu-efficiency
    value: high
    numeric_value: 8
    category: performance
  - id: operational-complexity
    value: medium
    numeric_value: 5
    category: operational-complexity
  - id: java-cost-efficiency
    value: medium
    numeric_value: 5
    category: cost-efficiency
config_variants:
  - id: standard-jvm
    name: Standard JVM
    monthly_cost: 60
    max_rps: 20000
    base_latency_ms: 8
    metrics:
      - id: concurrent-connections
        value: high
        numeric_value: 8
        category: scalability
      - id: cpu-efficiency
        value: high
        numeric_value: 8
        category: performance
      - id: java-cost-efficiency
        value: medium
        numeric_value: 5
        category: cost-efficiency
    code_snippet:
      language: typescript
      code: |
        // Java + Spring Boot — REST controller (standard JVM)
        @RestController
        @RequestMapping("/users")
        class UserController {
          private final UserRepository repo;
          UserController(UserRepository repo) { this.repo = repo; }

          @GetMapping("/{id}")
          ResponseEntity<User> get(@PathVariable String id) {
            return repo.findById(id)
              .map(ResponseEntity::ok)
              .orElse(ResponseEntity.notFound().build());
          }
        }
    metric_explanations:
      concurrent-connections:
        reason: The JVM serves each request on a pooled OS thread across all cores, sustaining high concurrency for typical blocking workloads.
        contributing_factors:
          - Thread pool scales with cores; no GIL bottleneck
          - Mature connection pooling to databases and caches
          - Virtual threads (Loom) push concurrency higher still
      cpu-efficiency:
        reason: A warmed-up JIT compiles hot paths to optimized native code, giving high CPU throughput per core at steady state.
        contributing_factors:
          - JIT specializes hot methods after warm-up
          - Efficient GC keeps pauses small when tuned
          - Cold start pays a JIT/warm-up penalty
  - id: native-graalvm
    name: Native (GraalVM)
    monthly_cost: 45
    max_rps: 22000
    base_latency_ms: 6
    metrics:
      - id: request-latency
        value: low
        numeric_value: 2
        category: performance
      - id: operational-complexity
        value: medium
        numeric_value: 6
        category: operational-complexity
      - id: java-cost-efficiency
        value: medium
        numeric_value: 7
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |
        # Java + Spring Boot — GraalVM native image (fast start, low memory)
        ./mvnw -Pnative native:compile
        # produces a standalone binary — no JVM warm-up, ~10x less memory
        ./target/app
    metric_explanations:
      request-latency:
        reason: A GraalVM native image starts instantly and skips JIT warm-up, so first-request and tail latency are low and predictable.
        contributing_factors:
          - Ahead-of-time compilation — no warm-up ramp
          - Much lower memory means more replicas per node
          - Great fit for serverless/scale-to-zero deploys
      java-cost-efficiency:
        reason: Far lower memory and instant start let you pack more instances per node and scale to zero, improving cost per request.
        contributing_factors:
          - ~10x smaller memory footprint than the JVM
          - Faster start enables aggressive autoscaling
          - Build-time closed-world analysis limits some reflection
connection_properties:
  protocol: HTTP
  communication_patterns:
    - request-response
  typical_latency: 5-40ms
  co_location_potential: false
demand_responses:
  traffic-volume:
    high:
      request-latency: 0.8
    extreme:
      request-latency: 0.6
      cpu-efficiency: 0.7
  concurrent-users:
    high:
      concurrent-connections: 0.8
    extreme:
      concurrent-connections: 0.6
      request-latency: 0.7
  burst-pattern:
    periodic-spikes:
      request-latency: 0.8
    unpredictable:
      request-latency: 0.6
ports:
  - id: http-in
    type: http
    direction: in
  - id: http-out
    type: http
    direction: out
  - id: db-out
    type: database
    direction: out
  - id: cache-out
    type: cache
    direction: out
  - id: auth-in
    type: auth
    direction: in
  - id: monitor-out
    type: monitor
    direction: out
