id: aws-waf
name: AWS WAF
category: monitoring
type_id: security
vendor_url: https://aws.amazon.com/waf/
description: AWS web application firewall with managed rules and Bot Control
is: A web application firewall integrated with AWS services that inspects HTTP traffic using managed rule groups, custom rules, and Bot Control to protect applications from common web exploits and automated threats
gain:
  - Deep integration with ALB, CloudFront, and API Gateway
  - AWS Managed Rules cover OWASP Top 10 out of the box
  - Bot Control detects and mitigates automated threats
cost:
  - Per-rule and per-request pricing can grow quickly
  - Rule tuning across multiple web ACLs adds complexity
  - Bot Control is a premium add-on with separate billing
tags:
  - security
  - waf
  - aws
  - firewall
  - cloud
base_metrics:
  - id: alert-latency
    value: low
    numeric_value: 3
    category: performance
  - id: threat-detection
    value: high
    numeric_value: 8
    category: security
  - id: data-durability
    value: high
    numeric_value: 8
    category: reliability
  - id: operational-complexity
    value: low
    numeric_value: 3
    category: operational-complexity
  - id: waf-cost-efficiency
    value: high
    numeric_value: 7
    category: cost-efficiency
config_variants:
  - id: standard
    name: Standard
    monthly_cost: 20
    max_rps: 200000
    base_latency_ms: 2
    metrics:
      - id: threat-detection
        value: high
        numeric_value: 8
        category: security
      - id: alert-latency
        value: low
        numeric_value: 3
        category: performance
      - id: waf-cost-efficiency
        value: high
        numeric_value: 8
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # AWS WAF — Standard WAF rule check
        # List active rules
        aws wafv2 list-web-acls --scope REGIONAL --region us-east-1
        # Check blocked requests
        aws wafv2 get-sampled-requests --web-acl-arn $ACL_ARN --rule-metric-name AllRequests --scope REGIONAL --time-window '{"StartTime":"2024-01-01","EndTime":"2024-01-02"}' --max-items 10
    metric_explanations:
      threat-detection:
        reason: The Standard tier inspects HTTP traffic against AWS Managed Rule groups (Core Rule Set, Known Bad Inputs, SQLi) combined with rate-based statements, giving strong coverage of common web exploits without the Bot Control add-on.
        contributing_factors:
          - AWS Managed Rules auto-update as Amazon's threat research publishes new signatures
          - Rate-based rules track per-IP request counts in 5-minute windows to block volumetric floods
          - Regex and IP-set match statements let teams add targeted custom rules per web ACL
      alert-latency:
        reason: Web ACLs evaluate inline at the CloudFront or ALB edge, so rule matches surface in CloudWatch metrics and sampled-request logs within seconds of an offending request.
        contributing_factors:
          - Rule evaluation runs in the data path at the regional or edge PoP, not as an out-of-band batch
          - CloudWatch per-rule metrics emit at 1-minute granularity for fast blocked-request visibility
      waf-cost-efficiency:
        reason: At a modest WCU budget the Standard tier stays cheap because managed-rule and custom-rule capacity fits within the base web ACL allotment without the per-request Bot Control surcharge.
        contributing_factors:
          - Pricing is the web ACL fee plus per-rule and per-million-request charges, low at small rule counts
          - WCU limits keep rule complexity bounded, avoiding runaway inspection cost
  - id: advanced
    name: Advanced
    monthly_cost: 50
    max_rps: 300000
    base_latency_ms: 1
    metrics:
      - id: threat-detection
        value: high
        numeric_value: 9
        category: security
      - id: alert-latency
        value: low
        numeric_value: 2
        category: performance
      - id: waf-cost-efficiency
        value: medium
        numeric_value: 5
        category: cost-efficiency
    code_snippet:
      language: bash
      code: |-
        # AWS WAF — Advanced WAF rule check
        # List active rules
        aws wafv2 list-web-acls --scope REGIONAL --region us-east-1
        # Check blocked requests
        aws wafv2 get-sampled-requests --web-acl-arn $ACL_ARN --rule-metric-name AllRequests --scope REGIONAL --time-window '{"StartTime":"2024-01-01","EndTime":"2024-01-02"}' --max-items 10
    metric_explanations:
      threat-detection:
        reason: The Advanced tier layers AWS WAF Bot Control and Fraud Control on top of the managed rule groups, using machine-learning bot classification and account-takeover signals to catch automated and credential-abuse threats the Standard tier misses.
        contributing_factors:
          - Bot Control fingerprints clients and scores traffic to separate verified bots from malicious automation
          - Account Takeover Prevention inspects login attempts against compromised-credential intelligence
          - Targeted rate-based and CAPTCHA actions throttle scrapers and brute-force attempts
      alert-latency:
        reason: Inline inspection at the edge plus Bot Control telemetry streams labeled detections into CloudWatch and Kinesis Firehose logging in near real time, so analysts see classified threats almost immediately.
        contributing_factors:
          - Bot and fraud verdicts are attached to requests inline, not computed after the fact
          - Full-request logging via Kinesis Data Firehose enables sub-minute downstream alerting
      waf-cost-efficiency:
        reason: Bot Control and Fraud Control bill per-million inspected requests on top of the base web ACL fee, so the Advanced tier trades higher per-request cost for richer automated-threat coverage.
        contributing_factors:
          - Bot Control adds a per-million-request inspection charge beyond standard rule pricing
          - Fraud Control and CAPTCHA actions carry their own usage fees on inspected traffic
connection_properties:
  protocol: HTTPS
  communication_patterns:
    - request-response
  typical_latency: 2-25ms
  co_location_potential: false
ports:
  - id: http-in
    type: http
    direction: in
  - id: http-out
    type: http
    direction: out
  - id: monitor-out
    type: monitor
    direction: out
