id: chaos-day
title: Chaos Day
brief: >-
  The capstone. A high-traffic platform faces two rolling zone outages — compute
  drops early, then data-storage later. Requests dropped during each outage are
  unavoidable; your job is to over-provision every surviving tier so the system
  recovers instantly, holds latency between outages, and still comes in under
  budget with a clean topology. Three stars here means you have built for real.
difficulty: advanced
budget_cap: 1800
duration_seconds: 120
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 40, rps: 2500 }
  - { t: 80, rps: 3500 }
  - { t: 120, rps: 4000 }
traffic_sources:
  - { type: web-users, rps: 4000, kind: realistic, workload: mixed, origin: one-region }
required_components:
  - delivery-network
  - compute
  - caching
  - data-storage
  - messaging
  - monitoring
target_metrics:
  uptime_percent: 70
  p99_latency_ms: 220
  p95_latency_ms: 170
scheduled_events:
  - { t: 20, type: az_outage, target: compute, durationS: 15 }
  - { t: 70, type: az_outage, target: data-storage, durationS: 15 }
hints:
  - "The capstone: survive two az_outages (compute t=20-35, data-storage t=70-85) at 4000 RPS peak with p99 220ms within 1800 budget."
  - "Each outage takes a whole tier offline; you can't prevent dropped requests during windows, so over-provision every surviving tier for non-outage periods."
  - "When compute goes down, cache+data-storage absorb the load; when data-storage goes down, cache absorbs all reads. Size survivors to handle peak at ~90% load."
  - "Use messaging as async buffer for writes during outages so they don't pile up; observability monitors without adding load."
  - "CDN → load-balancer → 14 compute replicas → cache → relational-db + message-queue for async writes, observability as leaf. Cache needs ~2000 RPS capacity for compute-outage window; this design clears 70% uptime while staying under budget."
schema_version: 2
track: reliability
tier: 5
requires: [always-on]
unlocks: []
min_xp: 10520
required_types: [observability, load-balancer, cache]
available_blocks: [compute, relational-db, observability, load-balancer, cache, cdn, message-queue]
grants: []
rewards:
  xp: 1600
