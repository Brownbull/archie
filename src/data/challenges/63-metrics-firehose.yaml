id: metrics-firehose
title: Metrics Firehose
brief: >-
  Two thousand sensors report in every second, around the clock — temperature, throughput, error
  counts — and ops wants live dashboards over the last hour, day, and month. The relational
  database is drowning: append-only writes fragment its indexes, and every dashboard refresh
  runs a range scan across millions of timestamped rows. Writes and reads are strangling each
  other. The data has one shape — time — and it deserves a store that knows it.
difficulty: advanced
budget_cap: 1100
duration_seconds: 120
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 40, rps: 1500 }
  - { t: 80, rps: 2500 }
  - { t: 120, rps: 2000 }
traffic_sources:
  - { type: iot-sensors, rps: 2500, kind: realistic, workload: write, origin: one-region }
required_components:
  - compute
  - data-storage
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 250
hints:
  - "Append-heavy timestamped writes plus time-window reads is a SHAPE of data, not just a volume — general-purpose row storage fights both halves of it."
  - "A time-series database ingests ordered appends at firehose rates and answers range queries natively; the index fragmentation problem disappears because time IS the index."
  - "Wire traffic → compute → time-series-db and size the ingestion tier for the 2500 rps write peak; pick a time-series tier whose write ceiling clears it with headroom."
schema_version: 2
track: data
tier: 4
requires: [polyglot-persistence]
unlocks: [analytics-backbone]
min_xp: 5138
required_types: [time-series-db]
available_blocks: [traffic-source, compute, time-series-db, relational-db, cache]
grants: [time-series-db]
rewards:
  xp: 900
