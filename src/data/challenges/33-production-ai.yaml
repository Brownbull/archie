id: production-ai
title: Production AI
brief: >-
  Capstone: your production AI service has real users and an SLA to keep. An AZ outage hits the
  LLM gateway mid-run — your architecture must route around it and keep serving inference requests
  under latency.
difficulty: advanced
budget_cap: 4000
duration_seconds: 180
traffic_curve:
  - { t: 0, rps: 200 }
  - { t: 30, rps: 1000 }
  - { t: 60, rps: 2500 }
  - { t: 90, rps: 3500 }
  - { t: 120, rps: 3500 }
  - { t: 150, rps: 2000 }
  - { t: 180, rps: 500 }
traffic_sources:
  - { type: web-users, rps: 2000, kind: realistic, workload: read, origin: one-region }
  - { type: mobile-users, rps: 1500, kind: realistic, workload: read, origin: one-region }
required_components:
  - compute
  - monitoring
target_metrics:
  uptime_percent: 99
  p99_latency_ms: 400
  p95_latency_ms: 240
scheduled_events:
  - { t: 60, type: az_outage, target: compute, durationS: 50 }
hints:
  - "This is a multi-region failover capstone: when an AZ outage hits the LLM gateway mid-run, the CDN and cache must serve cached AI responses so the service stays up."
  - "Observability (monitoring, tracing) is essential to see the outage and route around it. The cache + CDN absorb read load during the compute AZ failure."
  - "At peak (3500 rps), replica compute instances and a load balancer distribute traffic. When the AZ fails at t=60s for 50s, the CDN serves cached responses and the cache backs up remaining requests until failover completes."
  - "Use traffic-source → cdn → load-balancer → compute → cache → llm-gateway. Add observability to track AZ health. Deploy 3+ compute instances across AZs with replicated cache."
  - "Deploy 3-4 compute instances across AZs behind LB. CDN caches ~70-80% (2450-2800 rps from edge), cache (4-6GB) backs requests. At t=60s AZ outage, unaffected AZs + cache + CDN keep p95≤240ms, p99≤400ms, 99% uptime."
schema_version: 2
track: aiml
tier: 4
requires: [rag-retrieval, zone-failure, always-on]
unlocks: []
min_xp: 5138
required_types: [llm-gateway, observability, cache]
available_blocks: [traffic-source, load-balancer, cdn, compute, llm-gateway, etl, vector-store, relational-db, cache, observability, message-queue]
grants: []
rewards:
  xp: 960
