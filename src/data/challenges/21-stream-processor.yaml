id: stream-processor
title: Process & Aggregate
brief: >-
  Window and aggregate events in flight. Sensors fire 2000 events a second, and downstream
  consumers need time-windowed summaries, not the raw firehose. A latency spike on compute tests
  your pipeline's resilience.
difficulty: advanced
budget_cap: 1500
duration_seconds: 120
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 800 }
  - { t: 60, rps: 2000 }
  - { t: 90, rps: 2000 }
  - { t: 120, rps: 800 }
traffic_sources:
  - { type: iot-sensors, rps: 2000, kind: realistic, workload: mixed, origin: one-region }
required_components:
  - compute
  - messaging
target_metrics:
  uptime_percent: 97.5
  p99_latency_ms: 300
  p95_latency_ms: 180
scheduled_events:
  - { t: 60, type: latency_spike, target: compute, multiplier: 4, durationS: 30 }
hints:
  - "The core problem is windowing and aggregating 2000 rps events in flight while surviving a 4x latency spike on compute — a stream processor handles time-windowed aggregations natively."
  - "Place a stream-processor consuming from event-stream, grouping events by time windows, outputting summaries while handling the 2000 rps peak without falling behind."
  - "Size the stream-processor to process 2000 events/sec with minimal lag; add cache to store latest aggregated results so downstream reads don't re-compute windows."
  - "Wire compute to event-stream; stream-processor reads continuously, emits windowed aggregates to cache/database so reads serve without re-computing the window."
  - "Size compute at 2 replicas for the 2000 rps writes into a single-broker event stream; one standalone stream-processor keeps up through the peak and the spike window, and the cache serves the processed view for p95 180ms reads."
chaos_intensity: 2
schema_version: 2
track: realtime
tier: 3
requires: [event-stream]
unlocks: [realtime-live]
min_xp: 1976
required_types: [stream-processor, event-stream]
available_blocks: [compute, event-stream, stream-processor, relational-db, cache, traffic-source]
grants: [stream-processor]
rewards:
  xp: 560
