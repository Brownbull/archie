id: cold-start-spike
title: Cold Start Spike
brief: >-
  A traffic burst hits your serverless function. On-demand instances have cold
  starts (200ms penalty on 10% of requests) that spike your p99 latency above
  the target. Switch to provisioned concurrency — it eliminates cold starts but
  costs more. Find the balance between cost and latency.
difficulty: intermediate
budget_cap: 400
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 100 }
  - { t: 20, rps: 100 }
  - { t: 30, rps: 3000 }
  - { t: 60, rps: 3000 }
  - { t: 75, rps: 500 }
  - { t: 90, rps: 500 }
traffic_sources:
  - { type: api-client, rps: 3000, kind: periodic, workload: mixed, origin: one-region }
required_components:
  - compute
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 100
  p95_latency_ms: 65
hints:
  - "The core problem is cold starts spiking p99 latency on 10% of requests under burst. The compute tier matters most — on-demand serverless has a 200ms penalty."
  - "Provisioned concurrency eliminates cold starts by keeping instances warm but costs more. Size it high enough to handle 3000 rps peak without falling back to on-demand."
  - "Size provisioned concurrency to absorb the 3000 rps burst at t=30-60s, keeping cold start penalty on less than 1% of requests, and scale back at t=75s to stay within 400 budget while hitting p99/p95 targets."
schema_version: 2
track: foundations
tier: 3
requires: [scale-out]
unlocks: []
min_xp: 1976
required_types: [serverless]
available_blocks: [traffic-source, compute, serverless, load-balancer]
grants: []
rewards:
  xp: 455
