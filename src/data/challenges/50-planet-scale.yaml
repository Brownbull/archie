id: planet-scale
title: Planet Scale
brief: >-
  Nearly two million requests a second, from a planet of users. Four audiences,
  one of them global, a chaos-rattled backbone, and no excuses. This is the
  architect's final exam — a multi-region edge pushed to the very limit of what
  a single architecture can carry, built to simply not fall over.
difficulty: advanced
budget_cap: 200000
duration_seconds: 120
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 60, rps: 540000 }
  - { t: 120, rps: 900000 }
traffic_sources:
  - { type: web-users, rps: 360000, kind: realistic, workload: read, origin: multi-region }
  - { type: mobile-users, rps: 270000, kind: realistic, workload: read, origin: one-region }
  - { type: api-client, rps: 180000, kind: realistic, workload: mixed, origin: one-region }
  - { type: iot-sensors, rps: 90000, kind: steady, workload: write, origin: one-region }
required_components:
  - delivery-network
  - compute
  - caching
  - data-storage
target_metrics:
  uptime_percent: 96
  # ED1/EN1 (D74): end-to-end latency is now the SUM along the served path (+ per-edge RTT), not the
  # worst hop. At planet scale the only build that meets 96% uptime is the over-provisioned global one,
  # whose long multi-hop path measures ~890ms p99 — capacity is the lesson here, not tight latency.
  p99_latency_ms: 1030
chaos_intensity: 2
hints:
  - "1.8M rps cannot all reach origin — the edge has to serve almost everything."
  - "A multi-region source forces CDN + DNS + a database; stack a cache behind the CDN so origin sees a trickle."
  - "Scale every tier hard: CDN and cache replicas to absorb the reads, compute + DB sized for the cache-miss remainder."
  - "Place traffic → dns → cdn → cache → load-balancer → compute → relational-db, every tier replicated to clear 1.8M rps; the stacked edge holds p99 ≤ 400ms and ≥96% uptime through the chaos."
schema_version: 2
track: foundations
tier: 6
requires: [foundations-mastery, edge-delivery, polyglot-persistence]
unlocks: []
min_xp: 0
required_types: [cdn, dns, cache]
available_blocks: [compute, serverless, cdn, dns, load-balancer, cache, relational-db, nosql, object-storage, traffic-source]
grants: []
rewards:
  xp: 1500
