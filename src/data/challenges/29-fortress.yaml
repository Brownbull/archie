id: fortress
title: Production Lockdown
brief: >-
  Capstone: detect and mitigate a credential-stuffing campaign against a full
  production stack. Two attack outages hit during the run — rate limiting, SIEM
  alerting, caching, and observability must work together to keep the service
  alive under fire.
difficulty: advanced
budget_cap: 3000
duration_seconds: 180
traffic_curve:
  - { t: 0, rps: 500 }
  - { t: 30, rps: 1500 }
  - { t: 60, rps: 3000 }
  - { t: 90, rps: 4000 }
  - { t: 120, rps: 3000 }
  - { t: 150, rps: 1500 }
  - { t: 180, rps: 500 }
traffic_sources:
  - { type: web-users, rps: 2500, kind: periodic, workload: mixed, origin: one-region }
  - { type: api-client, rps: 1500, kind: periodic, workload: mixed, origin: one-region }
required_components:
  - compute
  - auth-security
  - monitoring
target_metrics:
  uptime_percent: 99
  p99_latency_ms: 300
  p95_latency_ms: 220
scheduled_events:
  - { t: 45, type: latency_spike, target: auth-security, multiplier: 8, durationS: 30 }
  - { t: 105, type: az_outage, target: compute, durationS: 40 }
hints:
  - "Core problem: 4000 rps peak + 45s auth latency spike + 105s AZ outage. Rate limit cuts flood, cache/CDN bypass compute during crises, SIEM/observability track it all."
  - "Use CDN + cache on read path so they serve traffic during outages. Rate limit to ~2500 rps. During 45s auth spike, cached reads stay fast. During 105s AZ loss, CDN/cache hold the line while compute recovers."
  - "Full path: traffic → CDN → cache → rate-limiter (2500-3000 rps) → auth (2+ AZs) → compute (2-3 per AZ) → DB. Wire auth to security/observability async. During 45s spike, cache serves hits. During 105s outage, CDN/cache serve all traffic. p99 <300ms."
  - "Full solve: traffic → CDN → cache → rate-limiter → auth → compute; SIEM + observability async off auth. The CDN/cache variants' built-in hit ratios carry reads through the 105s outage — pick the caching tiers, there are no TTL knobs to tune. Measured: ~99.6% uptime, roughly $270 of $3000."
chaos_intensity: 2.5
schema_version: 2
track: security
tier: 5
requires: [siem-audit, always-on]
unlocks: []
min_xp: 10520
required_types: [auth, rate-limiter, security, observability]
available_blocks: [compute, auth, rate-limiter, security, cdn, observability, cache, relational-db, traffic-source]
grants: []
rewards:
  xp: 1600
