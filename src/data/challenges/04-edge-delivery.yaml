id: edge-delivery
title: Edge Delivery
brief: >-
  The launch landed. Traffic is climbing toward 800 requests a second, and every request knocks on
  the same front door. Connections pile up at the entrance before your servers even get a vote.
  The latency bar is unforgiving — p99 under 200 ms, p95 under 140 — and at 98% uptime, any tier
  that saturates on the path takes you down with it. Clear the entrance, and keep everything
  behind it under capacity.
difficulty: intermediate
budget_cap: 350
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 45, rps: 500 }
  - { t: 90, rps: 800 }
traffic_sources:
  - { type: web-users, rps: 800, kind: realistic, workload: read, origin: one-region }
required_components:
  - delivery-network
  - compute
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 200
  p95_latency_ms: 140
hints:
  - "At 800 RPS the core problem is entry-point bottleneck — you must place a CDN or edge tier as the first layer to absorb requests."
  - "CDN or load-balancer sits at the entry; compute tier sits downstream and still sees all served load, so it must have capacity for the full peak."
  - "Traffic enters the CDN/edge tier, flows through to compute; size compute (or its replicas) so it stays under 100% at 800 RPS peak."
  - "Place traffic → CDN → load-balancer → compute; the compute tier receives all 800 RPS so size it with enough capacity or replicas to stay under saturation and hit the tight 200 ms p99 target."
schema_version: 2
track: edge
tier: 3
requires: [edge-balance]
unlocks: [api-gateway, zone-failure]
min_xp: 1976
required_types: [cdn, load-balancer]
available_blocks: [compute, traffic-source, dns, load-balancer, cdn]
grants: [cdn]
rewards:
  xp: 455
