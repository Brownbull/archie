id: edge-delivery
title: Edge Delivery
brief: >-
  Traffic is climbing. Your design must front the compute tier with a
  delivery/network (CDN/edge) tier as its entry point. Hold a tight latency
  target at higher volume by keeping every tier on the path under capacity.
difficulty: intermediate
budget_cap: 350
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 45, rps: 500 }
  - { t: 90, rps: 800 }
required_components:
  - delivery-network
  - compute
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 200
hints:
  - The delivery/network tier is your entry point — route edge → compute so traffic enters there.
  - Whatever a node serves flows on to what it points at, so the compute tier still sees the served load — give it (or its replicas) enough capacity to stay under 100% at peak.
schema_version: 2
track: edge
tier: 3
requires: [edge-balance]
unlocks: [api-gateway, zone-failure]
available_blocks: [compute, traffic-source, dns, load-balancer, cdn]
grants: [cdn]
rewards:
  xp: 175
