id: first-service
title: First Service
brief: >-
  Stand up a single compute service for a low-traffic internal tool. Keep it
  cheap and keep it up. This is the smallest possible architecture — one node
  that answers requests.
difficulty: beginner
budget_cap: 80
duration_seconds: 60
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 80 }
  - { t: 60, rps: 120 }
traffic_sources:
  - { type: web-users, rps: 120, kind: realistic, workload: mixed, origin: one-region }
required_components:
  - compute
target_metrics:
  uptime_percent: 95
  p99_latency_ms: 400
  p95_latency_ms: 250
hints:
  - "This is a single-node service problem: pick one compute variant that handles 120 RPS without overload, minimizing cost."
  - "Compute variants trade cost vs capacity; the cheapest one that stays under 100% utilization at 120 RPS will meet your latency targets."
schema_version: 2
track: foundations
tier: 1
requires: []
unlocks: [scale-out, add-a-database, async-pipeline, dns-routing, observe-baseline, auth-101, llm-service]
available_blocks: [traffic-source, compute]
grants: []
rewards:
  xp: 100
