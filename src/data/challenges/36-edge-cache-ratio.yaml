id: edge-cache-ratio
title: Edge Cache Ratio
brief: >-
  Serve 10,000 rps globally. A CDN absorbs most static requests from the edge
  (~85% hit ratio) but misses pay an 80ms origin round-trip. Your origin compute
  only handles 2000 rps — without the CDN absorbing the majority, it overloads.
  The CDN is not just a load balancer — it's a cache.
difficulty: intermediate
budget_cap: 300
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 2000 }
  - { t: 30, rps: 6000 }
  - { t: 60, rps: 10000 }
  - { t: 90, rps: 10000 }
traffic_sources:
  - { type: web-users, rps: 10000, kind: realistic, workload: read, origin: one-region }
required_components:
  - delivery-network
  - compute
target_metrics:
  uptime_percent: 97
  p99_latency_ms: 200
  p95_latency_ms: 130
hints:
  - "Your origin compute handles 2000 rps but traffic sends 10,000 rps. A CDN absorbs the majority of requests at the edge, functioning as a distributed cache."
  - "Deploy a CDN with an 85% hit ratio: it serves 8500 rps from edge locations (10-20ms latency) and only 1500 rps reaches your origin."
  - "At peak (10,000 rps, t=60-90), the CDN must cache static and semi-static content aggressively (cache-control headers, long TTLs). Miss traffic (1500 rps) hits the origin load balancer."
  - "Use traffic-source → cdn → load-balancer → compute. CDN caches with TTL tuned for your workload; origin sees ~1500 rps (15% misses)."
  - "Deploy 1-2 compute instances behind the LB, CDN in front. The static-caching tier's 90% hit ratio serves 9000 rps from the edge — only the ~1000 rps of misses reach your origin. That ratio is the whole challenge: 97% uptime, p99≤200ms, p95≤130ms follow from it."
schema_version: 2
track: edge
tier: 3
requires: [edge-balance, edge-delivery]
unlocks: []
min_xp: 1976
required_types: [cdn, load-balancer]
available_blocks: [traffic-source, compute, load-balancer, cdn, dns]
grants: []
rewards:
  xp: 455
