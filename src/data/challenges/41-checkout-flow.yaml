id: checkout-flow
title: Checkout Flow
brief: >-
  Checkout is where the store actually makes money, and tonight it's getting slammed — traffic
  climbing tenfold into the peak. The catch: the payment processor takes its sweet time on every
  transaction, each order is unique — nothing can be served twice — and every one has to be
  remembered. Shoppers ditch carts the moment the spinner lingers; the rest of the flow has to win
  back the time the processor burns. Lose the latency bar, lose the sale.
difficulty: intermediate
budget_cap: 600
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 200 }
  - { t: 30, rps: 1000 }
  - { t: 60, rps: 2000 }
  - { t: 90, rps: 1000 }
traffic_sources:
  - { type: web-users, rps: 2000, kind: realistic, workload: write, origin: one-region }
required_components:
  - compute
  - data-storage
target_metrics:
  uptime_percent: 97
  p99_latency_ms: 400
  p95_latency_ms: 280
hints:
  - "The core problem is a checkout pipeline with payment latency peaking at 2000 rps. Payments and database are the required tiers — keep the chain efficient to hit p99 under 400ms."
  - "A load balancer distributes traffic to compute replicas. Compute processes carts quickly, routes to payment gateway, database persists orders. Avoid cache (forbidden) — this is a write-heavy flow."
  - "Build: traffic-source → load-balancer → compute (4 replicas) → payments → relational-db. At 2000 rps peak, compute processes carts quickly, payments adds latency per transaction, DB batches writes. Stay under p99 400ms and p95 280ms within 600 budget and avoid cache."
forbidden_types: [cache]
schema_version: 2
track: foundations
tier: 4
requires: [serverless-burst, add-a-database]
unlocks: []
min_xp: 5138
required_types: [payments, relational-db]
available_blocks: [traffic-source, compute, load-balancer, payments, relational-db]
grants: [payments]
rewards:
  xp: 780
