id: siem-audit
title: Audit Trail
brief: >-
  Someone quietly tested stolen passwords against your login page for three weeks. Nobody noticed
  — the auditors did, and they're back in ninety days. This time every sign-in gets watched for
  odd patterns and every auth event lands in a record nobody can lose. The catch: 1000 rps of real
  users are on the site the whole time, and surveillance that slows them down fails the audit too.
difficulty: intermediate
budget_cap: 800
duration_seconds: 120
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 400 }
  - { t: 60, rps: 1000 }
  - { t: 90, rps: 1000 }
  - { t: 120, rps: 400 }
traffic_sources:
  - { type: web-users, rps: 1000, kind: realistic, workload: mixed, origin: one-region }
required_components:
  - compute
  - auth-security
  - monitoring
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 250
  p95_latency_ms: 180
hints:
  - "Core problem: rate limiting blocks the flood but doesn't reveal the attack pattern. SIEM detects anomalies; observability logs the audit trail."
  - "Add security (SIEM) to flag repeated failed auths or credential patterns. Wire observability async to log every auth event. Both run parallel to auth, not blocking."
  - "Wire rate-limiter → auth → compute, then tee auth events to security and observability asynchronously. SIEM watches for attack signatures; observability persists forensic logs. Async keeps p99 under 250ms at 1000 rps."
schema_version: 2
track: security
tier: 3
requires: [rate-limit, observe-baseline]
unlocks: [fortress, defense-in-depth]
min_xp: 1976
required_types: [auth, rate-limiter, security]
available_blocks: [compute, auth, rate-limiter, security, observability, traffic-source]
grants: [security]
rewards:
  xp: 455
