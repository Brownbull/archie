id: siem-audit
title: Audit Trail
brief: >-
  Wire a SIEM to watch login patterns. The security tier flags anomalies in
  real time while the observability stack records the full audit trail. Keep
  the added monitoring from tanking your p99 under normal traffic.
difficulty: intermediate
budget_cap: 800
duration_seconds: 120
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 400 }
  - { t: 60, rps: 1000 }
  - { t: 90, rps: 1000 }
  - { t: 120, rps: 400 }
traffic_sources:
  - { type: web-users, rps: 1000, kind: realistic, workload: mixed, origin: one-region }
required_components:
  - compute
  - auth-security
  - monitoring
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 250
  p95_latency_ms: 180
hints:
  - Security (SIEM) and observability serve different roles — both are needed here.
  - The audit trail doesn't slow the request path if it's async.
schema_version: 2
track: security
tier: 3
requires: [rate-limit]
unlocks: [fortress, defense-in-depth]
min_xp: 1976
required_types: [auth, rate-limiter, security]
available_blocks: [compute, auth, rate-limiter, security, observability, traffic-source]
grants: [security]
rewards:
  xp: 455
