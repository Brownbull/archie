id: foundations-mastery
title: Foundations Mastery
brief: >-
  Capstone: compose compute, scale, cache, and async into a single architecture
  that handles a sustained mixed workload — reads from cache, writes through a
  queue, burst overflow to serverless — all under budget and under latency.
difficulty: advanced
budget_cap: 2000
duration_seconds: 180
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 1000 }
  - { t: 60, rps: 2500 }
  - { t: 90, rps: 4000 }
  - { t: 120, rps: 4000 }
  - { t: 150, rps: 2000 }
  - { t: 180, rps: 1000 }
traffic_sources:
  - { type: web-users, rps: 4000, kind: realistic, workload: mixed, origin: one-region }
required_components:
  - compute
  - caching
  - messaging
target_metrics:
  uptime_percent: 99
  p99_latency_ms: 200
  p95_latency_ms: 160
hints:
  - "Separate the read path (cache) and write path (queue) to handle 4000 RPS peaks without overloading compute — the message queue prevents writes from blocking cache hits."
  - "Cache absorbs reads for p99/p95 latency; queue writes durably while compute drains them; when peaks exceed steady-state capacity, serverless burst instances handle the overflow."
  - "Avoid relational-db entirely; use load-balancer to shard reads across cache replicas, message-queue to buffer writes, and serverless workers to process queued jobs asynchronously without blocking the hot path."
  - "traffic-source → load-balancer → compute (replicas per RPS tier); cache in front of reads, message-queue behind writes; serverless workers scale by queue depth; size compute and cache to keep p99 under 200ms at 4000 RPS, serverless to clear queued writes within 60s."
forbidden_types: [relational-db]
schema_version: 2
track: foundations
tier: 5
requires: [worker-fleet, cache-the-hot-path]
unlocks: []
min_xp: 10520
required_types: [load-balancer, cache, message-queue]
available_blocks: [traffic-source, compute, load-balancer, serverless, worker, message-queue, cache]
grants: []
rewards:
  xp: 1600
