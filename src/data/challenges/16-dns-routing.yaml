id: dns-routing
title: DNS Routing
brief: >-
  You shipped your first service; now you've bought it a proper domain. One problem: typing the
  name gets a blank stare. The internet trades in addresses, not names, and nothing yet translates
  yours. Every single request begins with that lookup — if it's slow or down, nothing else
  matters. Point the name at your machine and keep 500 requests a second flowing.
difficulty: beginner
budget_cap: 100
duration_seconds: 60
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 300 }
  - { t: 60, rps: 500 }
traffic_sources:
  - { type: web-users, rps: 500, kind: realistic, workload: mixed, origin: one-region }
required_components:
  - compute
target_metrics:
  uptime_percent: 97
  p99_latency_ms: 350
  p95_latency_ms: 260
hints:
  - "DNS is the entry point — every request resolves to your compute endpoint; if DNS is slow or unavailable, nothing else matters."
  - "Route dns to a single compute instance at 500 RPS peak; dns forwards all traffic to compute; p99 and p95 are generous because this is a beginner challenge with minimal load."
  - "traffic-source → dns → compute; dns resolves to the compute IP; a single compute instance handles 500 RPS; no replicas needed for 97% uptime as long as instance and DNS are up."
schema_version: 2
track: edge
tier: 1
requires: [first-service]
unlocks: [edge-balance]
required_types: [dns]
available_blocks: [compute, traffic-source, dns]
grants: [dns]
rewards:
  xp: 100
