id: zone-failure
title: Zone Failure
brief: >-
  An availability-zone outage takes your entire compute tier offline for 20
  seconds mid-run. You can't prevent the requests dropped during the outage —
  the goal is to keep overall uptime above the bar, hold latency steady before
  and after, and keep a clean, well-provisioned topology around the failure.
difficulty: advanced
budget_cap: 850
duration_seconds: 100
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 50, rps: 1000 }
  - { t: 100, rps: 1600 }
traffic_sources:
  - { type: web-users, rps: 1600, kind: realistic, workload: mixed, origin: one-region }
required_components:
  - delivery-network
  - compute
  - data-storage
target_metrics:
  uptime_percent: 78
  p99_latency_ms: 250
scheduled_events:
  - { t: 25, type: az_outage, target: compute, durationS: 20 }
hints:
  - The outage hits early while traffic is still low — that's the cheapest window to lose, but you can't prevent the drop.
  - An az_outage takes every node of the targeted category down; adding more compute replicas won't dodge it (they're all the same category).
  - Keep compute under 100% load outside the outage so p99 stays inside the target — that's where the pass is won.
schema_version: 2
track: reliability
tier: 3
requires: [zone-replica, edge-delivery]
unlocks: [always-on]
min_xp: 1976
required_types: [observability, load-balancer]
available_blocks: [compute, relational-db, observability, load-balancer, cache]
grants: []
rewards:
  xp: 560
