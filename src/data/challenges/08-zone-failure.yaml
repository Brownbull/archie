id: zone-failure
title: Zone Failure
brief: >-
  An availability-zone outage takes your entire compute tier offline for 20
  seconds mid-run. You can't prevent the requests dropped during the outage —
  the goal is to keep overall uptime above the bar, hold latency steady before
  and after, and keep a clean, well-provisioned topology around the failure.
difficulty: advanced
budget_cap: 850
duration_seconds: 100
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 50, rps: 1000 }
  - { t: 100, rps: 1600 }
traffic_sources:
  - { type: web-users, rps: 1600, kind: realistic, workload: mixed, origin: one-region }
required_components:
  - delivery-network
  - compute
  - data-storage
target_metrics:
  uptime_percent: 78
  p99_latency_ms: 250
scheduled_events:
  - { t: 25, type: az_outage, target: compute, durationS: 20 }
hints:
  - "The core problem is surviving a 20-second compute zone outage while holding p99 latency; the requests lost during the outage are unavoidable at 78% uptime."
  - "An az_outage takes every compute node offline simultaneously — adding more replicas won't dodge it, so over-provision the non-outage windows for instant recovery."
  - "Keep all compute nodes under 80% load before t=25 and after t=45 so when the outage hits, recovery happens instantly without latency spikes."
  - "Use a load-balancer to distribute traffic across compute replicas and add observability to track recovery; 1600 RPS peak requires roughly 5-6 compute replicas."
  - "Load-balancer → 6 compute replicas → relational-db + cache. Keep nodes under 80% load outside the outage (t=0-25 and t=45-100) to hold p99 250ms during normal operation."
schema_version: 2
track: reliability
tier: 3
requires: [zone-replica, edge-delivery, cache-the-hot-path, add-a-database]
unlocks: [always-on]
min_xp: 1976
required_types: [observability, load-balancer]
available_blocks: [compute, relational-db, observability, load-balancer, cache]
grants: []
rewards:
  xp: 560
