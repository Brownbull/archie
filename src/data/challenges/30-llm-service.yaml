id: llm-service
title: LLM Service
brief: >-
  Wire compute to an LLM gateway and serve inference requests. The gateway
  handles model routing; you keep latency low by caching repeated queries
  and the DB persists conversation state.
difficulty: intermediate
budget_cap: 800
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 200 }
  - { t: 60, rps: 600 }
  - { t: 90, rps: 600 }
traffic_sources:
  - { type: api-client, rps: 600, kind: realistic, workload: read, origin: one-region }
required_components:
  - compute
target_metrics:
  uptime_percent: 97
  p99_latency_ms: 500
  p95_latency_ms: 350
hints:
  - "Core problem: LLM inference is expensive. Gateway routes models; caching dedupes prompts; database holds conversation history."
  - "Place llm-gateway to route inference, cache to catch repeated prompts, and relational-db to persist conversation state. As traffic ramps 200→600 rps, cache hits on repeated queries keep p99 reasonable."
  - "Wire traffic → compute → llm-gateway, with cache in front of gateway (TTL 1-2 min). Relational-db stores conversation history. Cache dedupes identical prompts; expect 30-50% hit rate on realistic read workload."
  - "Topology: traffic → compute → llm-gateway ← cache (1-2min TTL) ← relational-db. 2 compute replicas at 600 rps. Cache dedupes ~40%, cutting gateway load to ~360 rps. LLM latency 200-400ms + compute 50-100ms + cache <5ms = p99 <500ms. DB persists conversation context."
schema_version: 2
track: aiml
tier: 1
requires: [first-service]
unlocks: [data-pipeline]
required_types: [llm-gateway]
available_blocks: [traffic-source, compute, llm-gateway, cache, relational-db]
grants: [llm-gateway]
rewards:
  xp: 130
