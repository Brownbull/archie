id: llm-service
title: LLM Service
brief: >-
  Your AI assistant just went live, and suddenly every request waits on the slowest, priciest
  thing you've ever put behind an API: the model itself. Clients hit you at 600 req/s expecting
  answers in half a second, and inference alone eats most of that. Two mercies: plenty of prompts
  are near-identical repeats, and every conversation needs its history remembered between turns.
  Hold 97% uptime and p99 under 500ms — without making the model think twice about the same
  question.
difficulty: intermediate
budget_cap: 800
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 200 }
  - { t: 60, rps: 600 }
  - { t: 90, rps: 600 }
traffic_sources:
  - { type: api-client, rps: 600, kind: realistic, workload: read, origin: one-region }
required_components:
  - compute
target_metrics:
  uptime_percent: 97
  p99_latency_ms: 500
  p95_latency_ms: 350
hints:
  - "Core problem: LLM inference is slow and expensive, and every request rides through it. The gateway routes model calls; the database holds conversation history."
  - "Place llm-gateway to route inference and relational-db to persist conversation state. As traffic ramps 200→600 rps, the gateway tier — not compute — is where latency piles up."
  - "Wire traffic → compute → llm-gateway, with relational-db hanging off compute for conversation history. The gateway holds each request for the full generation, so its capacity is what the ramp stresses."
  - "Topology: traffic → compute → llm-gateway, plus compute → relational-db for history. Size compute for 600 rps ingestion and give the gateway enough replicas that inference latency holds p99 — one instance will not carry the peak."
schema_version: 2
track: aiml
tier: 1
requires: [first-service, add-a-database]
unlocks: [data-pipeline]
required_types: [llm-gateway]
available_blocks: [traffic-source, compute, llm-gateway, relational-db]
grants: [llm-gateway]
rewards:
  xp: 130
