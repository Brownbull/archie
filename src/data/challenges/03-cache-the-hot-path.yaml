id: cache-the-hot-path
title: Cache the Hot Path
brief: >-
  Same handful of pages, requested thousands of times a minute — and your database dutifully
  recomputes every answer from scratch. p99 is creeping up, users are noticing, and the data store
  is sweating over reads that haven't changed since the last request. Making the database repeat
  itself is the real waste here. Find a way to stop answering the same question twice, hold the
  tighter latency bar at peak, and do it without blowing the budget.
difficulty: beginner
budget_cap: 220
duration_seconds: 75
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 35, rps: 180 }
  - { t: 75, rps: 280 }
traffic_sources:
  - { type: web-users, rps: 280, kind: realistic, workload: read, origin: one-region }
required_components:
  - compute
  - caching
  - data-storage
target_metrics:
  uptime_percent: 97
  p99_latency_ms: 250
  p95_latency_ms: 160
hints:
  - "The read-heavy workload at 280 RPS makes latency tight — the core problem is avoiding database saturation on repeated reads."
  - "Insert a cache tier between compute and database; read hits bypass the database, and cache misses flow downstream."
  - "Size the cache and database so that at peak (280 RPS), the cache absorbs most read traffic and the database stays under 100% capacity."
  - "Place traffic → compute → cache → database, with the cache absorbing the read footprint and the database sized for the cache-miss reads (the workload is pure reads — no writes to plan for). Both stay under 100% at 280 RPS; a lean build runs about $80 of the $220 budget."
schema_version: 2
track: data
tier: 2
requires: [add-a-database]
unlocks: [polyglot-persistence, rag-retrieval, foundations-mastery, cache-or-crash]
min_xp: 494
required_types: [relational-db, cache]
available_blocks: [compute, relational-db, cache, traffic-source]
grants: [cache]
rewards:
  xp: 200

# Plan-2 P2 (D97): Startup Stack chain, stage 3 (data branch) — your database-backed build,
# grown again: the hot reads move in front of the store.
chain:
  id: startup-stack
  stage: 3
  continues_from: add-a-database
