id: cache-the-hot-path
title: Cache the Hot Path
brief: >-
  Reads are hammering your database and p99 latency is creeping up. Add a
  caching tier in front of the data store so repeat reads are served fast.
  Hit the tighter latency target without blowing the budget.
difficulty: beginner
budget_cap: 220
duration_seconds: 75
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 35, rps: 180 }
  - { t: 75, rps: 280 }
traffic_sources:
  - { type: web-users, rps: 280, kind: realistic, workload: read, origin: one-region }
required_components:
  - compute
  - caching
  - data-storage
target_metrics:
  uptime_percent: 97
  p99_latency_ms: 250
  p95_latency_ms: 160
hints:
  - "The read-heavy workload at 280 RPS makes latency tight — the core problem is avoiding database saturation on repeated reads."
  - "Insert a cache tier between compute and database; read hits bypass the database, and cache misses flow downstream."
  - "Size the cache and database so that at peak (280 RPS), the cache absorbs most read traffic and the database stays under 100% capacity."
  - "Place traffic → compute → cache → database, with cache sized large enough to handle the read footprint and database sized to handle writes plus uncached reads; both must stay under 100% at 280 RPS."
schema_version: 2
track: data
tier: 2
requires: [add-a-database]
unlocks: [polyglot-persistence, rag-retrieval, foundations-mastery, cache-or-crash]
min_xp: 494
required_types: [relational-db, cache]
available_blocks: [compute, relational-db, cache, object-storage, traffic-source]
grants: [cache, object-storage]
rewards:
  xp: 200
