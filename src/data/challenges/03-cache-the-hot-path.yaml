id: cache-the-hot-path
title: Cache the Hot Path
brief: >-
  Reads are hammering your database and p99 latency is creeping up. Add a
  caching tier in front of the data store so repeat reads are served fast.
  Hit the tighter latency target without blowing the budget.
difficulty: beginner
budget_cap: 220
duration_seconds: 75
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 35, rps: 180 }
  - { t: 75, rps: 280 }
required_components:
  - compute
  - caching
  - data-storage
target_metrics:
  uptime_percent: 97
  p99_latency_ms: 250
hints:
  - A cache absorbs read traffic so the database isn't the latency bottleneck.
  - Place caching between compute and data-storage on the read path.
