id: defense-in-depth
title: Defense in Depth
brief: >-
  Layer auth, rate limiting, and security monitoring into a production API.
  A credential-stuffing attack spikes traffic mid-run — the rate limiter must
  absorb the abuse while auth validates legitimate requests. Observability tracks
  the attack pattern in real time.
difficulty: advanced
budget_cap: 1200
duration_seconds: 120
traffic_curve:
  - { t: 0, rps: 500 }
  - { t: 30, rps: 1000 }
  - { t: 45, rps: 4000 }
  - { t: 75, rps: 4000 }
  - { t: 90, rps: 1000 }
  - { t: 120, rps: 500 }
traffic_sources:
  - { type: api-client, rps: 4000, kind: periodic, workload: read, origin: one-region }
required_components:
  - compute
  - auth-security
  - monitoring
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 300
  p95_latency_ms: 200
scheduled_events:
  - { t: 45, type: latency_spike, target: auth-security, multiplier: 1.25, durationS: 30 }
hints:
  - "The core problem is credential-stuffing attack spiking to 4000 rps at t=45s during a 1.5x auth latency spike. Rate limiting and auth are the required tiers."
  - "Place rate limiter before auth to shed attack traffic. Observability monitors the chain. The rate limiter caps abuse before it reaches auth/compute. Avoid cache (forbidden)."
  - "Build: traffic-source → rate-limiter (1200 rps cap) → auth → compute → observability. At t=45s, rate limiter sheds the 3000+ rps attack while legitimate 1000 rps flows through. Observability tracks attack pattern, keeping p99 under 300ms and p95 under 200ms within 1200 budget."
forbidden_types: [cache]
chaos_intensity: 2
schema_version: 2
track: security
tier: 4
requires: [siem-audit, observe-baseline]
unlocks: [fortress]
min_xp: 5138
required_types: [auth, rate-limiter, security, observability]
available_blocks: [traffic-source, compute, auth, rate-limiter, security, observability, load-balancer]
grants: []
rewards:
  xp: 960
