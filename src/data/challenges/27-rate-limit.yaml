id: rate-limit
title: Quota Keeper
brief: >-
  Place a rate limiter on the auth tier. A flood of junk-auth requests arrives
  mid-challenge — the limiter should absorb the abuse while legitimate traffic
  stays within its p99 budget.
difficulty: intermediate
budget_cap: 400
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 100 }
  - { t: 30, rps: 500 }
  - { t: 45, rps: 2000 }
  - { t: 60, rps: 2000 }
  - { t: 75, rps: 500 }
  - { t: 90, rps: 200 }
traffic_sources:
  - { type: web-users, rps: 1000, kind: periodic, workload: mixed, origin: one-region }
  - { type: api-client, rps: 1000, kind: periodic, workload: mixed, origin: one-region }
required_components:
  - compute
  - auth-security
target_metrics:
  uptime_percent: 97
  p99_latency_ms: 300
  p95_latency_ms: 220
hints:
  - "Core problem: junk-auth requests flood at 45s (2000 rps spike). Rate limiter is the first defense, shedding abuse before auth chokes."
  - "Place rate-limiter right after traffic-source and before auth. Set threshold ~1000 rps (sum of legitimate sources) to reject excess during the 45-60s spike."
  - "Wire traffic → rate-limiter (1000 rps threshold) → auth → compute. Fast-fail rejected requests so they don't queue. Auth/compute see ~1000 rps max, keeping p99 under 300ms. The limiter absorbs the 2000 rps spike entirely."
schema_version: 2
track: security
tier: 2
requires: [auth-101]
unlocks: [siem-audit]
min_xp: 494
required_types: [auth, rate-limiter]
available_blocks: [compute, auth, rate-limiter, traffic-source]
grants: [rate-limiter]
rewards:
  xp: 260
