id: observe-to-recover
title: Observe to Recover
brief: >-
  Your compute node will suffer a 30-second outage mid-run. With observability
  connected, the failure recovers 33% faster (~20s instead of 30s). Without
  monitoring, you lose too much uptime to pass. Monitoring is not decorative —
  it actively shortens your downtime.
difficulty: intermediate
budget_cap: 200
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 500 }
  - { t: 90, rps: 500 }
traffic_sources:
  - { type: web-users, rps: 500, kind: steady, workload: mixed, origin: one-region }
required_components:
  - compute
  - monitoring
target_metrics:
  uptime_percent: 80
  p99_latency_ms: 400
  p95_latency_ms: 280
scheduled_events:
  - { t: 30, type: component_failure, target: compute, durationS: 30 }
hints:
  - "The core problem is a 30-second compute failure at t=30s. Observability actively speeds recovery from 30s to 20s. Without it you fail the 80% uptime target."
  - "Wire observability to compute. The failure recovers 10 seconds faster with monitoring (20s vs 30s), saving downtime and keeping you at the 80% uptime threshold."
  - "Place compute with observability connected. At t=30s the 30s failure is detected and recovered in 20s instead, leaving you at exactly 80% uptime (72s up / 90s), meeting the target and staying under 200 budget."
schema_version: 2
track: reliability
tier: 2
requires: [observe-baseline]
unlocks: []
min_xp: 494
required_types: [observability]
available_blocks: [traffic-source, compute, observability, load-balancer]
grants: []
rewards:
  xp: 260
