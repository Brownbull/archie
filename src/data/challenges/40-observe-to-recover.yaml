id: observe-to-recover
title: Observe to Recover
brief: >-
  A zone fails mid-run, knocking out part of your compute tier. The danger isn't
  just the lost zone — it's the thundering-herd: timed-out requests retry against
  the surviving zones and pile on, dragging healthy capacity down with the dead.
  Observability is the brake: it detects the failure fast (shrinking the blast)
  AND damps the retry storm, so your survivors hold. Skip it and the cascade
  pushes you under the uptime line.
difficulty: intermediate
budget_cap: 600
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 15000 }
  - { t: 90, rps: 15000 }
traffic_sources:
  - { type: web-users, rps: 15000, kind: steady, workload: mixed, origin: one-region }
required_components:
  - compute
  - monitoring
target_metrics:
  uptime_percent: 85
  p99_latency_ms: 800
scheduled_events:
  - { t: 30, type: az_outage, target: compute, durationS: 30 }
hints:
  - "A 30s zone outage hits compute at t=30s. Spread compute across zones (more replicas → more AZs) so a lost zone leaves survivors instead of a total blackout."
  - "Observability is not decorative. It DETECTS the failure within seconds (shrinking the blast radius) and DAMPS retry amplification — without it, retried timeouts crowd your surviving zones and uptime falls below the 85% line."
  - "Wire observability to compute, size compute across ≥3 zones, and the surviving capacity (detected + breaker-damped) clears the 85% uptime line through the outage. Drop observability and the thundering-herd drops you to ~82% — a fail."
schema_version: 2
track: reliability
tier: 2
requires: [observe-baseline, scale-out]
unlocks: []
min_xp: 494
required_types: [observability]
available_blocks: [traffic-source, compute, observability, load-balancer]
grants: []
rewards:
  xp: 260
