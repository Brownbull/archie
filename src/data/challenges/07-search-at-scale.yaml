id: search-at-scale
title: Search at Scale
brief: >-
  A product catalog needs fast search across heavy traffic. Combine an edge
  tier, scaled compute, a search tier, and caching to hold a strict p99 while
  thousands of requests per second pour in. Every tier has to pull its weight.
difficulty: advanced
budget_cap: 800
duration_seconds: 100
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 50, rps: 1600 }
  - { t: 100, rps: 2500 }
traffic_sources:
  - { type: web-users, rps: 2500, kind: search, workload: read, origin: one-region }
required_components:
  - delivery-network
  - compute
  - search
  - caching
target_metrics:
  uptime_percent: 99
  p99_latency_ms: 180
  p95_latency_ms: 140
hints:
  - "The core problem is handling 2500 RPS search queries with strict p99 latency; every tier on the critical path must have capacity headroom."
  - "Layer a CDN at the edge to absorb some traffic, then scale compute with multiple replicas behind a load balancer to distribute the peak load."
  - "Size the search-engine and cache separately — neither should saturate at 2500 RPS; both must keep individual nodes under 100% load to hold the 180ms p99."
  - "The search-engine handles compute-intensive queries; the cache sits between compute and search to reduce queries hitting the search tier, multiplying throughput."
  - "CDN → load-balancer → 8-10 compute replicas → cache → search-engine. Target 250 RPS per compute node, 1250 RPS per cache node, 1250 RPS per search-engine node to stay under 90% and hit p99 180ms."
schema_version: 2
track: data
tier: 4
requires: [polyglot-persistence]
unlocks: [analytics-backbone]
min_xp: 5138
required_types: [search-engine, cache]
available_blocks: [compute, relational-db, cache, search-engine, cdn, traffic-source]
grants: [search-engine]
rewards:
  xp: 960
