id: cache-or-crash
title: Cache or Crash
brief: >-
  Your database can handle 500 rps but the traffic source sends 2000. Without
  a cache absorbing the read load, the DB will overload and shed traffic. Place
  a cache upstream of the DB — the cache's hit ratio absorbs most reads so the
  DB only sees the misses.
difficulty: intermediate
budget_cap: 200
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 500 }
  - { t: 30, rps: 1500 }
  - { t: 60, rps: 2000 }
  - { t: 90, rps: 2000 }
traffic_sources:
  - { type: web-users, rps: 2000, kind: realistic, workload: read, origin: one-region }
required_components:
  - compute
  - data-storage
  - caching
target_metrics:
  uptime_percent: 97
  p99_latency_ms: 300
  p95_latency_ms: 180
hints:
  - "Your database handles 500 rps but traffic sends 2000 rps. A cache upstream absorbs the read hits so the DB only sees misses."
  - "Place the cache between the traffic source (via compute) and the database. With an 80% hit ratio, the cache serves 1600 rps and the DB only sees 400 rps."
  - "At peak (2000 rps, t=60-90), the cache must hold the hot dataset (~1-2GB depending on key size and working set). If the cache is undersized, eviction is too aggressive and miss ratio climbs."
  - "Use traffic-source → compute → cache → relational-db. Size the cache for 80%+ hit ratio. At 2000 rps peak, 400 rps reaches the DB, 1600 rps served from cache."
  - "Deploy 1 compute with a standalone cache (its 80% hit ratio is built into the variant). At t=60-90, 2000 rps: the cache serves 1600, the DB only the 400 misses — no overload, 97% uptime, p99≤300ms, p95≤180ms."
schema_version: 2
track: data
tier: 3
requires: [cache-the-hot-path]
unlocks: []
min_xp: 1976
required_types: [relational-db, cache]
available_blocks: [traffic-source, compute, relational-db, cache]
grants: []
rewards:
  xp: 455
