id: auth-101
title: Identify Yourself
brief: >-
  Add an auth tier upstream of compute. Every request must be authenticated
  before it reaches the backend. Handle login load under budget — auth adds
  latency, so keep the total p99 in check.
difficulty: beginner
budget_cap: 200
duration_seconds: 60
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 300 }
  - { t: 60, rps: 600 }
traffic_sources:
  - { type: web-users, rps: 600, kind: realistic, workload: mixed, origin: one-region }
required_components:
  - compute
  - auth-security
target_metrics:
  uptime_percent: 96
  p99_latency_ms: 400
  p95_latency_ms: 300
hints:
  - "The core problem: requests need auth validation before hitting the backend. The auth tier sits upstream as the gatekeeper."
  - "Place auth upstream of compute so it validates credentials first. Auth adds 50-100ms latency, so scale it lean to keep total p99 under 400ms at 600 rps."
  - "Wire traffic → auth → compute. Size auth for 600 rps within 200 budget. Latency budget is tight: auth's added latency plus compute must total under p99 400ms. Keep auth stateless and replicate if needed."
schema_version: 2
track: security
tier: 1
requires: [first-service]
unlocks: [rate-limit]
required_types: [auth]
available_blocks: [compute, auth, traffic-source]
grants: [auth]
rewards:
  xp: 100
