id: auth-101
title: Identify Yourself
brief: >-
  Someone scraped your entire API overnight. Turns out any request from anywhere sailed straight
  to the backend — no questions asked. That ends today: every request must prove who it's from
  before the backend ever sees it. The catch is that checking credentials isn't free; it adds
  delay to every single call, and your latency bar doesn't get any slack for it. 600 requests a
  second are on their way. Greet each one with 'and you are?'
difficulty: beginner
budget_cap: 200
duration_seconds: 60
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 300 }
  - { t: 60, rps: 600 }
traffic_sources:
  - { type: web-users, rps: 600, kind: realistic, workload: mixed, origin: one-region }
required_components:
  - compute
  - auth-security
target_metrics:
  uptime_percent: 96
  p99_latency_ms: 400
  p95_latency_ms: 300
hints:
  - "The core problem: requests need auth validation before hitting the backend. The auth tier sits upstream as the gatekeeper."
  - "Place auth upstream of compute so it validates credentials first. Auth adds 50-100ms latency, so scale it lean to keep total p99 under 400ms at 600 rps."
  - "Wire traffic → auth → compute. Size auth for 600 rps within 200 budget. Latency budget is tight: auth's added latency plus compute must total under p99 400ms. Keep auth stateless and replicate if needed."
schema_version: 2
track: security
tier: 1
requires: [first-service]
unlocks: [rate-limit]
required_types: [auth]
available_blocks: [compute, auth, traffic-source]
grants: [auth]
rewards:
  xp: 100
