id: worker-fleet
title: Worker Fleet
brief: >-
  Heavy async work is clogging the request path. Offload it to a worker pool
  behind a message queue so the API stays fast. The workers process jobs in the
  background — keep the queue from backing up under sustained load.
difficulty: intermediate
budget_cap: 1200
duration_seconds: 120
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 800 }
  - { t: 60, rps: 1500 }
  - { t: 90, rps: 1500 }
  - { t: 120, rps: 800 }
required_components:
  - compute
  - messaging
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 250
hints:
  - Route writes through a message queue — the workers drain it async.
  - More workers reduce queue depth; more replicas handle the sync request path.
schema_version: 2
track: foundations
tier: 4
requires: [serverless-burst]
unlocks: [foundations-mastery]
required_types: [worker, message-queue]
available_blocks: [traffic-source, compute, load-balancer, serverless, worker, message-queue]
grants: [worker]
rewards:
  xp: 250
