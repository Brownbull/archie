id: worker-fleet
title: Worker Fleet
brief: >-
  Heavy async work is clogging the request path. Every write is stuck waiting on jobs that don't
  need to finish before the response goes out. Get that work off the hot path so the API stays
  fast — and make sure the backlog keeps draining under sustained load instead of quietly piling
  up.
difficulty: intermediate
budget_cap: 1200
duration_seconds: 120
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 800 }
  - { t: 60, rps: 1500 }
  - { t: 90, rps: 1500 }
  - { t: 120, rps: 800 }
traffic_sources:
  - { type: api-client, rps: 1500, kind: realistic, workload: write, origin: one-region }
required_components:
  - compute
  - messaging
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 250
  p95_latency_ms: 200
hints:
  - "The core problem is offloading heavy async work from the request path so the API stays fast while background jobs drain asynchronously."
  - "Write requests hit compute, which enqueues them on message-queue; worker nodes drain the queue async, returning the response immediately without waiting."
  - "Size compute replicas for the 1500 RPS peak on the request path (~6-8 replicas); size the worker pool to drain faster than writes arrive, preventing queue backup."
  - "Compute replicas → message-queue → 12-15 workers. Keep message-queue under 100% to prevent backing up at 1500 RPS peak and hold p99 under 250ms with p95 under 200ms."
schema_version: 2
track: foundations
tier: 4
requires: [serverless-burst, async-pipeline]
unlocks: [foundations-mastery]
min_xp: 5138
required_types: [worker, message-queue]
available_blocks: [traffic-source, compute, load-balancer, serverless, worker, message-queue]
grants: [worker]
rewards:
  xp: 780
