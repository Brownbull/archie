id: edge-resilience
title: Edge Under Chaos
brief: >-
  Capstone: your multi-layer edge must survive an AZ failure and a latency spike hitting
  simultaneously. Every tier between your users and compute has to absorb the impact without
  dropping below the uptime target at 3000+ rps.
difficulty: advanced
budget_cap: 2500
duration_seconds: 180
traffic_curve:
  - { t: 0, rps: 500 }
  - { t: 30, rps: 1500 }
  - { t: 60, rps: 3000 }
  - { t: 90, rps: 3500 }
  - { t: 120, rps: 3500 }
  - { t: 150, rps: 2000 }
  - { t: 180, rps: 1000 }
traffic_sources:
  - { type: web-users, rps: 3500, kind: realistic, workload: read, origin: one-region }
required_components:
  - delivery-network
  - compute
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 300
  p95_latency_ms: 180
scheduled_events:
  - { t: 60, type: az_outage, target: compute, durationS: 60 }
  - { t: 90, type: latency_spike, target: compute, multiplier: 5, durationS: 30 }
hints:
  - "The core problem is surviving simultaneous AZ failure and latency spike at 3500 rps while staying under 99% uptime and 180ms p95 — your edge tiers must absorb traffic when compute drops."
  - "Place a CDN as your front layer to cache static assets; add an API gateway to route traffic and a cache layer in front of compute to serve stale reads when the backend is slow or down."
  - "Pick a cache variant with a high built-in hit ratio and give it replicas — during the 60s AZ outage (t=60-120) and the 30s latency spike (t=90-120), cached reads are what keep answers flowing while compute struggles."
  - "Wire traffic through CDN for static assets, then API gateway routing dynamic requests to cache layer; if cache misses, requests hit compute through a load balancer with 2-3 replicas handling 3500 rps peak."
  - "Deploy CDN and API gateway in multi-AZ; size cache with 2-3 replicas for 3500 rps peak and stale-read service during both outage and spike; size compute replicas to split traffic; use only required blocks avoiding forbidden types."
chaos_intensity: 2.5
schema_version: 2
track: edge
tier: 5
requires: [api-gateway, zone-failure, cache-the-hot-path]
unlocks: []
min_xp: 10520
required_types: [cdn, api-gateway, cache]
available_blocks: [compute, traffic-source, dns, load-balancer, cdn, api-gateway, cache]
grants: []
rewards:
  xp: 1600

# P4-S7 (D94): resilience extra — survive a 10x spike with a 3★ build (+1 expert). Lean breaks,
# hardened clears (engine-probed) — the quest is literally named for this.
resilience_conditions: [failure-traffic-spike]
