id: zone-replica
title: Zone Replica
brief: >-
  Spread replicas across availability zones. Observability tracks each zone
  independently so you see which zone is hot. Keep latency flat even as traffic
  doubles — the load balancer should spread requests evenly.
difficulty: intermediate
budget_cap: 700
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 600 }
  - { t: 60, rps: 1200 }
  - { t: 90, rps: 1200 }
traffic_sources:
  - { type: web-users, rps: 1200, kind: realistic, workload: mixed, origin: one-region }
required_components:
  - compute
  - monitoring
  - delivery-network
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 250
  p95_latency_ms: 200
hints:
  - "The core problem: single-zone replicas fail together. The load balancer and per-zone observability matter most to spread traffic and confirm balance."
  - "Deploy compute replicas across 2+ zones. Use the load balancer to distribute traffic evenly. Observability shows per-zone metrics so you catch if one zone is hot."
  - "Place load-balancer upstream of compute replicas in separate zones (2 replicas minimum). As traffic hits 1200 rps, load-balancer routes equally, keeping latency flat. Monitor each zone independently to confirm distribution."
  - "Wire traffic → load-balancer → compute replicas zone-a/zone-b (1-2 per zone). Load-balancer uses round-robin/least-connections. Add observability per-zone. With even distribution, p99 stays under 250ms at 1200 rps. Avoid single replica or unmonitored zones."
schema_version: 2
track: reliability
tier: 2
requires: [observe-baseline, scale-out]
unlocks: [zone-failure]
min_xp: 494
required_types: [observability, load-balancer]
available_blocks: [compute, relational-db, observability, load-balancer]
grants: []
rewards:
  xp: 260
