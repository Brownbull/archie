id: burst-absorber
title: Burst Absorber
brief: >-
  A flash sale sends 5000 rps in a sudden spike. Your worker can only process
  500 rps. Place a message queue between the traffic source and the worker —
  the queue buffers the burst and drains steadily to the worker. Without the
  queue, 4500 of 5000 requests are dropped instantly.
difficulty: intermediate
budget_cap: 300
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 200 }
  - { t: 20, rps: 200 }
  - { t: 30, rps: 5000 }
  - { t: 60, rps: 5000 }
  - { t: 75, rps: 500 }
  - { t: 90, rps: 200 }
traffic_sources:
  - { type: web-users, rps: 5000, kind: periodic, workload: write, origin: one-region }
required_components:
  - compute
  - messaging
target_metrics:
  uptime_percent: 90
  p99_latency_ms: 500
  p95_latency_ms: 320
hints:
  - "The core problem is a 5000 rps flash sale spike at t=30s hitting a 500 rps worker. Message queuing is the required tier — without a queue, 4500 requests drop instantly."
  - "A message queue buffers the burst and decouples traffic from the worker, which drains at 500 rps. The queue absorbs the 4500 rps gap during the spike without losing traffic."
  - "Place message queue between traffic source and worker. At t=30-60s the queue buffers ~220k messages (4500 rps × 30s). It fully drains by t=75s when traffic drops to match worker capacity."
schema_version: 2
track: realtime
tier: 2
requires: [async-pipeline]
unlocks: []
min_xp: 494
required_types: [message-queue, worker]
available_blocks: [traffic-source, compute, message-queue, worker, load-balancer]
grants: []
rewards:
  xp: 260
