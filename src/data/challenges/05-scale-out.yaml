id: scale-out
title: Scale Out
brief: >-
  One compute instance can't take this load. Scale the compute tier horizontally
  with replicas — but stateless replicas need a load balancer upstream or the
  topology checker will flag them. Earn the clean-topology star by wiring it
  correctly, and keep p99 down under heavy traffic.
difficulty: intermediate
budget_cap: 600
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 45, rps: 900 }
  - { t: 90, rps: 1500 }
required_components:
  - delivery-network
  - compute
target_metrics:
  uptime_percent: 98.5
  p99_latency_ms: 250
hints:
  - Raise the replica count on compute until it keeps up with peak traffic.
  - Replicas without a load balancer upstream raise a topology warning — add the LB tier.
  - Capacity scales with replicas; latency climbs once a node is past 100% load.
schema_version: 2
track: foundations
tier: 2
requires: [first-service]
unlocks: [serverless-burst, edge-balance, zone-replica, cold-start-spike]
min_xp: 494
required_types: [load-balancer]
available_blocks: [traffic-source, compute, load-balancer]
grants: [load-balancer]
rewards:
  xp: 260
