id: scale-out
title: Scale Out
brief: >-
  One compute instance can't take this load. Scale the compute tier horizontally
  with replicas — but stateless replicas need a load balancer upstream or the
  topology checker will flag them. Earn the clean-topology star by wiring it
  correctly, and keep p99 down under heavy traffic.
difficulty: intermediate
budget_cap: 600
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 45, rps: 900 }
  - { t: 90, rps: 1500 }
traffic_sources:
  - { type: web-users, rps: 1500, kind: realistic, workload: mixed, origin: one-region }
required_components:
  - delivery-network
  - compute
target_metrics:
  uptime_percent: 98.5
  p99_latency_ms: 250
  p95_latency_ms: 160
hints:
  - "At 1500 RPS, a single compute node cannot handle the load — this is a horizontal scaling problem requiring replicas and a load balancer."
  - "Replicas of stateless compute spread load evenly, but they require a load balancer upstream to distribute traffic; without it the topology is invalid."
  - "Raise compute replicas until the total capacity exceeds 1500 RPS; place a load balancer in front to route traffic fairly across the pool."
  - "Place traffic → load balancer → compute replicas (raise count until each stays under 100% at 1500 RPS); load balancer distributes traffic evenly so the replica pool absorbs the peak and meets p99 < 250 ms."
schema_version: 2
track: foundations
tier: 2
requires: [first-service]
unlocks: [serverless-burst, edge-balance, zone-replica, cold-start-spike]
min_xp: 494
required_types: [load-balancer]
available_blocks: [traffic-source, compute, load-balancer]
grants: [load-balancer]
rewards:
  xp: 260
