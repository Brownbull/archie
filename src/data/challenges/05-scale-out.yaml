id: scale-out
title: Scale Out
brief: >-
  One server got you this far. It won't get you through tonight: traffic is climbing toward 1,500
  requests a second, and the lone box under the app will be gasping long before the peak. No
  machine you can buy swallows that load alone — it has to be spread. Hold p99 under 250 ms while
  the surge builds, and keep the wiring tight: the well-formed star goes to builds with nothing
  stranded or unreachable.
difficulty: intermediate
budget_cap: 600
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 45, rps: 900 }
  - { t: 90, rps: 1500 }
traffic_sources:
  - { type: web-users, rps: 1500, kind: realistic, workload: mixed, origin: one-region }
required_components:
  - delivery-network
  - compute
target_metrics:
  uptime_percent: 98.5
  p99_latency_ms: 250
  p95_latency_ms: 160
hints:
  - "At 1500 RPS, a single compute node cannot handle the load — this is a horizontal scaling problem requiring replicas and a load balancer."
  - "Replicas of stateless compute spread load evenly, but they need a load balancer upstream to distribute traffic — it is one of this quest's required blocks, and without it your replicas sit unbalanced."
  - "Raise compute replicas until the total capacity exceeds 1500 RPS; place a load balancer in front to route traffic fairly across the pool."
  - "Place traffic → load balancer → compute replicas (raise count until each stays under 100% at 1500 RPS); load balancer distributes traffic evenly so the replica pool absorbs the peak and meets p99 < 250 ms."
schema_version: 2
track: foundations
tier: 2
requires: [first-service]
unlocks: [serverless-burst, edge-balance, zone-replica, cold-start-spike]
min_xp: 494
required_types: [load-balancer]
available_blocks: [traffic-source, compute, load-balancer]
grants: [load-balancer]
rewards:
  xp: 260

# P5-S2 (D95): brownfield start — "one server got you this far", literally. The player inherits
# the single box already wired to production traffic and must spread the load (LB + replicas).
# Needs-work gate: no load-balancer ⇒ required_types fails (and 1500 rps drowns one replica)
# ⇒ <3★ as-seeded (harness-pinned).
initial_architecture:
  nodes:
    - { id: bf-traffic, component_id: web-users, config_variant_id: moderate, position: { x: 60, y: 200 }, replicas: 1, traffic_rps: 1500, traffic_kind: realistic }
    - { id: bf-app, component_id: node-express, config_variant_id: single-process, position: { x: 340, y: 200 }, replicas: 1 }
  edges:
    - { id: bf-e0, source_node_id: bf-traffic, target_node_id: bf-app }
