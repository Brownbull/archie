id: api-gateway
title: API Gateway
brief: >-
  Front your compute with an API gateway for request validation, routing, and
  auth enforcement. The gateway sits between the CDN and compute — keep the
  total p99 under 250 ms while handling authenticated traffic at scale.
difficulty: advanced
budget_cap: 1500
duration_seconds: 120
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 600 }
  - { t: 60, rps: 2000 }
  - { t: 90, rps: 2000 }
  - { t: 120, rps: 800 }
traffic_sources:
  - { type: api-client, rps: 2000, kind: realistic, workload: mixed, origin: one-region }
required_components:
  - delivery-network
  - compute
  - auth-security
target_metrics:
  uptime_percent: 99
  p99_latency_ms: 250
  p95_latency_ms: 180
hints:
  - "An API gateway sits between CDN and compute: it validates requests, enforces auth, and routes to the right endpoint — offloading these from compute keeps total p99 under 250ms."
  - "Traffic flows: api-client → cdn → api-gateway (auth + validation) → compute; api-gateway checks identity on every request and forwards validated traffic downstream."
  - "traffic-source (api-client) → dns → cdn → api-gateway → load-balancer → compute (4 replicas); api-gateway enforces auth (<10ms overhead), cdn caches cacheable responses, load-balancer spreads 2000 RPS across 4 replicas (500 RPS each) at p99≤250ms with 99% uptime."
schema_version: 2
track: edge
tier: 4
requires: [edge-delivery]
unlocks: [edge-resilience]
min_xp: 5138
required_types: [api-gateway, auth]
available_blocks: [compute, traffic-source, dns, load-balancer, cdn, api-gateway, auth]
grants: [api-gateway]
rewards:
  xp: 960
