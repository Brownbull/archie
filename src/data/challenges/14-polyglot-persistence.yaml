id: polyglot-persistence
title: Polyglot Persistence
brief: >-
  Not every workload fits SQL. Your product juggles tidy transactional records, free-form
  documents, and hefty media blobs — and one overworked database has been eating them all. At 1200
  RPS the seams are showing: match each data shape to the store it deserves. Keep reads fast and
  writes durable.
difficulty: intermediate
budget_cap: 1000
duration_seconds: 120
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 600 }
  - { t: 60, rps: 1200 }
  - { t: 90, rps: 1200 }
  - { t: 120, rps: 600 }
traffic_sources:
  - { type: web-users, rps: 1200, kind: realistic, workload: read, origin: one-region }
required_components:
  - compute
  - data-storage
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 250
  p95_latency_ms: 180
hints:
  - "Different data shapes demand different databases — structured data thrives in SQL, documents in NoSQL; cache shields all reads so no DB is hammered directly."
  - "Route reads through cache first; structured queries hit relational-db and documents hit nosql, both cached on warm hits; writes bypass cache and go direct to the appropriate DB."
  - "Blobs belong in object storage — cheap, durable, and off the hot read path; keep relational-db for transactions and nosql for schema-free documents; size cache replicas to hit 80%+ for 1200 RPS so DB load stays below saturation."
  - "traffic-source → compute → cache; compute routes reads to cache, cache hits return directly, misses fetch from relational-db (structured) or nosql (documents); blobs land in object-storage off the cached path; use 2-3 compute + 1-2 cache replicas for p99 250ms and p95 180ms at 1200 RPS."
schema_version: 2
track: data
tier: 3
requires: [cache-the-hot-path]
unlocks: [search-at-scale, write-storm]
min_xp: 1976
required_types: [relational-db, nosql, cache, object-storage]
available_blocks: [compute, relational-db, nosql, cache, object-storage, traffic-source]
grants: [nosql]
rewards:
  xp: 455
