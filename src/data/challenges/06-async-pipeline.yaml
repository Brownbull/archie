id: async-pipeline
title: Async Pipeline
brief: >-
  Spiky write traffic is stressing the system. Your design must include a
  messaging tier on the write path. Size every tier so that even at the peaks of
  the up-and-down traffic curve no node is pushed past its capacity.
difficulty: intermediate
budget_cap: 500
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 700 }
  - { t: 60, rps: 400 }
  - { t: 90, rps: 1000 }
traffic_sources:
  - { type: web-users, rps: 1000, kind: periodic, workload: write, origin: one-region }
required_components:
  - compute
  - messaging
  - data-storage
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 300
  p95_latency_ms: 200
hints:
  - "The spiky write traffic (peaking at 1000 RPS) must be decoupled from the database — add a messaging queue to buffer writes and let the database catch up asynchronously."
  - "Traffic pattern peaks 3 times; provision for the highest peak (1000 RPS) since the queue cannot carry requests backward across time."
  - "Route compute → message queue → database; size the queue and database so that at 1000 RPS peak, neither is saturated and p99 latency stays under 300 ms."
  - "Place traffic → compute → message queue → database; size compute for 1000 RPS write ingestion, queue to accept all 1000 RPS without blocking, and database to drain queue without saturation."
schema_version: 2
track: realtime
tier: 1
requires: [first-service, add-a-database]
unlocks: [event-stream, burst-absorber]
required_types: [message-queue, relational-db]
available_blocks: [compute, message-queue, relational-db, cache, load-balancer, traffic-source]
grants: [message-queue]
rewards:
  xp: 130
