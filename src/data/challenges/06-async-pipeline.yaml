id: async-pipeline
title: Async Pipeline
brief: >-
  Spiky write traffic is overwhelming synchronous processing. Introduce a
  messaging tier so producers hand off work and consumers drain it at their own
  pace. Decouple the write path and keep the system up through the ramp.
difficulty: intermediate
budget_cap: 500
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 700 }
  - { t: 60, rps: 400 }
  - { t: 90, rps: 1000 }
required_components:
  - compute
  - messaging
  - data-storage
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 300
hints:
  - Messaging buffers bursts so the database tier isn't hit with the full spike.
  - Route compute → messaging → compute/data-storage for the async drain.
