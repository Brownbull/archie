id: async-pipeline
title: Async Pipeline
brief: >-
  Voting night, live on air. Every time the host opens the lines, a wall of writes crashes in —
  then a lull, then a bigger wall. Your database shrugs at the average but gags on the crests.
  Viewers will forgive a tally that runs a beat behind; they won't forgive a vote button that dies
  mid-surge. The final wave is the tallest of the night, and you can't borrow capacity from the
  quiet stretches — build for the crest, not the average.
difficulty: intermediate
budget_cap: 500
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 700 }
  - { t: 60, rps: 400 }
  - { t: 90, rps: 1000 }
traffic_sources:
  - { type: web-users, rps: 1000, kind: periodic, workload: write, origin: one-region }
required_components:
  - compute
  - messaging
  - data-storage
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 300
  p95_latency_ms: 200
hints:
  - "The spiky write traffic (peaking at 1000 RPS) must be decoupled from the database — add a messaging queue to buffer writes and let the database catch up asynchronously."
  - "Traffic pattern peaks 3 times; provision for the highest peak (1000 RPS) since the queue cannot carry requests backward across time."
  - "Route compute → message queue → worker → database; the worker drains the queue and owns the database writes, so neither queue nor database saturates at the 1000 RPS peak and p99 stays under 300 ms."
  - "Place traffic → compute → message queue → worker → database; size compute for 1000 RPS write ingestion, the queue to accept all 1000 RPS without blocking, and the worker pool to drain it into the database without saturation."
schema_version: 2
track: realtime
tier: 1
requires: [first-service, add-a-database]
unlocks: [event-stream, burst-absorber]
required_types: [message-queue, relational-db]
available_blocks: [compute, message-queue, worker, relational-db, cache, load-balancer, traffic-source]
grants: [message-queue]
rewards:
  xp: 130
