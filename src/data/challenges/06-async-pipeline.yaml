id: async-pipeline
title: Async Pipeline
brief: >-
  Spiky write traffic is stressing the system. Your design must include a
  messaging tier on the write path. Size every tier so that even at the peaks of
  the up-and-down traffic curve no node is pushed past its capacity.
difficulty: intermediate
budget_cap: 500
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 700 }
  - { t: 60, rps: 400 }
  - { t: 90, rps: 1000 }
required_components:
  - compute
  - messaging
  - data-storage
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 300
hints:
  - The traffic curve peaks, dips, then peaks higher — provision for the highest peak, since the model has no cross-time queue to smooth it.
  - Route compute → messaging → data-storage; give each tier capacity (or replicas) to carry the served load it receives without shedding.
schema_version: 2
track: realtime
tier: 1
requires: [first-service, add-a-database]
unlocks: [event-stream, burst-absorber]
required_types: [message-queue, relational-db]
available_blocks: [compute, message-queue, relational-db, cache, load-balancer, traffic-source]
grants: [message-queue]
rewards:
  xp: 150
