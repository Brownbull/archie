id: realtime-live
title: Live Updates
brief: >-
  Five hundred dashboards are open, and every one expects the next update the instant it lands.
  Polling won't cut it — updates must reach 500+ live connections in under 150 ms while the stream
  processor feeds fresh data continuously.
difficulty: advanced
budget_cap: 2000
duration_seconds: 120
traffic_curve:
  - { t: 0, rps: 200 }
  - { t: 30, rps: 1000 }
  - { t: 60, rps: 2500 }
  - { t: 90, rps: 2500 }
  - { t: 120, rps: 1000 }
traffic_sources:
  - { type: web-users, rps: 2500, kind: realistic, workload: read, origin: one-region }
required_components:
  - compute
  - real-time
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 150
hints:
  - "The core problem is fanning out processed events to 500+ websocket clients at sub-150ms latency while the stream processor feeds fresh data continuously — realtime tier handles fan-out and connection management."
  - "Place a realtime block managing 500+ websocket connections and emitting updates under 150ms p99 latency at 2500 rps peak."
  - "Size realtime with 2-3 replicas for 500+ concurrent connections; add cache to pre-compute latest event state so new connections bootstrap fast."
  - "Wire stream-processor output to realtime tier which fans updates to subscribed clients; cache stores latest state so new connections don't request stale history."
  - "The working shape: compute (cluster mode) feeds a stream processor, and the realtime tier fans the processed events to clients at 2500 rps under the 150ms p99. One well-sized websocket server carries it; add replicas for connection headroom, not throughput."
schema_version: 2
track: realtime
tier: 4
requires: [stream-processor]
unlocks: [async-backbone]
min_xp: 5138
required_types: [realtime, stream-processor]
available_blocks: [compute, realtime, event-stream, stream-processor, cache, traffic-source]
grants: [realtime]
rewards:
  xp: 960
