id: pool-exhaustion
title: The Pool Runs Dry
brief: >-
  The AI summary feature shipped Friday and the team is proud of it — until Monday's traffic. The
  model isn't slow; the LINE in front of it is. Every request holds a gateway slot for the full
  generation, the pool admits 50 in flight per instance, and at 300 requests a second your two
  instances are turning users away while reserved capacity sits idle. Nobody bought more model —
  they just never counted how long each request KEEPS its slot.
difficulty: intermediate
budget_cap: 700
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 200 }
  - { t: 60, rps: 300 }
  - { t: 90, rps: 260 }
traffic_sources:
  - { type: api-client, rps: 300, kind: realistic, workload: read, origin: one-region }
required_components:
  - compute
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 1200
hints:
  - "Watch WHERE requests die: the gateway rejects them before the model ever sees them. A pool isn't throughput — it's how many requests can be IN FLIGHT at once."
  - "In-flight ≈ arrival rate × time each request holds its slot. At 500 ms per generation (and worse under load), 50 slots per instance saturate far below this demand."
  - "Two escapes, both real: more instances (each brings its own pool of 50), or a gateway tier built for more concurrent requests. Price them both against the budget."
schema_version: 2
track: aiml
tier: 2
requires: [llm-service]
unlocks: []
min_xp: 900
required_types: [llm-gateway]
available_blocks: [traffic-source, compute, llm-gateway]
grants: []
rewards:
  xp: 320

# Plan-2 P5 (D100, closes D18): the pool-exhaustion lesson. The seed pins the single-model variant
# (concurrency_limit 150) at 2 replicas — in-flight at 300 rps blows past both pools, so the build
# FAILS as inherited. The player either scales out (more pools) or re-tiers (bigger pool).
initial_architecture:
  nodes:
    - { id: bf-traffic, component_id: api-client, config_variant_id: rest-api, position: { x: 60, y: 200 }, replicas: 1, traffic_rps: 300, traffic_kind: realistic }
    - { id: bf-app, component_id: node-express, config_variant_id: single-process, position: { x: 320, y: 200 }, replicas: 2 }
    - { id: bf-llm, component_id: llm-gateway, config_variant_id: dedicated-capacity, position: { x: 580, y: 200 }, replicas: 2 }
  edges:
    - { id: bf-e0, source_node_id: bf-traffic, target_node_id: bf-app }
    - { id: bf-e1, source_node_id: bf-app, target_node_id: bf-llm }
