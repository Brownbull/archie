id: observe-baseline
title: Observe Baseline
brief: >-
  A service with no observability is a black box. Add monitoring to a running
  compute + DB stack so you can watch request rates, error rates, and latency
  in real time. The challenge: keep the added observability tier from pushing
  you over budget.
difficulty: beginner
budget_cap: 150
duration_seconds: 60
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 200 }
  - { t: 60, rps: 400 }
traffic_sources:
  - { type: iot-sensors, rps: 400, kind: steady, workload: read, origin: one-region }
required_components:
  - compute
  - monitoring
target_metrics:
  uptime_percent: 95
  p99_latency_ms: 400
hints:
  - "The core problem is adding observability to a compute + DB stack without exceeding 150-unit budget while maintaining 95% uptime — observability is non-serving, so pick minimal footprint."
  - "Place an observability block connected to compute and relational-db to collect request rates, error rates, and latency metrics; size it lightly (1 replica) because it only observes."
  - "Size observability with 1 replica to monitor 400 rps read workload at t=60; it should track volume, errors, and latency percentiles without exceeding 150-unit budget."
  - "Wire compute and relational-db to observability block which collects metrics; observability does not sit in request path, so minimal latency impact; size compute 1-2 replicas, relational-db 1 replica."
  - "Deploy compute 1 replica for 400 rps reads, relational-db 1 replica; connect single observability block (fits 150-unit budget) to collect metrics; achieves 95% uptime and p99 400ms latency watching request/error rates and latency."
schema_version: 2
track: reliability
tier: 1
requires: [first-service]
unlocks: [zone-replica, observe-to-recover]
required_types: [observability]
available_blocks: [compute, relational-db, observability]
grants: [observability]
rewards:
  xp: 100
