id: serverless-burst
title: Serverless Burst
brief: >-
  A spike hits your scaled-out service — steady 200 RPS one moment, 3000 the next, and back down
  almost as fast as it came. Keep latency flat while the burst passes, and stay under budget:
  capacity bought for the peak keeps billing long after the peak is gone.
difficulty: intermediate
budget_cap: 800
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 200 }
  - { t: 30, rps: 200 }
  - { t: 45, rps: 3000 }
  - { t: 60, rps: 3000 }
  - { t: 75, rps: 400 }
  - { t: 90, rps: 400 }
traffic_sources:
  - { type: web-users, rps: 3000, kind: periodic, workload: mixed, origin: one-region }
required_components:
  - compute
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 300
  p95_latency_ms: 240
hints:
  - "The core problem is absorbing a spike from 200 RPS to 3000 RPS without over-provisioning base compute; serverless scales automatically to cover overflow."
  - "Split traffic between a small base compute tier (sized for steady 200 RPS) and serverless functions that handle overflow during the spike."
  - "Use a load-balancer to route: steady-state requests go to compute, burst requests spill to serverless; this keeps compute under 100% and avoids idle replicas after the burst ends."
schema_version: 2
track: foundations
tier: 3
requires: [scale-out]
unlocks: [worker-fleet, checkout-flow]
min_xp: 1976
required_types: [serverless, load-balancer]
available_blocks: [traffic-source, compute, load-balancer, serverless]
grants: [serverless]
rewards:
  xp: 455
