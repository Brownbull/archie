id: data-pipeline
title: Data Pipeline
brief: >-
  Build an ETL pipeline that ingests text, routes it through the LLM for
  embeddings, and stores the output. A latency spike on the ETL tier mid-run
  tests your pipeline's resilience. Keep the ingest queue from backing up.
difficulty: intermediate
budget_cap: 1500
duration_seconds: 120
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 300 }
  - { t: 60, rps: 1000 }
  - { t: 90, rps: 1000 }
  - { t: 120, rps: 300 }
traffic_sources:
  - { type: api-client, rps: 1000, kind: realistic, workload: write, origin: one-region }
required_components:
  - compute
  - messaging
target_metrics:
  uptime_percent: 97
  p99_latency_ms: 400
  p95_latency_ms: 260
scheduled_events:
  - { t: 60, type: latency_spike, target: compute, multiplier: 4, durationS: 20 }
hints:
  - "This is an async pipeline problem: ingest must not block; a message queue decouples traffic from ETL compute so you can buffer the burst."
  - "Place the message queue between your ingestion compute and the ETL tier: compute accepts writes fast and publishes to the queue; ETL drains it at its own pace while the LLM gateway handles embeddings on a separate branch."
  - "The default tiers can't hit the targets: Batch ETL tops out at 100 rps and the Single-Model LLM proxy adds 500 ms per call. Switch the ETL to Micro-Batch and the LLM gateway to Streaming before you reach for more replicas."
  - "Wire traffic → compute → message queue → ETL → object storage, plus compute → LLM gateway for the embedding calls. Every link in that chain is port-compatible — if you see a port warning, re-check which ports you connected."
  - "Full solve: 2x compute (any framework), RabbitMQ Single Node, 2x ETL on Micro-Batch, object storage, LLM gateway on Streaming — roughly $400 of the $1500 budget. Measured through the grader: 100% uptime, p95 about 120 ms against the 260 ms target."
forbidden_types: [relational-db]
chaos_intensity: 2
schema_version: 2
track: aiml
tier: 2
requires: [llm-service, add-a-database, async-pipeline]
unlocks: [rag-retrieval]
min_xp: 494
required_types: [llm-gateway, etl, message-queue]
available_blocks: [compute, llm-gateway, etl, object-storage, message-queue, traffic-source]
grants: [etl]
rewards:
  xp: 260
