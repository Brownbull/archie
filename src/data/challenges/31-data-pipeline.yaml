id: data-pipeline
title: Data Pipeline
brief: >-
  Build an ETL pipeline that ingests text, routes it through the LLM for
  embeddings, and stores the output. A latency spike on the ETL tier mid-run
  tests your pipeline's resilience. Keep the ingest queue from backing up.
difficulty: intermediate
budget_cap: 1500
duration_seconds: 120
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 300 }
  - { t: 60, rps: 1000 }
  - { t: 90, rps: 1000 }
  - { t: 120, rps: 300 }
traffic_sources:
  - { type: api-client, rps: 1000, kind: realistic, workload: write, origin: one-region }
required_components:
  - compute
  - messaging
target_metrics:
  uptime_percent: 97
  p99_latency_ms: 400
  p95_latency_ms: 260
scheduled_events:
  - { t: 60, type: latency_spike, target: compute, multiplier: 4, durationS: 20 }
hints:
  - "This is an async pipeline problem: ingest must not block; a message queue decouples traffic from ETL compute so you can buffer the burst."
  - "Place a message queue between the traffic source and compute, and an ETL block to drain it. At peak (1000 rps), the queue absorbs the spike while ETL processes steadily."
  - "When compute gets a 4x latency spike at t=60s, the queue will grow backlog; size it to hold ~20s of excess writes (4000+ messages) so you don't shed traffic."
  - "Use traffic-source → message-queue → etl → llm-gateway, with object-storage as the raw data landing zone. Avoid relational-db (forbidden)."
  - "Deploy 2-3 compute instances running ETL. Peak 1000 rps with 4x spike at t=60s grows queue, but parallel workers drain it. Object-storage holds ~144k docs, queue buffers ~4000+ messages. Achieves 97% uptime and p95≤260ms."
forbidden_types: [relational-db]
chaos_intensity: 2
schema_version: 2
track: aiml
tier: 2
requires: [llm-service, add-a-database, async-pipeline]
unlocks: [rag-retrieval]
min_xp: 494
required_types: [llm-gateway, etl, message-queue]
available_blocks: [compute, llm-gateway, etl, relational-db, object-storage, message-queue, traffic-source]
grants: [etl]
rewards:
  xp: 260
