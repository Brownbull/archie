id: analytics-backbone
title: Analytics Backbone
brief: >-
  Capstone: one analytics backbone, three kinds of questions — metric trends over time, how
  entities connect, and search by meaning, not keywords. SQL can't carry this one. Serve analytics
  queries under latency while the ingest stream continues.
difficulty: advanced
budget_cap: 3000
duration_seconds: 180
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 500 }
  - { t: 60, rps: 1500 }
  - { t: 90, rps: 2000 }
  - { t: 120, rps: 2000 }
  - { t: 150, rps: 1500 }
  - { t: 180, rps: 500 }
traffic_sources:
  - { type: iot-sensors, rps: 800, kind: realistic, workload: write, origin: one-region }
  - { type: web-users, rps: 1200, kind: realistic, workload: read, origin: one-region }
required_components:
  - compute
  - data-storage
target_metrics:
  uptime_percent: 98.5
  p99_latency_ms: 300
  p95_latency_ms: 220
hints:
  - "Multi-modal analytics requires time-series for metrics (ingest writes), graph for relationships, and vectors for semantic search; keep ingest flowing while serving analytic reads fast."
  - "Time-series-db absorbs 800 RPS IoT writes; cache shields 1200 RPS web-user reads on graph and vector stores; writes go direct to time-series-db, reads hit cache then graph/vector."
  - "Avoid relational-db (forbidden); separate ingest (IoT → time-series-db direct) from analytics (web → cache → graph/vector); size time-series-db for 800 RPS writes, cache and graph/vector for 1200 RPS reads."
  - "IoT writes: traffic-source → compute → time-series-db (direct, no cache); Web reads: traffic-source → compute → cache → graph-db + vector-store; use 2 compute replicas, 2 cache replicas, 3 time-series-db, 3 graph-db, 2 vector-store replicas for 98.5% uptime and p99 300ms."
forbidden_types: [relational-db]
schema_version: 2
track: data
tier: 5
requires: [search-at-scale]
unlocks: []
min_xp: 10520
required_types: [time-series-db, graph-db, vector-store]
available_blocks: [compute, time-series-db, graph-db, vector-store, cache, traffic-source]
grants: [graph-db, time-series-db, vector-store]
rewards:
  xp: 1600
