id: write-storm
title: Write Storm
brief: >-
  A batch import sends 3000 write-heavy requests per second. Your SQL database's
  single primary can only handle 500 writes — read replicas don't help with
  writes. You need a NoSQL sharded database where writes distribute across
  shards, or a message queue to buffer the write burst.
difficulty: advanced
budget_cap: 500
duration_seconds: 120
traffic_curve:
  - { t: 0, rps: 500 }
  - { t: 30, rps: 1500 }
  - { t: 60, rps: 3000 }
  - { t: 90, rps: 3000 }
  - { t: 120, rps: 1000 }
traffic_sources:
  - { type: api-client, rps: 3000, kind: realistic, workload: write, origin: one-region }
required_components:
  - compute
  - data-storage
target_metrics:
  uptime_percent: 96
  p99_latency_ms: 400
  p95_latency_ms: 240
hints:
  - "Your SQL database primary is a bottleneck for writes at 500 rps max. A burst of 3000 writes overloads it. You need horizontal write scaling."
  - "Use a NoSQL sharded database where writes distribute across multiple shards, or a message queue to buffer the write burst and drain steadily."
  - "At peak (3000 rps, t=60-90), a sharded NoSQL database with 4-6 shards handles ~500-750 rps per shard (within limits). A queue alternative buffers and drains with background workers."
  - "Use traffic-source → compute → nosql (sharded). Distribute writes across shards by partition key (e.g., user ID). Avoid relational-db (forbidden)."
  - "A MongoDB replica set distributes the writes and carries the 3000 rps storm on its own — the sharded tier is headroom, not a requirement. One cluster-mode compute fans in. Roughly $100 of the $500 budget; 96% uptime, p99≤400ms, p95≤240ms with no relational bottleneck."
forbidden_types: [relational-db]
schema_version: 2
track: data
tier: 4
requires: [polyglot-persistence, scale-out, async-pipeline]
unlocks: []
min_xp: 5138
required_types: [nosql]
available_blocks: [traffic-source, compute, nosql, cache, message-queue, load-balancer]
grants: []
rewards:
  xp: 960
