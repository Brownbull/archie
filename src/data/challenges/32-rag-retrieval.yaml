id: rag-retrieval
title: RAG at Scale
brief: >-
  Query a vector DB for semantic context, merge it with the user prompt, and
  route to the LLM. Under read-heavy load, the cache and search engine absorb
  repeat queries. A vector-store failure mid-run forces your fallback path.
difficulty: advanced
budget_cap: 2500
duration_seconds: 150
traffic_curve:
  - { t: 0, rps: 100 }
  - { t: 30, rps: 500 }
  - { t: 60, rps: 1500 }
  - { t: 90, rps: 2000 }
  - { t: 120, rps: 1500 }
  - { t: 150, rps: 500 }
traffic_sources:
  - { type: web-users, rps: 1200, kind: realistic, workload: read, origin: one-region }
  - { type: api-client, rps: 800, kind: realistic, workload: read, origin: one-region }
required_components:
  - compute
  - data-storage
  - search
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 350
  p95_latency_ms: 220
scheduled_events:
  - { t: 75, type: component_failure, target: data-storage, durationS: 30 }
hints:
  - "This is a read-heavy retrieval problem: a vector store handles semantic search, and a cache layer prevents repeated queries from hitting the store."
  - "Deploy a cache upstream of the vector store to absorb repeated semantic queries. With ~80-85% hit ratio, only 15-20% of 2000 rps misses reach the store."
  - "When the vector store fails at t=75s for 30s, your fallback is the search engine (keyword-based retrieval) plus the cache for served-from-cache hits. Ensure the cache is warm before the failure."
  - "Use traffic-source → load-balancer → compute → cache → vector-store, with search-engine as fallback and llm-gateway to merge context. Avoid relational-db."
  - "Deploy 2-3 compute instances behind LB. Cache (3-4GB, 85% hit) means vector-store sees ~300 rps. At t=75s, search-engine takes over for cache misses. Achieves 98% uptime, p99≤350ms, p95≤220ms."
forbidden_types: [relational-db]
schema_version: 2
track: aiml
tier: 3
requires: [data-pipeline, search-at-scale, cache-the-hot-path]
unlocks: [production-ai]
min_xp: 1976
required_types: [llm-gateway, vector-store, search-engine]
available_blocks: [traffic-source, load-balancer, compute, llm-gateway, vector-store, cache, search-engine]
grants: [vector-store]
rewards:
  xp: 560
