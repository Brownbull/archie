id: async-backbone
title: Event Backbone
brief: >-
  Capstone: queue → stream → process → realtime fan-out, end-to-end. An AZ
  outage on the event stream mid-run tests your full pipeline's redundancy.
  Maintain uptime and latency across every tier under sustained load.
difficulty: advanced
budget_cap: 3500
duration_seconds: 180
traffic_curve:
  - { t: 0, rps: 200 }
  - { t: 30, rps: 1000 }
  - { t: 60, rps: 3000 }
  - { t: 90, rps: 4000 }
  - { t: 120, rps: 4000 }
  - { t: 150, rps: 2000 }
  - { t: 180, rps: 500 }
traffic_sources:
  - { type: api-client, rps: 2000, kind: realistic, workload: write, origin: one-region }
  - { type: web-users, rps: 2000, kind: realistic, workload: read, origin: one-region }
required_components:
  - compute
  - messaging
  - real-time
target_metrics:
  uptime_percent: 98.5
  p99_latency_ms: 250
  p95_latency_ms: 160
scheduled_events:
  - { t: 75, type: az_outage, target: messaging, durationS: 45 }
hints:
  - "The core problem is running a full event pipeline at 4000 rps under an AZ outage on messaging at t=75 for 45s — redundancy across the event-stream is critical because a single-AZ stream is a single point of failure."
  - "Place message-queue, event-stream, stream-processor, and realtime in sequence; size event-stream with multi-AZ replicas so the t=75-120 AZ outage on messaging does not drop the pipeline."
  - "Size event-stream with 3+ partitions and 2+ replicas across AZs to survive the outage; add cache to store computed state so realtime serves subscribers even if processor falls behind during recovery."
  - "Wire compute (2 replicas for writes) to message-queue to event-stream (multi-AZ); stream-processor (2 replicas) reads from stream with windowing to cache; realtime (2 replicas) reads from cache fanning to clients."
  - "Deploy compute 2 replicas; message-queue to event-stream with 3+ partitions, 2+ AZ-spanning replicas for outage survival; stream-processor 2 replicas; cache 2-3 replicas; realtime 2-3 replicas with load-balancer; meets 98.5% uptime and latency targets during 45s AZ outage."
schema_version: 2
track: realtime
tier: 5
requires: [realtime-live]
unlocks: []
min_xp: 10520
required_types: [message-queue, event-stream, stream-processor, realtime]
available_blocks: [compute, message-queue, event-stream, stream-processor, realtime, load-balancer, relational-db, cache, traffic-source]
grants: []
rewards:
  xp: 1600
