id: add-a-database
title: Persist It
brief: >-
  Your first service is live, and it has amnesia. Every restart wipes the slate — signups, orders,
  settings, gone — and users are tired of re-registering. Right now everything lives in memory,
  which is a polite way of saying nowhere. Something downstream has to actually remember your data
  when the power blips. Give the service a memory that survives a reboot, and keep 150 requests a
  second flowing while you do it.
difficulty: beginner
budget_cap: 160
duration_seconds: 60
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 90 }
  - { t: 60, rps: 150 }
traffic_sources:
  - { type: web-users, rps: 150, kind: realistic, workload: mixed, origin: one-region }
required_components:
  - compute
  - data-storage
target_metrics:
  uptime_percent: 95
  p99_latency_ms: 500
  p95_latency_ms: 300
hints:
  - "You need a relational database to persist state — wire compute downstream to a database node so reads and writes flow through."
  - "Single instances of both compute and database are enough at 150 RPS; the database adds latency to each request, so size both for peak load without saturation."
schema_version: 2
track: data
tier: 1
requires: [first-service]
unlocks: [cache-the-hot-path, data-pipeline]
required_types: [relational-db]
available_blocks: [compute, relational-db, traffic-source]
grants: [relational-db]
rewards:
  xp: 100
