id: event-stream
title: Stream the Data
brief: >-
  Your fire-and-forget queues forget: a consumer crashed last night and every in-flight message
  vanished with it. Now downstream teams want to replay past events from any point, in order — and
  1500 rps of writes keep pouring in. Keep throughput high while making sure every event survives
  to be read again.
difficulty: intermediate
budget_cap: 1200
duration_seconds: 120
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 500 }
  - { t: 60, rps: 1500 }
  - { t: 90, rps: 1500 }
  - { t: 120, rps: 500 }
traffic_sources:
  - { type: api-client, rps: 1500, kind: realistic, workload: write, origin: one-region }
required_components:
  - compute
  - messaging
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 250
  p95_latency_ms: 150
hints:
  - "The core problem is absorbing 1500 rps write traffic reliably with ordering guarantees — an event stream provides durability and replay semantics that fire-and-forget queues do not."
  - "Place an event-stream block to handle the 1500 rps write workload while maintaining ordering per partition and durability for offset replay."
  - "Size the event-stream with enough partitions to handle 1500 rps writes without bottlenecking; add cache downstream to serve repeated reads so consumers don't re-read same events."
  - "Wire compute to write to event-stream; add cache layer so reads of recent events are served from cache (p99 250ms, p95 150ms target) rather than re-reading from stream."
  - "Deploy compute with 2 replicas for the 1500 rps writes, feeding BOTH a message queue and an event stream — the queue decouples, the stream (a single Kafka broker carries this volume) retains and replays. A queue alone fails the brief."
schema_version: 2
track: realtime
tier: 2
requires: [async-pipeline]
unlocks: [stream-processor]
min_xp: 494
required_types: [event-stream, message-queue]
available_blocks: [compute, message-queue, event-stream, relational-db, nosql, cache, traffic-source]
grants: [event-stream]
rewards:
  xp: 260

# P5-S2 (D95): brownfield start — the fire-and-forget system the brief describes. The player
# inherits a running (and flawed) pipeline and must add durability/replay (the event stream).
# Needs-work gate: no event-stream block ⇒ required_types fails ⇒ <3★ as-seeded (harness-pinned).
initial_architecture:
  nodes:
    - { id: bf-traffic, component_id: api-client, config_variant_id: steady, position: { x: 60, y: 200 }, replicas: 1, traffic_rps: 1500, traffic_kind: realistic, traffic_workload: write }
    - { id: bf-api, component_id: node-express, config_variant_id: single-process, position: { x: 320, y: 200 }, replicas: 2 }
    - { id: bf-queue, component_id: rabbitmq, config_variant_id: single-node, position: { x: 580, y: 200 }, replicas: 1 }
  edges:
    - { id: bf-e0, source_node_id: bf-traffic, target_node_id: bf-api }
    - { id: bf-e1, source_node_id: bf-api, target_node_id: bf-queue }
