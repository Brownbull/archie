id: edge-balance
title: Load-Balanced Edge
brief: >-
  With DNS and replicas in place, add a load balancer at the edge to distribute
  traffic evenly. Keep latency low as the request count climbs — the balancer
  should absorb the growth before any single instance saturates.
difficulty: intermediate
budget_cap: 500
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 500 }
  - { t: 60, rps: 1200 }
  - { t: 90, rps: 1200 }
traffic_sources:
  - { type: web-users, rps: 1200, kind: realistic, workload: mixed, origin: one-region }
required_components:
  - delivery-network
  - compute
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 200
  p95_latency_ms: 150
hints:
  - "A load balancer prevents any single compute replica from overloading as traffic climbs toward 1200 RPS; DNS points to the balancer, which distributes requests evenly."
  - "DNS routes to load-balancer; balancer shards traffic across 2-3 compute replicas based on round-robin; as peak climbs to 1200 RPS, balancer keeps each replica under saturation."
  - "traffic-source → dns → load-balancer → compute (3 replicas for 400 RPS each at peak); dns points to load-balancer IP; each replica handles 1200/3=400 RPS at p99≤200ms; 98% uptime requires at least one healthy replica."
schema_version: 2
track: edge
tier: 2
requires: [dns-routing, scale-out]
unlocks: [edge-delivery, edge-cache-ratio]
min_xp: 494
required_types: [dns, load-balancer]
available_blocks: [compute, traffic-source, dns, load-balancer]
grants: []
rewards:
  xp: 260
