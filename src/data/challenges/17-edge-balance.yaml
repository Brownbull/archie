id: edge-balance
title: Load-Balanced Edge
brief: >-
  Launch week, and the graphs are doing that thing: one box pinned at 100% while its siblings sit
  bored. Every request lands on the same replica, because nothing at the front door is dealing out
  the crowd. Traffic climbs to 1,200 a second and stays there — let one machine eat it all and
  latency blows the bar long before the peak. You learned to scale out; now make the fleet
  actually share. Whatever greets traffic at the edge has to spread requests evenly, so no single
  replica ever saturates.
difficulty: intermediate
budget_cap: 500
duration_seconds: 90
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 30, rps: 500 }
  - { t: 60, rps: 1200 }
  - { t: 90, rps: 1200 }
traffic_sources:
  - { type: web-users, rps: 1200, kind: realistic, workload: mixed, origin: one-region }
required_components:
  - delivery-network
  - compute
target_metrics:
  uptime_percent: 98
  p99_latency_ms: 200
  p95_latency_ms: 150
hints:
  - "A load balancer prevents any single compute replica from overloading as traffic climbs toward 1200 RPS; DNS points to the balancer, which distributes requests evenly."
  - "DNS routes to load-balancer; balancer shards traffic across 2-3 compute replicas based on round-robin; as peak climbs to 1200 RPS, balancer keeps each replica under saturation."
  - "traffic-source → dns → load-balancer → compute (2-3 replicas); dns points at the load-balancer, which splits the 1200 RPS peak evenly — at 2 replicas that is 600 each, comfortably inside p99 200ms. Uptime needs at least one healthy replica at all times."
schema_version: 2
track: edge
tier: 2
requires: [dns-routing, scale-out]
unlocks: [edge-delivery, edge-cache-ratio]
min_xp: 494
required_types: [dns, load-balancer]
available_blocks: [compute, traffic-source, dns, load-balancer]
grants: []
rewards:
  xp: 260
