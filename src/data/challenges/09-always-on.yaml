id: always-on
title: Always On
brief: >-
  A production platform under sustained heavy load, with observability expected.
  Build a full multi-tier system — edge, scaled compute, cache, data-storage,
  and monitoring — that holds a strict latency target at scale and stays under
  a generous-but-not-infinite budget.
difficulty: advanced
budget_cap: 1300
duration_seconds: 110
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 55, rps: 2000 }
  - { t: 110, rps: 3000 }
required_components:
  - delivery-network
  - compute
  - caching
  - data-storage
  - monitoring
target_metrics:
  uptime_percent: 99.5
  p99_latency_ms: 200
hints:
  - Every tier on the request path carries the load routed to it — size edge, compute, cache, and data-storage so none exceeds 100% at peak.
  - Scale compute with replicas behind the edge/LB until peak traffic fits under capacity.
  - Keep monitoring off the request path — wired as a leaf it adds budget cost but no load or latency, which is the point.
schema_version: 2
track: reliability
tier: 4
requires: [zone-failure]
unlocks: [chaos-day, fortress, production-ai]
available_blocks: [compute, relational-db, observability, load-balancer, cache, cdn, message-queue]
grants: []
rewards:
  xp: 200
