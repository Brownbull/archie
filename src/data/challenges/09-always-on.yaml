id: always-on
title: Always On
brief: >-
  A production platform under sustained heavy load, with observability expected. Hold a strict
  latency target at scale and stay under a generous-but-not-infinite budget.
difficulty: advanced
budget_cap: 1300
duration_seconds: 110
traffic_curve:
  - { t: 0, rps: 0 }
  - { t: 55, rps: 2000 }
  - { t: 110, rps: 3000 }
traffic_sources:
  - { type: web-users, rps: 3000, kind: realistic, workload: mixed, origin: one-region }
required_components:
  - delivery-network
  - compute
  - caching
  - data-storage
  - monitoring
target_metrics:
  uptime_percent: 99.5
  p99_latency_ms: 200
  p95_latency_ms: 155
hints:
  - "The core problem is building a production tier that scales to 3000 RPS while holding p99 200ms and p95 155ms under a 1300-unit budget."
  - "Distribute traffic across delivery-network (edge), scaled compute, cache, and data-storage so no single tier exceeds 100% load at peak."
  - "Put the cache in front of data-storage so reads barely touch the database — with the hot path absorbed, a couple of compute replicas behind the load-balancer carry the rest. Observability hangs off as a leaf."
  - "Each tier sizes for peak: CDN absorbs traffic, load-balancer fans out to compute, compute queries cache first, cache backs off to database."
  - "CDN → load-balancer → 10 compute replicas → cache → relational-db with observability as leaf. Target 300 RPS per compute, 1500 RPS per cache, cache filtering ~70% of reads to keep all nodes under 90%."
schema_version: 2
track: reliability
tier: 4
requires: [zone-failure, cache-the-hot-path]
unlocks: [chaos-day, fortress, production-ai]
min_xp: 5138
required_types: [observability, load-balancer, cache]
available_blocks: [compute, relational-db, observability, load-balancer, cache, cdn, message-queue]
grants: []
rewards:
  xp: 960
