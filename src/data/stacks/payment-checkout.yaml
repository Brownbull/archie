id: payment-checkout
name: Payment Checkout Flow
description: Take payments and process orders asynchronously — an app service hands checkout to a hosted payment provider, queues fulfillment work, and records orders in a replicated database.
components:
  - component_id: node-express
    variant_id: cluster-mode
    relative_position: { x: 0, y: 0 }
  - component_id: stripe
    variant_id: hosted-checkout
    relative_position: { x: 240, y: -90 }
  - component_id: aws-sqs
    variant_id: standard-queue
    relative_position: { x: 240, y: 90 }
  - component_id: postgresql
    variant_id: primary-replica
    relative_position: { x: 480, y: 0 }
connections:
  - source_component_index: 0
    target_component_index: 1
    connection_type: http
  - source_component_index: 0
    target_component_index: 2
    connection_type: stream
  - source_component_index: 0
    target_component_index: 3
    connection_type: database
