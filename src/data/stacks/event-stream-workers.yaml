id: event-stream-workers
name: Event Stream + Workers
description: Decouple producers from consumers with a durable event log — a producer publishes to a streaming broker that fans out to scaled worker services persisting to a database.
components:
  - component_id: go-service
    variant_id: horizontal-pods
    relative_position: { x: 0, y: 0 }
  - component_id: kafka
    variant_id: multi-broker
    relative_position: { x: 240, y: 0 }
  - component_id: node-express
    variant_id: cluster-mode
    relative_position: { x: 480, y: 0 }
  - component_id: postgresql
    variant_id: primary-replica
    relative_position: { x: 720, y: 0 }
connections:
  - source_component_index: 0
    target_component_index: 1
    connection_type: stream
  - source_component_index: 1
    target_component_index: 2
    connection_type: stream
  - source_component_index: 2
    target_component_index: 3
    connection_type: database
