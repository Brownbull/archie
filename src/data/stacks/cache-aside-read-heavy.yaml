id: cache-aside-read-heavy
name: Cache-Aside Read-Heavy
description: Absorb read-dominant traffic cheaply — a load balancer spreads requests across app servers that check a distributed cache first and fall through to a read-replica database on a miss.
components:
  - component_id: haproxy
    variant_id: http-l7
    relative_position: { x: 0, y: 0 }
  - component_id: node-express
    variant_id: cluster-mode
    relative_position: { x: 240, y: 0 }
  - component_id: redis-cache
    variant_id: distributed-cache
    relative_position: { x: 480, y: -90 }
  - component_id: postgresql
    variant_id: primary-replica
    relative_position: { x: 480, y: 90 }
connections:
  - source_component_index: 0
    target_component_index: 1
    connection_type: http
  - source_component_index: 1
    target_component_index: 2
    connection_type: cache
  - source_component_index: 1
    target_component_index: 3
    connection_type: database
