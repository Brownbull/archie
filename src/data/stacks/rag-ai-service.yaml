id: rag-ai-service
name: RAG AI Service
description: Retrieval-augmented generation backend — an app service queries a vector store for context, calls a managed multi-model LLM gateway for inference, and stores conversations in a database.
components:
  - component_id: node-express
    variant_id: cluster-mode
    relative_position: { x: 0, y: 0 }
  - component_id: aws-bedrock
    variant_id: on-demand
    relative_position: { x: 240, y: -90 }
  - component_id: pinecone
    variant_id: serverless
    relative_position: { x: 240, y: 90 }
  - component_id: postgresql
    variant_id: single-node
    relative_position: { x: 480, y: 0 }
connections:
  - source_component_index: 0
    target_component_index: 1
    connection_type: http
  - source_component_index: 0
    target_component_index: 2
    connection_type: database
  - source_component_index: 0
    target_component_index: 3
    connection_type: database
