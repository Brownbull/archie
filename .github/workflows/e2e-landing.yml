name: E2E (landing — home-screen check)

# Fast counterpart to e2e-desktop.yml. The heavy app suite is skipped for home-screen-only pushes
# (see paths-ignore there); this runs in its place — just the landing/home specs (~a handful of tests
# vs ~290), so marketing-page iterations get a CI safety net without the ~13-minute app suite.
#
# Triggers ONLY when a push changes landing files. Uses the same Firebase + primary test-account
# secrets as e2e-desktop (the guest-CTA test boots the app shell, and global-setup authenticates via
# the dev-only Test Login). Skips gracefully if secrets are unset.

on:
  push:
    branches: [dev, main]
    paths:
      - "src/components/landing/**"
      - "public/landing/**"
      - "tests/e2e/landing.spec.ts"
  workflow_dispatch:

concurrency:
  group: e2e-landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-landing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_TEST_EMAIL: ${{ secrets.VITE_TEST_EMAIL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check secrets configured
        id: guard
        run: |
          if [ -z "$VITE_TEST_EMAIL" ]; then
            echo "::notice::VITE_TEST_EMAIL secret not set — skipping landing E2E."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright (chromium)
        if: steps.guard.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium

      - name: Write .env.local from secrets
        if: steps.guard.outputs.configured == 'true'
        run: |
          cat > .env.local <<EOF
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_TEST_EMAIL=${{ secrets.VITE_TEST_EMAIL }}
          VITE_TEST_PASSWORD=${{ secrets.VITE_TEST_PASSWORD }}
          EOF

      - name: Run landing E2E
        if: steps.guard.outputs.configured == 'true'
        run: npx playwright test landing.spec.ts --project=desktop --workers=2

      - name: Upload Playwright artifacts
        if: ${{ failure() && steps.guard.outputs.configured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-landing
          path: |
            playwright-report/
            test-results/
          retention-days: 7
