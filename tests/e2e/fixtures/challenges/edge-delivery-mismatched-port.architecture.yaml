schema_version: 4.0.0
name: edge-delivery — 3★ reference build with ONE port-mismatched edge (Phase 2 evidence, D87)
# Identical to edge-delivery.architecture.yaml EXCEPT e2 carries explicit MISMATCHED handles
# (nginx http-out → node-express auth-in: http → auth type mismatch). The sim routes by
# source/target only, so metrics/budget/topology score identically to the 3★ reference — the
# ONLY delta is the D87 port gate, which must cost exactly the well-formed star (3★ → 2★).
nodes:
  - id: n-load-balancer
    component_id: nginx
    config_variant_id: reverse-proxy
    position:
      x: 0
      'y': 0
    replicas: 1
  - id: n-compute
    component_id: node-express
    config_variant_id: single-process
    position:
      x: 220
      'y': 0
    replicas: 1
  - id: n-cdn
    component_id: cloudflare-cdn
    config_variant_id: static-caching
    position:
      x: 440
      'y': 0
    replicas: 1
  - id: n-traffic-0
    component_id: web-users
    config_variant_id: heavy
    position:
      x: 660
      'y': 0
    replicas: 1
    traffic_rps: 800
    traffic_workload: read
edges:
  - id: e0
    source_node_id: n-traffic-0
    target_node_id: n-cdn
  - id: e1
    source_node_id: n-cdn
    target_node_id: n-load-balancer
  - id: e2
    source_node_id: n-load-balancer
    target_node_id: n-compute
    source_handle_id: http-out
    target_handle_id: auth-in
